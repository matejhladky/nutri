        options:
          - { text: "Velmi nízkosacharidová", correct: true }
          - { text: "Nízkosacharidová", why: "Ta má 21–60 g." }
          - { text: "Se sníženým příjmem sacharidů", why: "Ta má 61–100 g." }
          - { text: "Volnější nízkosacharidová", why: "Ta má 101–130 g." }

  - id: alt.keto
    title: Ketogenní dieta
    kind: concept
    tier: B
    status: course-disputed
    note: >-
      **Skripta:** keto = maximální omezení sacharidů s „doplňováním velkého množství bílkovin“,
      zelenina a ovoce jsou na začátku vyřazené (s. 196); s. 89 uvádí ketolátky z tuků.
      **Současné poznatky / předpisy:** klinicky používaná ketogenní dieta je vysokotuková
      s přiměřeným (ne vysokým) příjmem bílkovin – nadbytek bílkovin ketózu oslabuje – a bezškrobová
      zelenina v ní zůstává; zavedenou léčbou je u farmakorezistentní epilepsie. Diabetik na lécích
      (inzulin, deriváty sulfonylurey, glifloziny) ji smí zkoušet jen pod dohledem lékaře (riziko
      hypoglykémie, u gliflozinů ketoacidózy). **Ke zkoušce:** platí podle obou – maximální omezení
      sacharidů, tělo přejde na tuky a tvoří ketolátky. Pokud se otázka výslovně ptá na skripta,
      jejich popis zdůrazňuje i velké množství bílkovin.
    criteria: [6a, 7b]
    confusableWith: [alt.lchf]
    prereqs: [alt.lchf]
    source: { pages: [196, 89, 194], anchor: "Ketogenní dieta znamená maximální omezení příjmu sacharidů" }
    explanation: >-
      Keto = maximální omezení sacharidů. Tělo pak místo glukózy využívá uložený tuk a tvoří ketolátky
      (nutriční ketóza); při dostatku bílkovin šetří svaly. Základ: maso, sýry, ryby, vejce, oleje;
      vyřazuje cukr, obiloviny a průmyslově zpracované potraviny. Výhody: efektivní hubnutí, lepší
      glykémie (DM2); léčebně u epilepsie. Nevýhody: málo vitaminů, minerálů a vlákniny, „keto
      chřipka“ (bolest hlavy, únava, nevolnost, podrážděnost), obtížná udržitelnost, jojo efekt.
    exercises:
      - id: hodnoceni
        type: explain
        prompt: "Vysvětli princip ketogenní diety, její výhody a nevýhody."
        keyPoints:
          - "Maximální omezení sacharidů → tělo využívá tuky, tvoří ketolátky"
          - "Maso, sýry, ryby, vejce, oleje; bez cukru a obilovin"
          - "Výhody: hubnutí, glykémie u DM2; léčebně epilepsie"
          - "Nevýhody: málo vitaminů, minerálů, vlákniny; keto chřipka"
          - "Obtížná udržitelnost, jojo efekt"
        modelAnswer: >-
          Ketogenní dieta maximálně omezuje sacharidy, takže tělo přejde na tuky a tvoří ketolátky –
          mluvíme o nutriční ketóze. Jí se hlavně maso, sýry, ryby, vejce a oleje, vyřazuje se cukr a
          obiloviny. Je účinná pro hubnutí a zlepšuje glykémii u diabetu 2. typu, léčebně se používá
          u epilepsie. Je ale velmi přísná, chudá na vitaminy, minerály a vlákninu, při přechodu bývá
          keto chřipka a dlouhodobě se těžko dodržuje, takže hrozí jojo efekt.
      - id: keto-chripka
        type: choice
        prompt: "Co je tzv. „keto chřipka“?"
        options:
          - { text: "Bolest hlavy, únava, nevolnost a podrážděnost při přechodu na dietu", correct: true }
          - { text: "Virová infekce, ke které jsou lidé na keto náchylnější", why: "Nejde o infekci, ale o přechodné potíže při přechodu na dietu." }
          - { text: "Horečka z nadbytku bílkovin", why: "S bílkovinami ani s horečkou nesouvisí." }
          - { text: "Dlouhodobý následek ukončení keto diety", why: "Objevuje se při přechodu na dietu, ne po jejím ukončení." }
      - id: epilepsie
        type: choice
        prompt: "U kterého onemocnění je ketogenní dieta zavedenou léčebnou možností?"
        options:
          - { text: "Epilepsie", correct: true }
          - { text: "Celiakie", why: "Celiakie se léčí bezlepkovou dietou." }
          - { text: "Dna", why: "Pro dnu se ketogenní dieta jako léčba neuvádí." }
          - { text: "Anémie", why: "Pro anémii se ketogenní dieta neuvádí." }

  - id: alt.paleo
    title: Paleo dieta
    kind: concept
    tier: B
    criteria: [6a, 7b]
    source: { pages: [196, 197], anchor: "strava typu „lovec a sběrač”" }
    explanation: >-
      Paleo („lovec a sběrač“) vychází z představy, že se genom od doby kamenné téměř nezměnil a
      trávení není přizpůsobené obilí ani mléku. Základ: maso, vejce, ryby, volně rostoucí plodiny,
      bobuloviny; vylučuje obiloviny, pečivo, mléko a mléčné výrobky. Poměr živin zónový 40 % S,
      30 % B, 30 % T. Výhody: sytost, nezpracované potraviny, méně cukru. Nevýhody: nedostatek
      vápníku a vitaminu D, cena, udržitelnost.
    exercises:
      - id: vylucuje
        type: choice
        prompt: "Které skupiny potravin paleo strava vylučuje nebo omezuje?"
        options:
          - { text: "Obiloviny a mléčné výrobky", correct: true }
          - { text: "Maso, vnitřnosti a vejce", why: "Ty tvoří základ paleo stravy." }
          - { text: "Bobuloviny a lesní plody", why: "Ty jsou v paleo stravě povolené." }
          - { text: "Ryby a mořské plody", why: "Ryby patří k základu paleo stravy." }
      - id: riziko
        type: reveal
        prompt: "Jaký nutriční deficit hrozí u paleo stravy a proč?"
        answer: "Vápník a vitamin D – kvůli vyřazení mléčných výrobků (a obilovin)."

  - id: alt.carnivore
    title: Carnivore dieta
    kind: concept
    tier: B
    status: course-disputed
    note: >-
      **Skripta:** carnivore „bývá používána např. u Crohnovy choroby či ulcerózní kolitidy“ a má
      snižovat záněty; zároveň uvádějí, že ji žádná uznávaná organizace nepodporuje (s. 197).
      **Současné poznatky / předpisy:** pro léčebné využití u střevních zánětů chybí kvalitní studie;
      dietní léčbu IBD vede gastroenterolog a nutriční terapeut. **Ke zkoušce:** platí podle obou –
      zdůraznit rizika (vitamin C, vláknina, nasycené tuky) a to, že ji odborné organizace
      nedoporučují; klienta s Crohnovou chorobou nebo kolitidou poradce na carnivore nepřevádí.
    criteria: [6a, 7b]
    source: { pages: [197], anchor: "vylučuje veškeré rostlinné potraviny" }
    explanation: >-
      Carnivore = jen živočišné produkty (maso, ryby, vejce, vnitřnosti), žádné ovoce, zelenina,
      obiloviny, luštěniny, ořechy ani semena; téměř nulové sacharidy – extrémní forma low-carb/keto.
      Zastánci uvádějí rychlé hubnutí a lepší glykémii. Rizika: nedostatek vitaminu C a vlákniny,
      hodně nasycených tuků (srdce a cévy), malá pestrost, neudržitelnost. Žádná uznávaná organizace
      ji nepovažuje za vyváženou ani bezpečnou.
    exercises:
      - id: rizika
        type: choice
        multiple: true
        prompt: "Která rizika carnivore diety skripta uvádějí?"
        options:
          - { text: "Nedostatek vitaminu C a vlákniny", correct: true }
          - { text: "Vysoký příjem nasycených tuků", correct: true }
          - { text: "Malá pestrost a obtížná udržitelnost", correct: true }
          - { text: "Nedostatek bílkovin", why: "Bílkovin je v carnivore stravě dostatek." }
      - id: postoj
        type: reveal
        prompt: "Jak se k carnivore dietě staví odborné organizace?"
        answer: "Žádná uznávaná organizace (AND, BDA, DGE, WHO, SZÚ) ji nepodporuje ani nepovažuje za vyváženou a bezpečnou dlouhodobou stravu."

  - id: alt.raw
    title: RAW strava
    kind: concept
    tier: B
    criteria: [6a]
    source: { pages: [198], anchor: "neprošly tepelnou úpravou nad určitou teplotu, obvykle mezi 40–48 °C" }
    explanation: >-
      RAW = potraviny neupravené nad asi 40–48 °C (víra, že vaření ničí živiny a enzymy). Hodně ovoce,
      zeleniny, ořechů, semen, naklíčených obilovin a luštěnin, úprava sušením či fermentací; může
      zahrnovat i syrové maso, ryby, vejce a nepasterizované mléko. Rizika: hygiena (u nás vhodná jen
      v létě), kontaminace bakteriemi a parazity, luštěniny a obiloviny syrové nepoužitelné → málo
      bílkovin, monotónnost, časová a finanční náročnost. Nevhodná pro děti, těhotné a seniory.
    exercises:
      - id: hodnoceni
        type: explain
        prompt: "Klientka zvažuje RAW stravu. Jaká rizika s ní probereš?"
        keyPoints:
          - "Bez tepelné úpravy nad cca 40–48 °C"
          - "Hygienické riziko – kontaminace bakteriemi, parazity (syrové maso, ryby, vejce)"
          - "Luštěniny a většina obilovin syrové nepoužitelné → riziko nízkého příjmu bílkovin"
          - "Monotónnost, časová a finanční náročnost, sociální omezení"
          - "Nevhodná pro děti, těhotné, seniory"
        modelAnswer: >-
          RAW strava vylučuje potraviny upravené nad zhruba 40–48 °C. V našem klimatu je hygienicky
          riziková, prakticky vhodná jen v létě, a u syrového masa, ryb či vajec hrozí kontaminace
          bakteriemi a parazity. Luštěniny a většinu obilovin nelze jíst syrové, takže hrozí nízký
          příjem bílkovin a úbytek svalů. Strava je monotónní, časově i finančně náročná a omezuje
          společenský život. Pro děti, těhotné a seniory vhodná není.
      - id: teplota
        type: choice
        prompt: "Nad jakou teplotu se podle RAW stravy potraviny obvykle neupravují?"
        options:
          - { text: "40–48 °C", correct: true }
          - { text: "70–80 °C", why: "Skripta uvádějí obvykle 40–48 °C." }
          - { text: "100 °C (bod varu)", why: "Skripta uvádějí obvykle 40–48 °C." }
          - { text: "20–25 °C", why: "Tak nízkou hranici skripta neuvádějí – obvykle 40–48 °C." }
      - id: bilkoviny
        type: choice
        prompt: "Proč je u RAW stravy obtížné zajistit dostatek kvalitních rostlinných bílkovin?"
        options:
          - { text: "Luštěniny a většina obilovin jsou syrové nepoužitelné.", correct: true }
          - { text: "RAW strava zakazuje ořechy, semena a klíčky.", why: "Ořechy a semena jsou v RAW stravě základní." }
          - { text: "Syrové bílkoviny lidské tělo neumí vůbec trávit.", why: "Problém je v tom, že luštěniny a obiloviny syrové použít nelze." }
          - { text: "Rostlinné bílkoviny se rozkládají už nad 40 °C.", why: "Nedostatek bílkovin plyne z nepoužitelnosti syrových luštěnin a obilovin." }

  - id: alt.krevni-skupiny
    title: Dieta podle krevních skupin
    kind: concept
    tier: B
    criteria: [7b, 6a]
    source: { pages: [198, 199], anchor: "odborná obec ji považuje za vyvrácenou" }
    explanation: >-
      Autor Peter D'Adamo (1996): lidé s různými krevními skupinami mají jíst jinak. Skupina A
      „zemědělec“ – vegetariánská strava; B „pastevec“; AB zemědělec i pastevec; 0 „lovec“ – bílkoviny
      (maso, ryby), méně obilovin a mléka. Systematické přehledy nenašly žádný kvalitní důkaz,
      odborná obec dietu považuje za vyvrácenou. Svépomocí sestavený jídelníček může být deficitní.
    exercises:
      - id: dukaz
        type: choice
        prompt: "Jak odborná obec hodnotí dietu podle krevních skupin?"
        options:
          - { text: "Jako vyvrácenou – kvalitní důkazy chybí.", correct: true }
          - { text: "Jako vhodnou pro skupinu 0, ale nevhodnou pro skupinu A.", why: "Důkazy chybí pro všechny skupiny." }
          - { text: "Jako podloženou genetickými studiemi o antigenech.", why: "Systematické přehledy žádné důkazy nenašly." }
          - { text: "Jako oficiální doporučení SZÚ pro dospělé.", why: "SZÚ ji nedoporučuje; odborná obec ji považuje za vyvrácenou." }
      - id: skupiny
        type: reveal
        prompt: "Jaké „typy“ přiřazuje dieta podle krevních skupin skupinám A, B, AB a 0?"
        answer: "A – zemědělec, B – pastevec, AB – zemědělec i pastevec, 0 – lovec."

  - id: alt.atkins-dukan
    title: Atkinsova a Dukanova dieta
    kind: comparison
    tier: B
    criteria: [7b]
    prereqs: [alt.lchf]
    source: { pages: [199], anchor: "První, indukční fáze trvá 14 dní s max. 20 g sacharidů denně" }
    explanation: >-
      Atkinsova: nízkosacharidová, bohatá na tuky a bílkoviny (maso, tučné sýry, vejce); indukční fáze
      14 dní s max. 20 g sacharidů, pak se sacharidy postupně přidávají. Kalorie se nepočítají, hubnutí
      rychlé. Dukanova: vysokobílkovinná, nízkosacharidová i nízkotučná, 4 fáze – útočná (jen
      bílkoviny), střídání (+ zelenina), konsolidační (+ ovoce, chléb), stabilizační (1 bílkovinný den
      týdně). Atkins: chuť na sladké, málo energie, dlouhodobá bezpečnost sporná. Dukan: nevyváženost,
      jojo efekt.
    exercises:
      - id: rozdil
        type: choice
        prompt: "Čím se Dukanova dieta liší od Atkinsovy?"
        options:
          - { text: "Omezuje i tuky; Atkinsova tuky povoluje.", correct: true }
          - { text: "Dukanova je naopak vysokosacharidová.", why: "Obě jsou nízkosacharidové." }
          - { text: "Atkinsova je vegetariánská, Dukanova ne.", why: "Atkinsova je převážně živočišná strava bohatá na tuky." }
          - { text: "Dukanova nemá fáze, Atkinsova ano.", why: "Dukanova má 4 fáze." }
      - id: indukce
        type: reveal
        prompt: "Jak vypadá první fáze Atkinsovy a první fáze Dukanovy diety?"
        answer: "Atkins: indukční fáze 14 dní, max. 20 g sacharidů denně. Dukan: útočná fáze – pouze bílkoviny (maso, vejce, nízkotučný tvaroh)."

  - id: alt.stredomorska
    title: Středomořská strava
    kind: concept
    tier: C
    criteria: [6a]
    source: { pages: [200], anchor: "Primárně není určena k hubnutí" }
    explanation: >-
      Převážně rostlinná strava zemí Středomoří: zelenina, ovoce, olivový olej, ořechy, semena,
      luštěniny, celozrnné obiloviny, bylinky; méně ryb, libového masa, mléčných výrobků a vajec;
      minimum červeného masa a průmyslově zpracovaných potravin. Patří k nejzdravějším směrům, ale
      primárně není určena k hubnutí – je to spíš životní styl.
    exercises:
      - id: hubnuti
        type: choice
        prompt: "Které tvrzení o středomořské stravě odpovídá skriptům?"
        options:
          - { text: "Patří k nejzdravějším směrům, ale primárně není určena k hubnutí.", correct: true }
          - { text: "Je to především redukční dieta s rychlým úbytkem hmotnosti.", why: "Primárně není určena k hubnutí – je to spíš životní styl." }
          - { text: "Je založená hlavně na červeném mase.", why: "Červeného masa obsahuje velmi málo." }
          - { text: "Vylučuje olivový olej kvůli vysoké energii.", why: "Olivový olej patří k jejím základům." }

  - id: alt.prerusovany-pust
    title: Přerušovaný půst (IF)
    kind: concept
    tier: A
    note: >-
      Citaci postoje AND (s. 201) se v primárním zdroji ověřit nepodařilo – formální stanovisko AND
      k přerušovanému půstu jsme nenašli. Bezpečnostní jádro ale platí: u diabetiků na inzulinu nebo
      derivátech sulfonylurey hrozí při půstu hypoglykémie, režim musí upravit lékař.
    criteria: [7b]
    source: { pages: [200, 201], anchor: "střídá období jídla s obdobími půstu" }
    explanation: >-
      IF střídá období jídla a půstu. Metody: 16/8 (jí se v 8hodinovém okně) a 5:2 (dva dny v týdnu
      500–600 kcal). Může zlepšit inzulinovou senzitivitu a lipidy; hubne se díky deficitu – podobně
      jako při klasické redukční dietě. Nevhodný při poruchách příjmu potravy, v těhotenství, pro
      děti a při náročném fyzickém režimu; u žen může narušit cyklus. Riziko přejídání v okně, nízká
      adherence. DGE: žádná výhoda oproti jiné redukci; AND ho podle skript nedoporučuje (nevhodný
      i pro diabetiky – diabetik na lécích jen po domluvě s lékařem).
    exercises:
      - id: hodnoceni
        type: explain
        prompt: "Klientka chce hubnout přerušovaným půstem. Jak jí ho vysvětlíš a zhodnotíš?"
        keyPoints:
          - "Střídání jídla a půstu: 16/8, 5:2 (2 dny 500–600 kcal)"
          - "Hubne se díky kalorickému deficitu – výsledky podobné klasické redukci"
          - "Možné zlepšení inzulinové senzitivity a lipidů"
          - "Nevhodný: PPP, těhotenství, děti, náročný fyzický režim; u žen cyklus"
          - "Riziko přejídání v okně, nízká adherence"
        modelAnswer: >-
          Přerušovaný půst střídá období jídla a půstu – nejčastěji 16/8, kdy se jí v osmihodinovém
          okně, nebo 5:2 se dvěma dny po 500–600 kcal. Hubne se díky kalorickému deficitu a výsledky
          jsou podobné jako u klasické redukční diety; může zlepšit inzulinovou senzitivitu a lipidy.
          Není vhodný při poruchách příjmu potravy, v těhotenství, pro děti ani při náročném fyzickém
          režimu a u některých žen může narušit cyklus. Hrozí i přejídání v jídelním okně.
      - id: metoda-52
        type: choice
        prompt: "Co znamená metoda přerušovaného půstu 5:2?"
        options:
          - { text: "5 dní normálně, 2 dny v týdnu 500–600 kcal", correct: true }
          - { text: "5 hodin jídla, 2 hodiny půstu", why: "Čísla 5:2 označují dny v týdnu, ne hodiny." }
          - { text: "5 jídel denně, z toho 2 bez sacharidů", why: "Jde o dny v týdnu se sníženým příjmem energie." }
          - { text: "5 dní půst, 2 dny normálně", why: "Je to naopak – 5 dní normálně, 2 dny 500–600 kcal." }
      - id: nevhodny
        type: choice
        multiple: true
        prompt: "Pro koho podle skript přerušovaný půst není vhodný?"
        options:
          - { text: "Pro osoby s poruchou příjmu potravy", correct: true }
          - { text: "Pro těhotné", correct: true }
          - { text: "Pro děti", correct: true }
          - { text: "Pro zdravého dospělého s nadváhou", why: "U něj může IF fungovat jako jedna z redukčních strategií." }

  - id: alt.intuitivni
    title: Intuitivní stravování
    kind: concept
    tier: B
    criteria: [7b]
    source: { pages: [201], anchor: "aktivně naslouchá biologickým potřebám svého těla" }
    explanation: >-
      Strávník naslouchá tělu: jí, když má hlad, do příjemné sytosti. Nezakazuje potraviny, neurčuje,
      kdy jíst, nedělí potraviny na dobré a špatné. Pozor: u většiny klientů s obezitou či
      metabolickým syndromem jsou signály hladu a sytosti narušené, takže samostatně nemusí fungovat.
      Nevýhody: klient může sníst víc a přechod na tento styl trvá dlouho.
    exercises:
      - id: obezita
        type: choice
        prompt: "Proč nemusí být intuitivní stravování vhodnou samostatnou strategií u klienta s obezitou?"
        options:
          - { text: "Mívá narušené fyziologické signály hladu a sytosti.", correct: true }
          - { text: "Protože intuitivní stravování zakazuje sacharidy.", why: "Intuitivní stravování nic nezakazuje." }
          - { text: "Protože vyžaduje přesné vážení jídla.", why: "Intuitivní stravování nic neváží ani nepočítá." }
          - { text: "Protože je určené jen pro sportovce.", why: "Není určené konkrétní skupině; problémem jsou narušené signály hladu a sytosti." }
      - id: princip
        type: reveal
        prompt: "Na čem je založeno intuitivní stravování?"
        answer: "Na respektování signálů hladu a sytosti – jíst při hladu do příjemné sytosti, bez zákazů a bez dělení na dobré a špatné potraviny."

  - id: alt.iifym
    title: IIFYM (If It Fits Your Macros)
    kind: concept
    tier: C
    criteria: [7b]
    source: { pages: [201, 202], anchor: "flexibilní dietní přístup, který se zaměřuje na dosažení konkrétních cílů" }
    explanation: >-
      IIFYM je flexibilní přístup: cílem je splnit individuálně spočítaný příjem energie a makroživin
      (bílkoviny, tuky, sacharidy) podle cíle, přičemž jíst lze v podstatě cokoli, co se do čísel
      vejde. Výhoda: volnost, udržitelnost, lepší vztah k jídlu. Pozor: je třeba hlídat i výživovou
      kvalitu potravin, nejen čísla.
    exercises:
      - id: princip
        type: choice
        prompt: "Co je podstatou přístupu IIFYM?"
        options:
          - { text: "Splnit denní cíle makroživin, nic nezakazovat", correct: true }
          - { text: "Jíst jen v osmihodinovém okně, zbytek dne nic", why: "To je přerušovaný půst 16/8." }
          - { text: "Jíst podle signálů hladu a sytosti bez počítání", why: "To je intuitivní stravování." }
          - { text: "Vyřadit sacharidy a jíst hlavně maso a tuky", why: "IIFYM nevyřazuje skupiny potravin, sacharidy jsou součástí makro cílů." }

  - id: alt.modre-zony
    title: Modré zóny
    kind: concept
    tier: C
    criteria: [6a]
    source: { pages: [202], anchor: "Okinawané jedí jen do 80 % sytosti" }
    explanation: >-
      Oblasti s mnoha stoletými lidmi: Okinawa, Sardinie, Ikaria, Nicoya a Loma Linda (adventisté).
      Společné: převážně rostlinná strava s luštěninami, maso 1–2× týdně, minimum zpracovaných
      potravin, střídmost (Okinawa: jíst do 80 % sytosti), pohyb, vztahy, smysl života. Koncept je
      odborně zpochybňován (nespolehlivé záznamy o věku) – prezentovat ho jako inspiraci, ne důkaz.
    exercises:
      - id: spolecne
        type: reveal
        prompt: "Jaké jsou společné znaky stravování v Modrých zónách a s jakou výhradou je máš klientovi podat?"
        answer: >-
          Převážně rostlinná strava, hodně luštěnin, maso 1–2× týdně, minimum zpracovaných potravin,
          střídmost. Koncept je zpochybňovaný (nespolehlivá data o věku) – jen jako inspirace.
