            correct: true
          - text: "Na jednu porci"
            why: "Přepočet na porci může být uveden navíc."
          - text: "Na celé balení"
            why: "Povinný základ je 100 g / 100 ml."
          - text: "Na 1 000 kJ"
            why: "Takový přepočet se nepoužívá."
      - id: vyklad
        type: explain
        prompt: "Vysvětli klientce, co najde v tabulce výživových údajů a jak ji číst."
        keyPoints:
          - "Energie, tuky, z toho nasycené MK, sacharidy, z toho cukry, bílkoviny, sůl"
          - "Vláknina je dobrovolná"
          - "Přepočet na 100 g / 100 ml (dobře se srovnávají výrobky), případně i na porci"
          - "Vitaminy a minerály jen při tvrzení nebo fortifikaci – s % referenční hodnoty"
        modelAnswer: >-
          V tabulce je vždy energetická hodnota, tuky a z nich nasycené mastné kyseliny, sacharidy
          a z nich cukry, bílkoviny a sůl, vláknina jen dobrovolně. Hodnoty jsou na 100 g nebo 100 ml,
