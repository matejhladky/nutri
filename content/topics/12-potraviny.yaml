      sacharidy, z toho cukry, bílkoviny a sůl. Vláknina je dobrovolná. Vše se přepočítává na 100 g
      nebo 100 ml, případně navíc na porci. Vitaminy a minerální látky jsou povinné jen tehdy, když
      je na obalu tvrzení nebo jde o fortifikovanou potravinu – pak s množstvím i % referenční
      hodnoty příjmu (dříve DDD).
