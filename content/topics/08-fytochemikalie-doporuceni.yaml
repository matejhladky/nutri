topic:
  id: fyto-doporuceni
  title: Fytochemikálie a výživová doporučení
  chapter: 8
  pages: [64, 67]
  order: 80
  summary: >-
    Fytochemikálie (definice, skupiny, hlavní zástupci a zdroje) a výživová doporučení pro populaci:
    Zdravá 13, potravinová pyramida a výživový talíř.

points:
  - id: dop.fytochemikalie
    title: Fytochemikálie – co to je a jak se dělí
    kind: concept
    tier: A
    criteria: [1a]
    prereqs: [uv.seminutrienty]
    source: { pages: [8, 64], anchor: "Jde o sekundární metabolity rostlin" }
    explanation: >-
      Fytochemikálie jsou sekundární metabolity rostlin – přirozeně se vyskytují v rostlinných
      potravinách. Rostlinu chrání (stres, mikroby, škůdci) a dávají jí chuť, barvu a vůni. U člověka
      působí jako antioxidanty, antikarcinogeny a fytoncidy (rostlinná antibiotika) a mohou přispět
      k prevenci nemocí srdce či rakoviny. Ve třídění živin patří s vlákninou mezi seminutrienty.
      Podle zastoupení ve stravě: fenolické látky, karotenoidy, fytosteroly, sirné sloučeniny;
      zvlášť stojí imunomodulační polysacharidy.
    exercises:
      - id: seminutrienty
        type: choice
        prompt: "Do které skupiny živin řadí skripta fytochemikálie?"
        options:
          - { text: "Seminutrienty (spolu s vlákninou)", correct: true }
          - { text: "Mikronutrienty (spolu s vitaminy)", why: "Mikronutrienty jsou vitaminy a minerální látky." }
          - { text: "Nenutriční složky (spolu s probiotiky)", why: "Nenutriční složky jsou probiotika a symbiotika." }
          - { text: "Makronutrienty", why: "Makronutrienty jsou zdrojem energie – sacharidy, tuky, bílkoviny." }
      - id: skupiny
        type: choice
        multiple: true
        prompt: "Které skupiny patří podle zastoupení ve stravě mezi fytochemikálie?"
        options:
          - { text: "Fenolické látky", correct: true }
          - { text: "Karotenoidy", correct: true }
          - { text: "Fytosteroly", correct: true }
          - { text: "Sirné sloučeniny", correct: true }
          - { text: "Tokoferoly", why: "Tokoferol je vitamin E." }
          - { text: "Polyoly", why: "Polyoly jsou cukerné alkoholy (sladidla)." }
      - id: definice
        type: reveal
        prompt: "Co jsou fytochemikálie a jaký mají význam pro rostlinu a pro člověka?"
        answer: >-
          Sekundární metabolity rostlin. Rostlinu chrání (stres, mikroby, škůdci) a dávají jí chuť,
          barvu, vůni. Pro člověka: antioxidanty, antikarcinogeny, fytoncidy – možná prevence
          civilizačních nemocí.

  - id: dop.fenolicke-latky
    title: Fenolické látky – zástupci a zdroje
    kind: fact
    tier: B
    status: course-disputed
    note: >-
      Skripta: kap. 8 (s. 64) uvádí resveratrol z červeného vína jako vysvětlení „francouzského
      paradoxu“; kap. 5 (s. 46) a kap. 13 (s. 144) ale píší, že jeho význam je přeceňován (nízká
      biologická dostupnost) a lze ho získat bez alkoholu. Současné poznatky: WHO (2023) uvádí, že
      neexistuje bezpečná míra pití alkoholu; přínos resveratrolu z vína pro zdraví není prokázán.
      Ke zkoušce: zařazení resveratrolu mezi stilbenoidy a fytoestrogeny (isoflavonoidy, lignany)
      platí podle obou zdrojů; víno jako zdroj „zdravých“ látek klientům nedoporučuj.
    criteria: [1a]
    prereqs: [dop.fytochemikalie]
    source: { pages: [64, 46, 144], anchor: "isoflavonoidy, kterým se také říká fytoestrogeny" }
    explanation: >-
      Fenolické látky mají ve struktuře fenolické jádro. Zástupci: katechiny (čaj), flavanony
      (citrusy), isoflavonoidy = fytoestrogeny (hlavně sója), anthokyany (fialové a růžové zbarvení
      plodů), třísloviny se svíravou chutí (víno, obiloviny), lignany – také fytoestrogeny (lněné
      semínko), stilbenoidy jako resveratrol (červené víno). Kvercetin působí jako přírodní
      antihistaminikum.
    exercises:
      - id: fytoestrogeny
        type: choice
        version: 2
        multiple: true
        prompt: "Které z těchto fenolických látek patří mezi fytoestrogeny?"
        options:
          - { text: "Isoflavonoidy – hlavně v sóje", correct: true }
          - { text: "Lignany – hlavně ve lněném semínku", correct: true }
          - { text: "Katechiny – hlavně v čaji", why: "Katechiny nejsou fytoestrogeny." }
          - { text: "Anthokyany – hlavně v borůvkách", why: "Anthokyany dávají plodům fialovou barvu." }
          - { text: "Flavanony – hlavně v citrusech", why: "Flavanony nejsou fytoestrogeny." }
      - id: priradit
        type: reveal
        prompt: "Kde najdeš katechiny, flavanony, anthokyany a lignany?"
        answer: "Katechiny – čaj; flavanony – citrusy; anthokyany – fialové a růžové plody; lignany – lněné semínko."

  - id: dop.karotenoidy
    title: Karotenoidy – beta-karoten, lykopen, lutein
    kind: fact
    tier: B
    status: course-disputed
    note: >-
      Skripta (s. 64–65): lykopen snižuje riziko nádoru prostaty, lutein brání šedému zákalu.
      Současné poznatky: obě tvrzení vycházejí převážně z pozorovacích studií, příčinný účinek
      prokázán není; zvýšené riziko rakoviny plic u kuřáků při vysokých dávkách beta-karotenu
      z doplňků je doloženo randomizovanými studiemi (ATBC, CARET). Ke zkoušce: pokud se otázka
      výslovně ptá na skripta, odpověď skript je lykopen – prostata, lutein – šedý zákal; klientům je
      jako jistý účinek neprezentuj. Beta-karoten jako hlavní provitamin A platí podle obou zdrojů.
    criteria: [1a, 1e]
    prereqs: [dop.fytochemikalie]
    confusableWith: [vit.a]
    source: { pages: [64, 65], anchor: "Některé mají roli provitaminu" }
    explanation: >-
      Karotenoidy jsou červené, oranžové a žluté pigmenty (karoteny a xanthofyly) s antioxidačním
      účinkem; některé jsou provitaminem A – hlavně beta-karoten. Lykopen je hlavně v rajčatech,
      lépe se využije po tepelné úpravě; podle skript snižuje riziko nádoru prostaty. Lutein působí
      v oční sítnici a podle skript brání šedému zákalu. Vysoké dávky v doplňcích škodí – u kuřáků
      zvyšují riziko rakoviny plic. Hladina karotenoidů v séru ukazuje příjem ovoce a zeleniny.
    exercises:
      - id: provitamin
        type: choice
        prompt: "Který karotenoid je nejvýznamnějším provitaminem A?"
        options:
          - { text: "Beta-karoten", correct: true }
          - { text: "Lykopen", why: "Lykopen je karotenoid z rajčat bez role provitaminu A." }
          - { text: "Lutein", why: "Lutein působí v oční sítnici." }
          - { text: "Kvercetin", why: "Kvercetin je fenolická látka, ne karotenoid." }
      - id: kuraci
        type: choice
        prompt: "Proč skripta varují před vysokými dávkami karotenoidů v doplňcích?"
        options:
          - { text: "U kuřáků zvyšují riziko rakoviny plic.", correct: true }
          - { text: "Způsobují šeroslepost.", why: "Šeroslepost je z nedostatku vitaminu A." }
          - { text: "Blokují vstřebávání cholesterolu.", why: "To dělají fytosteroly." }
          - { text: "Snižují vstřebávání železa.", why: "To dělají fytáty a polyfenoly." }
      - id: lykopen
        type: reveal
        prompt: "Kde je hodně lykopenu a jak ho nejlépe využít?"
        answer: "V rajčatech; lépe se využije z tepelně upravených rajčat."

  - id: dop.fytosteroly
    title: Fytosteroly a cholesterol
    kind: fact
    tier: B
    status: course-disputed
    note: >-
      Skripta (s. 65): fytosteroly blokují vstřebávání cholesterolu a „nezvyšují LDL“; jako
      „nejznámějšího zástupce“ uvádějí ergosterol, rostlinný prekurzor vitaminu D2. Současné
      poznatky: ergosterol je sterol hub, mezi fytosteroly snižující cholesterol se neřadí.
      Fytosteroly/stanoly v dávce kolem 2 g denně LDL cholesterol snižují o 7–10 % (ESC/EAS 2019).
      Potraviny s přidanými fytosteroly nejsou podle předpisů EU určeny lidem, kteří cholesterol
      snižovat nepotřebují, a mohou být nevhodné pro těhotné, kojící a děti do 5 let. Ke zkoušce:
      pokud se otázka výslovně ptá na skripta, odpověď skript je ergosterol – houby – prekurzor D2.
    criteria: [1a, 7h]
    prereqs: [dop.fytochemikalie]
    source: { pages: [65], anchor: "Fytosteroly mají strukturu podobnou cholesterolu" }
    explanation: >-
      Fytosteroly mají strukturu podobnou cholesterolu. Blokují vstřebávání cholesterolu z potravy
      i jeho zpětné vstřebávání ze žlučových kyselin, takže LDL nezvyšují (v dávce kolem 2 g denně
      ho mírně snižují). Patří sem sitosterol,
      stigmasterol, kampesterol. Využívají se jako funkční složka v rostlinných margarínech. Výjimkou
      je vzácná sitosterolemie, kdy naopak LDL zvyšují. Ergosterol (houby) je prekurzorem vitaminu D2.
    exercises:
      - id: ucinek
        type: choice
        prompt: "Jak působí fytosteroly na cholesterol?"
        options:
          - { text: "Brzdí vstřebávání cholesterolu ve střevě.", correct: true }
          - { text: "Zvyšují tvorbu HDL cholesterolu v játrech.", why: "Skripta uvádějí blokádu vstřebávání cholesterolu, ne vliv na HDL." }
          - { text: "Přeměňují se v těle na vitamin D3.", why: "Ergosterol je prekurzor vitaminu D2, ne D3, a jde o houbový sterol." }
          - { text: "Zvyšují LDL cholesterol u všech lidí.", why: "LDL zvyšují jen u vzácné sitosterolemie." }
      - id: vyuziti
        type: reveal
        prompt: "Kde se fytosteroly prakticky využívají a u koho jsou nevhodné?"
        answer: "Jako funkční složka rostlinných margarínů; nevhodné při vzácné sitosterolemii (zvyšují LDL)."

  - id: dop.sirne-betaglukany
    title: Sirné sloučeniny a beta-glukany
    kind: fact
    tier: C
    criteria: [1a]
    prereqs: [dop.fytochemikalie]
    source: { pages: [65], anchor: "Nutričně významné jsou zejména beta-glukany" }
    explanation: >-
      Sirné sloučeniny mají štiplavou chuť: sulfidy a alicin v cibuli a česneku (alicin je silně
      antimikrobiální), glukosinoláty v brukvovité zelenině (křen, hořčice, růžičková kapusta) –
      pravděpodobně působí proti nádorům. Imunomodulační polysacharidy jsou druh vlákniny, nejčastěji
      glukany z glukózy. Beta-glukany (ovesné otruby, houby; pleuran z hlívy ústřičné) podporují
      imunitu. Imunomodulační polysacharidy obsahuje i echinacea (třapatka).
    exercises:
      - id: betaglukan
        type: choice
        prompt: "Kde najdeš nutričně významné beta-glukany?"
        options:
          - { text: "V ovesných otrubách a houbách", correct: true }
          - { text: "V česneku a cibuli", why: "Tam jsou sirné sloučeniny (sulfidy, alicin)." }
          - { text: "V rajčatech a kečupu", why: "Rajčata jsou zdrojem lykopenu." }
          - { text: "V sóje a lněném semínku", why: "Sója a lněné semínko jsou zdrojem fytoestrogenů." }
      - id: glukosinolaty
        type: choice
        prompt: "Glukosinoláty jsou typické pro…"
        options:
          - { text: "brukvovitou zeleninu", correct: true }
          - { text: "citrusové plody", why: "V citrusech jsou flavanony." }
          - { text: "červené víno", why: "Ve víně jsou třísloviny a resveratrol." }
          - { text: "ovesné otruby", why: "V ovesných otrubách jsou beta-glukany." }

  - id: dop.doporuceni-kdo
    title: Kdo tvoří výživová doporučení v ČR
    kind: fact
    tier: B
    criteria: [10d, 7c]
    source: { pages: [66, 67], anchor: "výživová doporučení navrhuje Společnost pro výživu" }
    explanation: >-
      Výživová doporučení jsou součástí strategie státu a organizací pro zdraví obyvatel. V ČR je
      navrhuje Společnost pro výživu, zabývá se jimi i Státní zdravotní ústav a zohledňují se
      doporučení WHO. Aktuálně jsou shrnuta do Zdravé 13 (Zdravé třináctky). Pomůckami jsou
      i potravinové pyramidy a výživové talíře. Doporučení platí pro celou populaci – u klienta je
      vždy nutné postupovat individuálně.
    exercises:
      - id: kdo
        type: choice
        prompt: "Kdo v ČR navrhuje výživová doporučení shrnutá do Zdravé 13?"
        options:
          - { text: "Společnost pro výživu", correct: true }
          - { text: "Ministerstvo zemědělství", why: "Doporučení navrhuje Společnost pro výživu; zabývá se jimi i SZÚ." }
          - { text: "EFSA", why: "EFSA stanovuje referenční hodnoty příjmu živin pro EU, ne Zdravou 13." }
          - { text: "Česká obchodní inspekce", why: "ČOI kontroluje trh, výživová doporučení netvoří." }
      - id: individualne
        type: reveal
        prompt: "Jaké je omezení obecných výživových doporučení při práci s klientem?"
        answer: "Platí pro celou populaci; s klientem je vždy třeba postupovat individuálně."

  - id: dop.zdrava13
    title: Zdravá 13 – co a kolik jíst
    kind: fact
    tier: A
    criteria: [7c, 10d]
    prereqs: [dop.doporuceni-kdo]
    source: { pages: [66], anchor: "výživová doporučení shrnutá do tzv. Zdravé 13" }
    explanation: >-
      Zdravá 13 (Společnost pro výživu, obr. 9.1) – potraviny: pestrá strava v 3–5 jídlech denně,
      nevynechávat snídani; zelenina a ovoce aspoň 400 g denně (zeleniny 2× víc než ovoce), v menším
      množství ořechy; přednost celozrnným výrobkům, luštěniny aspoň 1× týdně; ryby aspoň 2× týdně;
      denně mléčné výrobky, hlavně zakysané, spíše polotučné; vypít aspoň 1,5 l tekutin denně
      (voda, slabý čaj, ředěné šťávy).
    exercises:
      - id: zelenina
        type: choice
        prompt: "Kolik zeleniny a ovoce denně doporučuje Zdravá 13?"
        options:
          - { text: "Aspoň 400 g, zeleniny dvakrát víc než ovoce", correct: true }
          - { text: "Aspoň 400 g, ovoce dvakrát víc než zeleniny", why: "Poměr je opačný – víc zeleniny." }
          - { text: "Aspoň 200 g v jakémkoli poměru", why: "Minimum je 400 g a zeleniny má být víc." }
          - { text: "Aspoň 1 kg, hlavně ovoce", why: "Zdravá 13 uvádí aspoň 400 g a víc zeleniny než ovoce." }
      - id: frekvence
        type: choice
        prompt: "Jak často doporučuje Zdravá 13 jíst ryby a luštěniny?"
        options:
          - { text: "Ryby aspoň 2× týdně, luštěniny aspoň 1× týdně", correct: true }
          - { text: "Ryby aspoň 1× týdně, luštěniny aspoň 2× týdně", why: "Je to obráceně." }
          - { text: "Ryby i luštěniny denně", why: "Zdravá 13 uvádí týdenní minimum: ryby 2×, luštěniny 1×." }
          - { text: "Ryby aspoň 1× měsíčně, luštěniny podle chuti", why: "Ryby aspoň 2× týdně, luštěniny aspoň 1× týdně." }
      - id: zasady
        type: explain
        prompt: "Klient chce jednoduchá pravidla zdravého jídelníčku. Shrň mu potravinová doporučení Zdravé 13."
        keyPoints:
          - "Pestrá strava v 3–5 jídlech denně, nevynechávat snídani"
          - "Zelenina a ovoce aspoň 400 g denně, zeleniny 2× víc než ovoce; ořechy v menším množství"
          - "Celozrnné obiloviny; luštěniny aspoň 1× týdně"
          - "Ryby aspoň 2× týdně; denně mléčné (hlavně zakysané) výrobky"
          - "Aspoň 1,5 l tekutin denně, ideálně neslazených"
        modelAnswer: >-
          Jez pestře, rozděl jídlo do tří až pěti porcí denně a nevynechávej snídani. Denně sněz aspoň
          400 g zeleniny a ovoce, přičemž zeleniny má být dvakrát víc, a přidej trochu ořechů.
          Z obilovin vybírej celozrnné, luštěniny zařaď aspoň jednou a ryby aspoň dvakrát týdně, denně
          mléčné výrobky – nejlépe zakysané. Vypij aspoň 1,5 litru tekutin, nejlépe neslazených. A
          pamatuj, že u konkrétního klienta se pravidla vždy přizpůsobují.

  - id: dop.zdrava13-limity
    title: Zdravá 13 – hmotnost, pohyb a co omezit
    kind: fact
    tier: B
    status: course-disputed
    note: >-
      Skripta: Zdravá 13 (obr. 9.1, s. 66) – alkohol muži nejvýše 20 g, ženy polovinu (10 g); obvod
      pasu muži 94 / ženy 80 cm. Kap. 5 (s. 47) uvádí tzv. tolerovatelný příjem alkoholu ženy 20 g,
      muži 30 g; tabulka v kap. 13 (s. 152) má u mužů hranici pasu 90 cm. Současné poznatky: aktuální
      Zdravá 13 Společnosti pro výživu (vyzivaspol.cz) má stejná čísla jako obr. 9.1; WHO (2023)
      uvádí, že žádná míra pití alkoholu není pro zdraví bezpečná. Ke zkoušce: pokud se otázka ptá na
      Zdravou 13, odpověď je 20 g / polovina a 94 / 80 cm; žádné z čísel neprezentuj jako bezpečnou dávku.
    criteria: [10d, 7c]
    prereqs: [dop.zdrava13]
    confusableWith: [alk.tolerovatelna-davka, por.obvod-pasu]
    source: { pages: [66], anchor: "výživová doporučení shrnutá do tzv. Zdravé 13" }
    explanation: >-
      Zdravá 13 dále radí: udržovat BMI 18,5–25 a obvod pasu nejvýše 94 cm u mužů a 80 cm u žen;
      denně se hýbat aspoň 30 minut; sledovat tuky (skryté tuky, preferovat tuky s nízkým obsahem
      nasycených MK); omezit cukr a sůl; předcházet otravám a upřednostnit šetrnou tepelnou úpravu
      místo smažení a grilování. Alkohol: muži nejvýše 20 g denně (200 ml vína, 0,5 l piva nebo
      50 ml lihoviny), ženy poloviční množství.
    exercises:
      - id: alkohol
        type: choice
        version: 2
        prompt: "Jaký denní limit alkoholu pro muže uvádí Zdravá 13 (obr. 9.1)?"
        options:
          - { text: "20 g (např. 0,5 l piva), ženy polovinu", correct: true }
          - { text: "30 g (např. 0,75 l piva), ženy 20 g", why: "To je tzv. tolerovatelný příjem z kap. 5, ne Zdravá 13." }
          - { text: "10 g (např. 0,25 l piva), ženy stejně", why: "Ženy mají poloviční limit než muži." }
          - { text: "Žádný limit, jen doporučení nepít", why: "Bod 13 limit uvádí – pro muže 20 g denně." }
      - id: pas
        type: choice
        prompt: "Jaký maximální obvod pasu uvádí Zdravá 13?"
        options:
          - { text: "Muži 94 cm, ženy 80 cm", correct: true }
          - { text: "Muži 102 cm, ženy 88 cm", why: "To jsou běžné hranice vysokého rizika, ne hodnoty Zdravé 13." }
          - { text: "Muži 80 cm, ženy 94 cm", why: "Hodnoty jsou prohozené." }
          - { text: "Muži i ženy 90 cm", why: "90 cm je hranice pro muže z tabulky v kap. 13; Zdravá 13 má 94 / 80 cm." }
      - id: pohyb
        type: reveal
        prompt: "Kolik pohybu denně a jaké BMI doporučuje Zdravá 13?"
        answer: "Aspoň 30 minut pohybu denně (např. rychlá chůze); BMI 18,5–25."

  - id: dop.pyramida-talir
    title: Potravinová pyramida a výživový talíř
    kind: concept
    tier: B
    status: course-disputed
    note: >-
      Skripta (s. 67): výživový talíř M. Slimákové radí margaríny nejíst, kap. 8 (s. 65) ale uvádí
      margaríny s fytosteroly jako funkční potravinu; pyramida MZ ČR (definice porce) počítá půl
      talíře brambor jako porci zeleniny, talíř řadí brambory k polysacharidům; talíř dává ovoci
