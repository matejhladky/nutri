  - id: pot.dozor-khs-coi
    title: Dělba dozoru v praxi (SVS, KHS, ČOI)
    kind: fact
    tier: B
    status: supplementary
    note: >-
      Skripta u KHS a ČOI neuvádějí, co kontrolují, a u SVS píší obecně „od původu až po
      konzumaci“. Doplněno podle obvyklého rozdělení kompetencí v ČR. Rozdělení je zjednodušené
      (kompetence se částečně překrývají a mohou se měnit), proto stačí znát hlavní zaměření.
    criteria: [9b]
    prereqs: [pot.dozor-cr]
    source: { pages: [105], anchor: "Česká obchodní inspekce (ČOI) a krajské hygienické stanice" }
    explanation: >-
      Zjednodušeně: SVS dozoruje hlavně výrobu a zpracování potravin živočišného původu (maso,
      mléko, vejce, ryby); SZPI ostatní potraviny a obchodní síť; krajské hygienické stanice
      (spadají pod ministerstvo zdravotnictví) stravovací služby (restaurace, jídelny) a pitnou
      vodu; ČOI hlavně nepotravinářské výrobky.
    exercises:
      - id: svs
        type: choice
        prompt: "Který orgán v praxi dozoruje hlavně výrobu a zpracování potravin živočišného původu?"
        options:
          - text: "SVS"
            correct: true
          - text: "KHS"
            why: "KHS kontrolují hlavně stravovací služby a pitnou vodu."
          - text: "ČOI"
            why: "ČOI se zaměřuje hlavně na nepotravinářské výrobky."
          - text: "RASFF"
            why: "RASFF je systém rychlého varování, ne kontrolní orgán."
      - id: khs
        type: reveal
        prompt: "Co v praxi kontrolují krajské hygienické stanice?"
        answer: "Hlavně stravovací služby (restaurace, jídelny) a pitnou vodu."

  - id: pot.dozor-mezinarodni
    title: RASFF a EFSA
    kind: comparison
    tier: A
    criteria: [9b]
    confusableWith: [pot.dozor-cr, pot.aditiva-legislativa]
    source: { pages: [105], anchor: "systém rychlého varování pro potraviny a krmiva" }
    explanation: >-
      Mezinárodně působí RASFF – systém rychlého varování pro potraviny a krmiva: při záchytu
      nebezpečné potraviny nebo krmiva neprodleně informuje ostatní státy. EFSA (Evropský úřad pro
      bezpečnost potravin) řeší obecné požadavky na bezpečnost potravin, vyhodnocuje dostupné
      informace a dává podklady pro změny legislativy.
    exercises:
      - id: rasff
        type: choice
        prompt: "Co je RASFF?"
        options:
          - text: "Evropský systém rychlého varování pro potraviny a krmiva"
            correct: true
          - text: "Evropský úřad pro bezpečnost potravin"
            why: "To je EFSA."
          - text: "Americký úřad pro potraviny a léčiva"
            why: "To je FDA."
          - text: "Systém kritických kontrolních bodů ve výrobě"
            why: "To je HACCP."
      - id: efsa
        type: choice
        prompt: "Jakou roli má podle skript EFSA?"
        options:
          - text: "Vyhodnocuje informace o bezpečnosti a dává podklady pro legislativu"
            correct: true
          - text: "Kontroluje potraviny v českých obchodech"
            why: "To dělá SZPI."
          - text: "Při záchytu nebezpečné potraviny varuje ostatní státy"
            why: "To je úloha systému RASFF."
          - text: "Uděluje certifikáty biopotravinám"
            why: "Biopotraviny certifikují kontrolní organizace."
      - id: vyklad
        type: explain
        prompt: "Jak funguje kontrola bezpečnosti potravin na evropské úrovni?"
        keyPoints:
          - "RASFF – systém rychlého varování pro potraviny a krmiva"
          - "Při záchytu nebezpečí neprodleně informuje ostatní státy"
          - "EFSA – Evropský úřad pro bezpečnost potravin"
          - "EFSA vyhodnocuje informace a dává podklady pro legislativu"
        modelAnswer: >-
          Na evropské úrovni funguje RASFF, systém rychlého varování pro potraviny a krmiva: když
          některý stát zachytí nebezpečnou potravinu, okamžitě informuje ostatní. EFSA, Evropský úřad
          pro bezpečnost potravin, vyhodnocuje dostupné informace o bezpečnosti a dává podklady pro
          změny legislativy.

  - id: pot.haccp-codex
    title: HACCP a Codex Alimentarius
    kind: concept
    tier: A
    status: course-disputed
    note: >-
      Skripta uvádějí jako tvůrce Codexu Alimentarius WHO, FAO a WTO. Komisi Codex Alimentarius
      ve skutečnosti zřizují FAO a WHO; WTO se na normy Codexu jen odkazuje. U zkoušky jmenuj WHO
      a FAO (případně dodej, že skripta zmiňují i WTO).
    criteria: [9b]
    source: { pages: [105, 106], anchor: "analýza kritických kontrolních bodů" }
    explanation: >-
      Bezpečnost se řeší už při výrobě: výrobci se řídí správnou výrobní praxí, normami ISO
      a povinným systémem HACCP – analýzou rizik a kritických kontrolních bodů, tedy míst ve
      výrobě, kde hrozí riziko, a jak jim předcházet. Dodržuje se také Codex Alimentarius – potravinářský
      kodex obecných i specifických norem bezpečnosti potravin od WHO a FAO. Bezpečná potravina ale
      nemusí být nutričně vyvážená.
    exercises:
      - id: haccp
        type: choice
        prompt: "Co je HACCP?"
        options:
          - text: "Systém analýzy rizik a kritických kontrolních bodů ve výrobě"
            correct: true
          - text: "Evropský systém rychlého varování"
            why: "To je RASFF."
          - text: "Evropský úřad pro bezpečnost potravin"
            why: "To je EFSA."
          - text: "Certifikace biopotravin"
            why: "HACCP se týká bezpečnosti každé výroby potravin."
      - id: codex
        type: choice
        prompt: "Co je Codex Alimentarius?"
        options:
          - text: "Mezinárodní potravinářský kodex norem bezpečnosti potravin"
            correct: true
          - text: "Česká vyhláška o označování potravin"
            why: "Codex je mezinárodní soubor norem (WHO, FAO)."
          - text: "Seznam schválených zdravotních tvrzení"
            why: "Tvrzení upravuje nařízení EU, ne Codex."
          - text: "Evropský systém varování před nebezpečnými potravinami"
            why: "To je RASFF."
      - id: vyklad
        type: explain
        prompt: "Jak se zajišťuje bezpečnost potravin už při jejich výrobě?"
        keyPoints:
          - "Správná výrobní praxe a normy ISO"
          - "HACCP – analýza kritických kontrolních bodů a jak jim předcházet"
          - "Codex Alimentarius – mezinárodní normy (WHO, FAO)"
          - "Bezpečná potravina nemusí být nutričně vyvážená"
        modelAnswer: >-
          Výrobci se řídí správnou výrobní praxí a normami ISO a musí mít systém HACCP, tedy
          analýzu kritických kontrolních bodů, kde ve výrobě hrozí riziko, a opatření, jak mu
          předejít. Dodržuje se také Codex Alimentarius, mezinárodní soubor norem bezpečnosti
          potravin od WHO a FAO. Bezpečná potravina ovšem nemusí být nutričně vyvážená.

  - id: pot.kontaminanty
    title: Kontaminanty v potravinách
    kind: fact
    tier: A
    criteria: [9b, 4a]
    source: { pages: [96, 106], anchor: "Polycyklické aromatické uhlovodíky jsou v 65 % případů v potravě jako kontaminanty" }
    explanation: >-
      PAU (polycyklické aromatické uhlovodíky) se do potravin dostávají asi z 65 % z ovzduší
      (obiloviny, oleje, listová zelenina, ovoce), z 35 % vznikají uzením a grilováním. PCB a dioxiny
      vznikají nedokonalým spalováním (lesní požáry, fosilní paliva) a přes půdu a krmivo se dostanou
      do živočišných produktů. Těžké kovy (rtuť, olovo, arsen, kadmium) pocházejí ze znečištěné vody
      a půdy. Mykotoxiny jsou produkty plísní. Pro cizorodé látky platí limity.
    exercises:
      - id: pau
        type: choice
        prompt: "Při jakých technologických úpravách vznikají v potravinách PAU?"
        options:
          - text: "Při uzení a grilování"
            correct: true
          - text: "Při pasteraci"
            why: "Pasterace probíhá při nízkých teplotách."
          - text: "Při fermentaci"
            why: "Fermentace PAU nevytváří."
          - text: "Při mražení"
            why: "Mražení PAU nevytváří."
      - id: kovy
        type: choice
        multiple: true
        prompt: "Které těžké kovy uvádějí skripta jako nejčastější kontaminanty?"
        options:
          - text: "Rtuť (Hg)"
            correct: true
          - text: "Olovo (Pb)"
            correct: true
          - text: "Arsen (As)"
            correct: true
          - text: "Kadmium (Cd)"
            correct: true
          - text: "Železo (Fe)"
            why: "Železo je esenciální minerální látka, ne kontaminant."
          - text: "Zinek (Zn)"
            why: "Zinek je esenciální minerální látka, ne kontaminant."
      - id: vyklad
        type: explain
        prompt: "Jaké kontaminanty se mohou vyskytovat v potravinách a odkud se tam berou?"
        keyPoints:
          - "PAU – hlavně z ovzduší, část z uzení a grilování"
          - "PCB a dioxiny – nedokonalé spalování, přes půdu a krmivo do živočišných produktů"
          - "Těžké kovy (Hg, Pb, As, Cd) – znečištěná voda a půda"
          - "Mykotoxiny – plísně"
          - "Látky vznikající při tepelné úpravě (akrylamid, PAU z přepáleného tuku)"
        modelAnswer: >-
          Polycyklické aromatické uhlovodíky se do potravin dostávají většinou z ovzduší, asi
          třetina vzniká při uzení a grilování. PCB a dioxiny vznikají nedokonalým spalováním
          a přes půdu a krmivo se dostávají do živočišných produktů. Těžké kovy jako rtuť, olovo,
          arsen a kadmium pocházejí ze znečištěné vody a půdy. Dále jsou to mykotoxiny z plísní
          a látky vznikající při tepelné úpravě, například akrylamid.

  - id: pot.mykotoxiny
    title: Mykotoxiny
    kind: fact
    tier: C
    criteria: [9b]
    prereqs: [pot.kontaminanty]
    source: { pages: [106], anchor: "Aflatoxin M1, který se vyskytuje v mléce a mase" }
    explanation: >-
      Mykotoxiny jsou sekundární metabolity plísní. Aflatoxiny B1, B2, G1, G2 (Aspergillus flavus)
      – obiloviny, semena, koření; aflatoxin M1 – mléko a maso zvířat krmených plesnivým krmivem.
      Ochratoxin A – obiloviny, luštěniny, hrozny, víno, káva. Patulin – nahnilá jablka a jiné
      ovoce. Citrinin – hnijící zelenina, zejména rajčata.
    exercises:
      - id: m1
        type: choice
        prompt: "Kde se podle skript vyskytuje aflatoxin M1?"
        options:
          - text: "V mléce a mase"
            correct: true
          - text: "V nahnilých jablkách"
            why: "Tam se vyskytuje patulin."
          - text: "V hnijících rajčatech"
            why: "Tam se vyskytuje citrinin."
          - text: "Ve víně a kávě"
            why: "Tam se vyskytuje ochratoxin A."

  - id: pot.ryby-cerstvost
    title: Trvanlivost a čerstvost ryb
    kind: fact
    tier: C
    criteria: [9b]
    source: { pages: [112, 113], anchor: "Nekuchané ryby chlazené ledem vydrží 5–7 dní" }
    explanation: >-
      Rybí maso má hodně vody a psychrofilních mikroorganismů, proto se rychle kazí. Podle skript
      nekuchané ryby chlazené ledem vydrží 5–7 dní, kuchané až 14 dní, zmrazené (−18 až −20 °C) až
      6 měsíců. Do čerstvých a chlazených ryb se nesmějí přidávat přídatné látky. Čerstvá ryba má
      jasné oči, červené žábry, lesklý vlhký povrch, mírně pruží a voní jen rybinou.
    exercises:
      - id: cerstva
        type: reveal
        prompt: "Podle čeho poznáš čerstvou rybu?"
        answer: >-
          Jasné oči, červené žábry, lesklý a vlhký povrch, maso při tlaku mírně pruží, voní jen
          rybinou.

  # ---------- 9d Biopotraviny, GMO, farmářské a zdravé potraviny ----------

  - id: pot.bio-co-je
    title: Co je (a není) biopotravina
    kind: concept
    tier: A
    status: course-disputed
    note: >-
      Skripta píší, že v BIO jsou zakázána jen některá syntetická éčka a ostatní E i aromata se
      smějí použít. Nařízení EU o ekologické produkci funguje opačně: biopotraviny smějí obsahovat
      jen přídatné látky z uzavřeného seznamu (zhruba 50 látek) a jen přírodní aromata; zakázané je
      např. ozařování. Zákaz bělení, hydrogenace a mikrovlnného ohřevu je tvrzení skript. U zkoušky
      uveď výklad skript (BIO ≠ bez éček), případně dodej, že povolená éčka omezuje seznam.
    criteria: [9d]
    confusableWith: [pot.farmarske-neregulovane]
    source: { pages: [102, 103], anchor: "Ne vždy platí, že BIO potravina je zdravější nebo kvalitnější" }
    explanation: >-
      Biopotravina je vyrobená ze surovin z ekologického zemědělství a má osvědčení o původu
      (bioprodukt = surovina z ekologického zemědělství). BIO vychází ze šetrnosti k přírodě –
      neznamená automaticky zdravější ani kvalitnější. Není pravda, že je bez „éček“: zakázána jsou
      jen některá syntetická (konzervanty, barviva, stabilizátory), ostatní E i aromata se smějí
      použít. Zakázané jsou některé procesy: bělení, hydrogenace, ozařování, mikrovlnný ohřev.
      Největší smysl má BIO lokální a sezónní; vyšší obsah vitaminů a minerálů nebyl potvrzen.
    exercises:
      - id: ecka
        type: choice
        prompt: "Co platí podle skript o „éčkách“ v biopotravinách?"
        options:
          - text: "Zakázána jsou jen některá syntetická, ostatní E i aromata se smějí použít"
            correct: true
          - text: "Biopotraviny nesmějí obsahovat žádná „E“"
            why: "Častý mýtus – zakázána jsou jen některá syntetická aditiva."
          - text: "Smějí obsahovat jen přírodní E, aromata jsou zakázána"
            why: "Aromata v biopotravinách povolena jsou."
          - text: "Platí pro ně stejná pravidla jako pro konvenční potraviny"
            why: "Některá syntetická aditiva a procesy jsou v BIO zakázány."
      - id: procesy
        type: choice
        multiple: true
        prompt: "Které procesy jsou podle skript u biopotravin zakázané?"
        options:
          - text: "Hydrogenace"
            correct: true
          - text: "Ozařování"
            correct: true
          - text: "Mikrovlnný ohřev"
            correct: true
          - text: "Bělení"
            correct: true
          - text: "Pasterace"
            why: "Skripta ji mezi zakázané procesy neřadí."
          - text: "Fermentace"
            why: "Skripta ji mezi zakázané procesy neřadí."
      - id: vyklad
        type: explain
        version: 2
        prompt: "Klientka tvrdí, že BIO je vždy zdravější a bez éček. Co jí odpovíš?"
        keyPoints:
          - "Biopotravina = suroviny z ekologického zemědělství + osvědčení"
          - "Princip je šetrnost k přírodě, ne automaticky vyšší nutriční kvalita"
          - "Zakázána jen některá syntetická E (konzervanty, barviva, stabilizátory), aromata povolena"
          - "Zakázané procesy: bělení, hydrogenace, ozařování, mikrovlnný ohřev"
          - "Smysl má hlavně lokální a sezónní BIO; vyšší obsah vitaminů a minerálů nebyl potvrzen"
        modelAnswer: >-
          Biopotravina pochází z ekologického zemědělství a má osvědčení, její podstatou je ale
          šetrnost k přírodě, ne automaticky lepší nutriční hodnota – vyšší obsah vitaminů či
          minerálů nebyl potvrzen. Největší smysl má, je-li lokální a sezónní. Éčka obsahovat může –
          podle skript jsou zakázána jen některá syntetická konzervanty, barviva a stabilizátory,
          aromata jsou povolena. Zakázané jsou některé procesy jako bělení, hydrogenace, ozařování
          nebo mikrovlnný ohřev.

  - id: pot.bio-logo
    title: Jak poznat pravou biopotravinu
    kind: fact
    tier: A
    criteria: [9d, 4c]
    prereqs: [pot.bio-co-je]
    source: { pages: [103], anchor: "musí mít evropské logo, CZ zebru s místem, kde byla surovina vyprodukována" }
    explanation: >-
      Certifikovaný BIO produkt nese evropské logo ekologického zemědělství, údaj o místě, kde byla
      surovina vyprodukována, a kód kontrolní organizace; často i českou „biozebru“. Označení jako
      „organic“, „natural“ nebo „100% bio“ bez těchto náležitostí nezaručují, že jde o biopotravinu
      podle zákona.
    exercises:
      - id: nalezitosti
        type: choice
        multiple: true
        prompt: "Co musí být podle skript na obalu certifikované biopotraviny?"
        options:
          - text: "Evropské logo BIO"
            correct: true
          - text: "Kód kontrolní organizace"
            correct: true
          - text: "Místo, kde byla surovina vyprodukována"
            correct: true
          - text: "Nápis „100% natural“"
            why: "Takové označení biopotravinu nezaručuje."
          - text: "Logo Klasa"
            why: "Klasa je profesní logo kvality, ne BIO."
      - id: vyklad
        type: explain
        version: 2
        prompt: "Jak klientka v obchodě pozná pravou biopotravinu?"
        keyPoints:
          - "Evropské logo pro ekologické zemědělství"
          - "Často i česká „biozebra“"
          - "Místo původu suroviny a kód kontrolní organizace"
          - "Organic, natural, 100% bio bez loga nic nezaručují"
        modelAnswer: >-
          Pravá biopotravina má na obalu evropské logo ekologického zemědělství, údaj o tom, kde byla
          surovina vyprodukována, a kód kontrolní organizace, často i českou biozebru. Nápisy jako
          organic, natural nebo 100% bio bez těchto náležitostí nezaručují, že jde o biopotravinu.

  - id: pot.bio-rizika
    title: Smysl a rizika BIO
    kind: concept
    tier: B
    status: course-disputed
    note: >-
      Skripta tvrdí, že (jarní) BIO zelenina může kvůli dusíkatým hnojivům obsahovat více dusičnanů
      a dusitanů. Srovnávací studie spíše ukazují, že bio zelenina mívá dusičnanů stejně nebo méně
      (syntetická dusíkatá hnojiva jsou v ekologickém zemědělství zakázána); vyšší obsah dusičnanů
      hrozí hlavně u rané listové zeleniny obecně. U zkoušky uveď výklad skript.
    criteria: [9d]
    prereqs: [pot.bio-co-je]
    source: { pages: [103], anchor: "Bio má smysl zejména v tom případě, je-li lokální a sezónní" }
    explanation: >-
      Podle skript má BIO největší smysl, je-li lokální a sezónní. Nebylo potvrzeno, že by BIO
      zelenina obsahovala více vitaminů či minerálních látek než konvenční. Může mít i rizika:
      zejména jarní BIO zelenina může kvůli dusíkatým hnojivům obsahovat více dusičnanů a dusitanů,
      což je nebezpečné pro malé děti – přitom rodiče volí BIO často právě kvůli dětem.
    exercises:
      - id: riziko
        type: choice
        prompt: "Jaké riziko jarní BIO zeleniny pro malé děti uvádějí skripta?"
        options:
          - text: "Vyšší obsah dusičnanů a dusitanů"
            correct: true
          - text: "Vyšší obsah reziduí pesticidů"
            why: "Skripta uvádějí riziko dusičnanů z hnojiv."
          - text: "Možná příměs GMO"
            why: "GMO s BIO nesouvisí."
          - text: "Výrazně nižší obsah vitaminů"
            why: "Skripta uvádějí, že rozdíl ve vitaminech nebyl potvrzen."
      - id: smysl
        type: choice
        prompt: "Kdy má BIO podle skript největší smysl?"
        options:
          - text: "Když je lokální a sezónní"
            correct: true
          - text: "U dovážených exotických potravin"
            why: "Skripta zdůrazňují lokálnost a sezónnost."
          - text: "U vysoce zpracovaných výrobků"
            why: "I BIO výrobky mohou obsahovat „vycpávky“ a éčka."
          - text: "Vždy u jarní zeleniny pro malé děti"
            why: "Právě tam skripta upozorňují na riziko dusičnanů."
      - id: vyklad
        type: explain
        prompt: "Klientka chce svému dítěti kupovat jen BIO zeleninu, protože je zdravější. Co jí řekneš?"
        keyPoints:
          - "BIO má smysl hlavně lokální a sezónní"
          - "Vyšší obsah vitaminů a minerálů nebyl potvrzen"
          - "Jarní BIO zelenina může mít podle skript více dusičnanů a dusitanů"
          - "Dusičnany/dusitany jsou rizikové pro malé děti"
        modelAnswer: >-
          BIO má smysl hlavně tehdy, když je lokální a sezónní, ale nebylo potvrzeno, že by bio
          zelenina měla víc vitaminů nebo minerálních látek. Skripta navíc upozorňují, že zejména
          jarní bio zelenina může kvůli dusíkatým hnojivům obsahovat víc dusičnanů a dusitanů, které
          jsou pro malé děti rizikové.

  - id: pot.gmo-eu
    title: GMO v EU a jejich označování
    kind: fact
    tier: A
    criteria: [9d, 4c]
    confusableWith: [pot.gmo-modifikovany-skrob]
    status: course-disputed
    note: >-
      Skripta uvádějí hranici 0,9 % obecně. Podle legislativy EU platí 0,9 % pro každou složku
      zvlášť a jen pro náhodnou, technicky nevyhnutelnou příměs GMO; záměrně použité GMO se
      označuje vždy, bez ohledu na množství. U zkoušky uveď 0,9 %.
    source: { pages: [104, 105, 109], anchor: "Potravina s použitím GMO navíc musí obsahovat na etiketách informaci" }
    explanation: >-
      V EU je uvádění GMO na trh přísně regulované; pro výživu lidí jsou omezeně povoleny jen
      rostlinné GMO produkty (v USA, Jižní Americe či Asii jsou běžné i živočišné). Potravina musí
      mít informaci o GMO na etiketě, pokud jejich obsah překročí 0,9 %. V běžných obchodech se
      takové výrobky téměř nevyskytují. Neoznačuje se maso či mléko zvířat krmených GMO krmivem ani
      složky vyrobené pomocí GMO mikroorganismů.
    exercises:
      - id: prah
        type: choice
        prompt: "Od jakého podílu GMO musí být potravina v EU označena?"
        options:
          - text: "Nad 0,9 %"
            correct: true
          - text: "Nad 0,1 %"
            why: "Hranice je 0,9 %."
          - text: "Nad 2 %"
            why: "2 % je hranice pro pořadí složek."
          - text: "Nad 5 %"
            why: "5 % je hranice pro uvádění přidané vody."
      - id: krmivo
        type: choice
        prompt: "Musí být označeno maso zvířete krmeného GMO sójou?"
        options:
          - text: "Ne, GMO se potravním řetězcem dál nepřenáší"
            correct: true
          - text: "Ano, vždy"
            why: "Povinnost se na produkty zvířat krmených GMO nevztahuje."
          - text: "Ano, pokud krmivo obsahovalo nad 0,9 % GMO"
            why: "Hranice 0,9 % se týká složení samotné potraviny."
          - text: "Jen pokud je maso v BIO kvalitě"
            why: "Taková podmínka neexistuje."
      - id: vyklad
        type: explain
        prompt: "Vysvětli klientce, jak je to s GMO potravinami v EU a jak je pozná."
        keyPoints:
          - "V EU přísně regulované, omezeně povolené jen rostlinné GMO"
          - "Označení na etiketě nad 0,9 % GMO"
          - "V běžném obchodě se téměř nevyskytují"
          - "Produkty zvířat krmených GMO se neoznačují"
          - "GMO ≠ modifikovaný škrob"
        modelAnswer: >-
          V EU jsou GMO potraviny přísně regulované a pro lidi jsou omezeně povolené jen rostlinné.
          Pokud potravina obsahuje víc než 0,9 % GMO, musí to být na etiketě, ale v běžných
          obchodech se takové výrobky téměř nevyskytují. Maso nebo mléko zvířat krmených GMO
          krmivem se neoznačuje. A pozor, modifikovaný škrob není GMO.

  - id: pot.gmo-prinosy-rizika
    title: Přínosy a rizika GMO
    kind: comparison
    tier: A
    criteria: [9d]
    prereqs: [pot.gmo-eu]
    source: { pages: [104, 105], anchor: "S novými typy bílkovin mohou vznikat i nové alergie" }
    explanation: >-
      Přínosy GMO: ochrana proti chorobám, škůdcům a plevelům; odolnost vůči suchu, chladu či
      zasolení; vyšší nutriční hodnota (rýže s betakarotenem); ekologičtější plodiny (náhrada
      fosilních paliv); zdravotní přínos (levnější GMO inzulin). Rizika: nové bílkoviny → nové
      alergie; při použití bakteriálních genů otázka rezistence na antibiotika; změna ekosystému.
      Obavu z „hromadění GMO v těle“ skripta označují za nesmyslnou – cizí DNA jíme běžně.
    exercises:
      - id: riziko
        type: choice
        prompt: "Které riziko GMO uvádějí skripta?"
        options:
          - text: "Vznik nových alergií na nové typy bílkovin"
            correct: true
          - text: "Hromadění GMO v lidském těle"
            why: "Tuto obavu skripta označují za nesmyslnou."
          - text: "Mutace u lidí, kteří GMO jedí"
            why: "Žádný případ mutace nebyl zaznamenán."
          - text: "Přenos GMO do masa zvířat krmených GMO"
            why: "Podle skript GMO potravním řetězcem dál neprostupují."
      - id: prinosy
        type: choice
        multiple: true
        prompt: "Co skripta uvádějí jako přínos GMO?"
        options:
          - text: "Odolnost vůči suchu a zasolení"
            correct: true
          - text: "Rýže s betakarotenem"
            correct: true
          - text: "Levnější výroba inzulinu"
            correct: true
          - text: "Odstranění všech alergenů z potravin"
            why: "Naopak – nové bílkoviny mohou vyvolat nové alergie."
          - text: "Vyšší obsah vlákniny v mase"
            why: "Takový přínos skripta neuvádějí."
      - id: vyklad
        type: explain
        prompt: "Klientka se bojí GMO. Jak jí vysvětlíš přínosy a rizika?"
        keyPoints:
          - "Přínosy: odolnost proti škůdcům, chorobám, suchu, zasolení"
          - "Vyšší nutriční hodnota (rýže s betakarotenem), GMO inzulin"
          - "Rizika: nové alergie, rezistence na antibiotika, změna ekosystému"
          - "Hromadění GMO v těle je nepodložená obava – cizí DNA jíme běžně"
        modelAnswer: >-
          Genetická modifikace umožňuje pěstovat plodiny odolné vůči škůdcům, chorobám, suchu nebo
          zasolení, zvýšit nutriční hodnotu jako u rýže s betakarotenem nebo levněji vyrábět
          inzulin. Rizikem jsou možné nové alergie, otázka rezistence na antibiotika a změny
          ekosystému. Strach, že se GMO hromadí v těle, je nepodložený – cizí DNA jíme běžně.

  - id: pot.gmo-modifikovany-skrob
    title: GMO vs. modifikovaný škrob
    kind: comparison
    tier: B
    criteria: [9d, 4c]
    confusableWith: [pot.gmo-eu]
    source: { pages: [104], anchor: "neplést si GMO například s modifikovaným škrobem" }
    explanation: >-
      Geneticky modifikované potraviny nejsou totéž co „modifikované“ potraviny. Modifikovaný škrob
      je škrob upravený technologicky – vysokým tlakem, teplotou nebo reakcí s nějakým činidlem.
      S genetickou úpravou nemá nic společného.
    exercises:
      - id: co-je
        type: choice
        prompt: "Modifikovaný škrob ve složení znamená…"
        options:
          - text: "škrob technologicky upravený tlakem, teplotou či činidlem"
            correct: true
          - text: "škrob z geneticky modifikované kukuřice"
            why: "Modifikovaný škrob s genetickou úpravou nesouvisí."
          - text: "škrob obohacený o vitaminy"
            why: "To by byla fortifikace."
          - text: "škrob z ekologického zemědělství"
            why: "To by byla BIO surovina."

  - id: pot.farmarske-neregulovane
    title: „Farmářské“ a další neregulovaná označení
    kind: concept
    tier: B
    criteria: [9d, 4c]
    confusableWith: [pot.logo-ceska-potravina, pot.bio-co-je]
    source: { pages: [103, 107, 110, 115], anchor: "Nicméně tento pojem legislativa nezná" }
    explanation: >-
      Ne každé lákavé označení má legislativní obsah. „Farmářské máslo“ legislativa nezná a o kvalitě
      nic neříká; ani „selské máslo“ není přesně definováno. Slovo „dětský“ bez údaje o věku
      legislativně nic neznamená. „Organic“, „natural“ či „100% bio“ bez evropského loga nezaručují
      biopotravinu. Naopak profesní loga (Klasa, České cechovní normy) garantují určitou kvalitu
      a logo Česká potravina má přesná pravidla původu.
    exercises:
      - id: farmarske
        type: choice
        prompt: "Co podle skript znamená na másle označení „farmářské“?"
        options:
          - text: "Nic konkrétního – legislativa tento pojem nezná"
            correct: true
          - text: "Máslo z certifikované malé farmy"
            why: "Žádná taková certifikace s tímto pojmem nesouvisí."
          - text: "Máslo s vyšším obsahem tuku"
            why: "Pojem žádné složení nestanoví."
          - text: "Máslo v BIO kvalitě"
            why: "BIO musí nést evropské logo."
      - id: rozliseni
        type: reveal
        prompt: "Uveď dvě označení, která legislativně nic nezaručují, a dvě, která něco zaručují."
        answer: >-
          Nic nezaručují: „farmářské“, „dětský“ (bez věku), „natural/organic“ bez loga. Zaručují:
          evropské BIO logo, Česká potravina, bez lepku, profesní loga Klasa či ČCN.

  - id: pot.nahrazky
    title: Rostlinné náhražky masa a mléka
    kind: concept
    tier: B
    status: course-disputed
    note: >-
      S. 114 uvádí jako hlavní problém rostlinných nápojů absenci vápníku, s. 93 ale zmiňuje
      obohacování rostlinných nápojů o vápník, vitamin D a B12. Chybějící vápník tedy platí pro
      neobohacené nápoje.
    criteria: [9d]
    source: { pages: [114], anchor: "Mléčné alternativy tedy mohou mléko spolehlivě nahradit při vaření" }
    explanation: >-
      Náhražky masa (tofu a tempeh ze sóji, šmakoun z bílku, seitan z lepku) nejsou vždy plnohodnotné:
      mívají méně biologicky dostupné železo, zinek, hořčík a vápník, často víc soli, mohou nést
      mikrobiologické riziko, mykotoxiny, antinutriční látky a v sóje fytoestrogeny. Rostlinné nápoje
      jsou vysoce zpracované a mléku nutričně neodpovídají – mají méně bílkovin (ovesný 2,5 g vs.
      mléko 8,3 g na 250 ml) a často jim chybí vápník (pokud nejsou obohacené). Při vaření mléko
      nahradí.
    exercises:
      - id: napoje
        type: choice
        prompt: "Co je podle skript hlavní nutriční slabina rostlinných nápojů oproti mléku?"
        options:
          - text: "Méně bílkovin a často chybějící vápník (u neobohacených)"
            correct: true
          - text: "Vysoký obsah laktózy"
            why: "Rostlinné nápoje laktózu neobsahují."
          - text: "Více cholesterolu"
            why: "Rostlinné nápoje cholesterol neobsahují."
          - text: "Žádná – jsou nutričně rovnocenné"
            why: "Skripta zdůrazňují, že rovnocenné nejsou."
      - id: seitan
        type: choice
        prompt: "Z čeho se vyrábí seitan?"
        options:
          - text: "Z lepku"
            correct: true
          - text: "Ze sóji"
            why: "Ze sóji se vyrábí tofu a tempeh."
          - text: "Z vaječného bílku"
            why: "Z bílku se vyrábí šmakoun."
          - text: "Z hrachové bílkoviny"
            why: "Seitan se vyrábí z pšeničného lepku."

  - id: pot.zakladni-pojmy
    title: Funkční potravina, novel food, doplněk stravy
    kind: concept
    tier: C
    criteria: [9d, 8c]
    source: { pages: [93], anchor: "nebyla doložena historie spotřeby před 15. 5. 1997" }
    explanation: >-
      Funkční potravina má významnější nutriční hodnotu a pozitivní vliv na zdraví, výkon či psychiku –
      přirozeně (podmáslí – probiotika, mořské ryby – n-3 MK, kysané zelí – vitaminy K2 a C, tvaroh –
      vápník), nebo díky fortifikaci. Potravina nového typu nemá v Evropě doloženou historii
      spotřeby před 15. 5. 1997; povoluje se podle vědeckých důkazů. Doplněk stravy je potravina
      s vysokým obsahem živin k doplnění stravy; jeho uvedení na trh má jen oznamovací povinnost.
    exercises:
      - id: novel
        type: choice
        prompt: "Co je potravina nového typu (novel food)?"
        options:
          - text: "Potravina bez doložené historie spotřeby v Evropě před 15. 5. 1997"
            correct: true
          - text: "Každá fortifikovaná potravina"
            why: "Fortifikace z potraviny novel food nedělá."
          - text: "Každá GMO potravina"
            why: "GMO mají vlastní regulaci."
          - text: "Potravina pro zvláštní lékařské účely"
            why: "To je kategorie potravin pro zvláštní výživu."
      - id: funkcni
        type: choice
        multiple: true
        prompt: "Které potraviny uvádějí skripta jako příklad funkční potraviny?"
        options:
          - text: "Podmáslí"
            correct: true
          - text: "Kysané zelí"
            correct: true
          - text: "Mořské ryby"
            correct: true
          - text: "Chipsy"
            why: "Nemají významnější nutriční hodnotu."
          - text: "Bílé pečivo"
            why: "Skripta ho jako funkční potravinu neuvádějí."
