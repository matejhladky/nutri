topic:
  id: potraviny
  title: Potraviny – zpracování, aditiva, značení
  chapter: 12
  pages: [92, 119]
  order: 120
  summary: >-
    Technologie zpracování a jejich vliv na živiny, trvanlivost a data na obalu, aditiva („éčka“),
    etikety a výživová tvrzení, dozorové orgány a kontaminanty, biopotraviny a GMO, vybrané
    skupiny potravin.

points:
  # ---------- 4a Technologie zpracování ----------

  - id: pot.prodlouzeni-trvanlivosti
    title: Principy prodloužení trvanlivosti
    kind: concept
    tier: A
    criteria: [4a, 9b]
    confusableWith: [pot.tepelne-osetreni]
    source: { pages: [97], anchor: "Omezení množení mikroorganizmů - vytvořením nehostinných podmínek" }
    explanation: >-
      Prodloužení trvanlivosti znamená hlavně zabránit kažení mikroorganismy. Jejich množení omezí
      nehostinné podmínky: méně vody (solení, sušení, lyofilizace) nebo nižší pH (nakládání do octa,
      kyselina mléčná, citronová, octová). Mikroorganismy zničí teplo (pasterace, UHT, sterilizace)
      nebo vysoký tlak (paskalizace). Rafinace a blanšírování odstraňují „nečistoty“, fermentace
      vytváří ochranné látky. Chlad mikroorganismy nezabíjí – při zmrazení jen „hibernují“.
    exercises:
      - id: princip-voda
        type: choice
        prompt: "Na jakém principu prodlužuje trvanlivost solení nebo sušení?"
        options:
          - text: "Snižuje obsah vody, kterou mikroorganismy potřebují"
            correct: true
          - text: "Snižuje pH potraviny"
            why: "To dělá nakládání do octa nebo přídavek kyselin."
          - text: "Usmrcuje mikroorganismy vysokou teplotou"
            why: "To je pasterace, UHT nebo sterilizace."
          - text: "Vytváří v potravině ochranné látky"
            why: "To je princip fermentace."
      - id: mrazeni
        type: choice
        prompt: "Klientka si myslí, že mrazák bakterie v potravině zničí. Co platí podle skript?"
        options:
          - text: "Mikroorganismy při zmrazení jen „hibernují“, nezničí se."
            correct: true
          - text: "Teplota pod −18 °C zničí všechny bakterie."
            why: "Skripta to výslovně označují za mylnou představu."
          - text: "Mráz zničí bakterie, přežijí jen plísně."
            why: "Chlad nezabíjí ani bakterie."
          - text: "Zmrazení působí na mikroorganismy stejně jako pasterace."
            why: "Pasterace mikroorganismy usmrcuje teplem, mráz je jen utlumí."
      - id: vyklad
        type: explain
        prompt: "Vysvětli, jakými způsoby lze prodloužit trvanlivost potravin."
        keyPoints:
          - "Snížení obsahu vody: solení, sušení, lyofilizace"
          - "Snížení pH: ocet, kyseliny"
          - "Usmrcení mikroorganismů teplem nebo tlakem (pasterace, UHT, sterilizace, paskalizace)"
          - "Fermentace – vznik ochranných látek"
          - "Chlad mikroorganismy nezabíjí, jen je utlumí"
        modelAnswer: >-
          Cílem je hlavně zabránit kažení mikroorganismy. Můžeme jim vzít vodu solením, sušením nebo
          lyofilizací, případně snížit pH octem či kyselinami. Mikroorganismy můžeme také zničit
          teplem – pasterací, UHT nebo sterilizací – nebo vysokým tlakem. Fermentací vznikají ochranné
          látky. Mražení mikroorganismy nezabíjí, jen je utlumí.

  - id: pot.tepelne-osetreni
    title: Pasterace, UHT, sterilizace
    kind: comparison
    tier: A
    criteria: [4a, 9a]
    prereqs: [pot.prodlouzeni-trvanlivosti]
    confusableWith: [pot.prodlouzeni-trvanlivosti, pot.mleko-osetreni]
    source: { pages: [97, 117], anchor: "krátkodobé zahřátí na teplotu minimálně 71,7 °C po dobu 15 sekund" }
    explanation: >-
      Pasterace = krátké zahřátí na nejméně 71,7 °C po dobu 15 s. Vysoká pasterace = nejméně 85 °C.
      UHT = krátkodobé ošetření odpovídající nejméně 135 °C po dobu alespoň 1 s. Sterilizace =
      nepřímý ohřev v hermeticky uzavřeném obalu (zavařování), u nekyselých potravin nad 100 °C;
      usmrtí všechny mikroorganismy, proto sterilované výrobky nepotřebují konzervanty.
      Paskalizace = ošetření vysokým tlakem.
    exercises:
      - id: uht
        type: choice
        prompt: "Které ošetření odpovídá působení nejméně 135 °C po dobu alespoň 1 sekundy?"
        options:
          - text: "UHT"
            correct: true
          - text: "Pasterace"
            why: "Pasterace je nejméně 71,7 °C po dobu 15 s."
          - text: "Vysoká pasterace"
            why: "Vysoká pasterace je zahřátí na nejméně 85 °C."
          - text: "Paskalizace"
            why: "Paskalizace pracuje s vysokým tlakem, ne s teplotou."
      - id: pasterace
        type: choice
        prompt: "Jaké parametry má podle skript pasterace?"
        options:
          - text: "Nejméně 71,7 °C po dobu 15 s"
            correct: true
          - text: "Nejméně 85 °C"
            why: "To je vysoká pasterace."
          - text: "Nejméně 135 °C po dobu 1 s"
            why: "To je UHT."
          - text: "Nad 100 °C v hermeticky uzavřeném obalu"
            why: "To je sterilizace."
      - id: vyklad
        type: explain
        prompt: "Vysvětli rozdíl mezi pasterací, UHT a sterilizací."
        keyPoints:
          - "Pasterace: min. 71,7 °C / 15 s"
          - "UHT: min. 135 °C / alespoň 1 s"
          - "Sterilizace: nepřímý ohřev v hermeticky uzavřeném obalu, nekyselé potraviny nad 100 °C"
          - "Sterilizace usmrtí všechny mikroorganismy – výrobek nepotřebuje konzervanty"
        modelAnswer: >-
          Pasterace je krátké zahřátí na nejméně 71,7 °C po dobu 15 sekund, vysoká pasterace na
          nejméně 85 °C. UHT znamená krátkodobé ošetření nejméně 135 °C po dobu alespoň 1 sekundy.
          Sterilizace probíhá nepřímým ohřevem v hermeticky uzavřeném obalu, u nekyselých potravin
          nad 100 °C, a usmrtí všechny mikroorganismy, takže výrobek už nepotřebuje konzervanty.

  - id: pot.fermentace
    title: Fermentace (kvašení)
    kind: concept
    tier: A
    criteria: [4a]
    source: { pages: [97], anchor: "Příkladem kvašení s přístupem kyslíku je octové kvašení" }
    explanation: >-
      Fermentace (kvašení) je přeměna organických látek mikroorganismy a jejich enzymy. Bez přístupu
      kyslíku probíhá kvašení alkoholové a mléčné, s přístupem kyslíku octové. Cíle: získat určitou
      látku (ethanol, kyselinu octovou či mléčnou), změnit chuť, vůni a konzistenci, vytvořit plyn
      (CO₂ při kynutí), zvýšit nutriční hodnotu (vitaminy skupiny B), zlepšit stravitelnost bílkovin
      (sója) a prodloužit trvanlivost (nižší pH, alkohol, bakteriociny).
    exercises:
      - id: kyslik
        type: choice
        prompt: "Které kvašení probíhá s přístupem kyslíku?"
        options:
          - text: "Octové"
            correct: true
          - text: "Mléčné"
            why: "Mléčné kvašení probíhá bez přístupu kyslíku."
          - text: "Alkoholové"
            why: "Alkoholové kvašení probíhá bez přístupu kyslíku."
      - id: cile
        type: choice
        multiple: true
        prompt: "Co může být podle skript cílem fermentace?"
        options:
          - text: "Prodloužení trvanlivosti snížením pH"
            correct: true
          - text: "Lepší stravitelnost bílkovin (např. u sóji)"
            correct: true
          - text: "Vývoj CO₂ při kynutí těsta"
            correct: true
          - text: "Usmrcení všech mikroorganismů v potravině"
            why: "To je cíl sterilizace – při fermentaci naopak mikroorganismy pracují."

  - id: pot.nova-uzpp
    title: Klasifikace NOVA a ultrazpracované potraviny
    kind: concept
    tier: A
    status: course-disputed
    note: >-
      Výčet „základních nebo minimálně zpracovaných potravin“ na s. 101 neodpovídá přesně skupinám
      NOVA: uvádí např. za studena lisované oleje (v tab. 12.1 jsou rostlinné oleje ve skupině 2)
      a kváskové pečivo (pečivo je podle NOVA zpracovaná potravina). Na otázku po skupině NOVA
      odpovídej podle tabulky 12.1; na otázku po výčtu ze skript podle výčtu.
    criteria: [4a, 9d]
    source: { pages: [101], anchor: "Podle stupně zpracování potraviny dělíme do 4 skupin dle NOVA" }
    explanation: >-
      Klasifikace NOVA dělí potraviny podle stupně zpracování do 4 skupin: 1 – nezpracované
      a minimálně zpracované (vejce, chlazené maso, mražené ovoce, jogurt); 2 – zpracované kulinářské
      ingredience (oleje, sůl, cukerné sirupy); 3 – zpracované potraviny (sterilovaná zelenina, sýr);
      4 – vysoce zpracované, UZPP (chipsy, slazené nápoje, instantní výrobky, cukrovinky). UZPP
      mívají hodně cukru, škrobu, tuku a soli a aditiva zvýrazňující chuť.
    exercises:
      - id: skupina
        type: choice
        prompt: "Do které skupiny NOVA řadí skripta sterilovanou zeleninu?"
        options:
          - text: "3 – zpracované potraviny"
            correct: true
          - text: "1 – nezpracované a minimálně zpracované"
            why: "Sem patří např. vejce, chlazené maso, mražené ovoce."
          - text: "2 – zpracované kulinářské ingredience"
            why: "Sem patří oleje, sůl, cukerné sirupy."
          - text: "4 – vysoce zpracované"
            why: "Sem patří chipsy, slazené nápoje, instantní výrobky."
      - id: uzpp
        type: choice
        multiple: true
        prompt: "Které z těchto potravin řadí skripta mezi ultrazpracované (UZPP)?"
        options:
          - text: "Müsli tyčinka"
            correct: true
          - text: "Ochucené mléčné výrobky"
            correct: true
          - text: "Rostlinné alternativy masa"
            correct: true
          - text: "Kváskové pečivo"
            why: "Skripta ho řadí mezi minimálně zpracované potraviny."
          - text: "Ovesné vločky"
            why: "Skripta je řadí mezi minimálně zpracované potraviny."
          - text: "Za studena lisovaný olej"
            why: "Skripta ho řadí mezi minimálně zpracované potraviny."
      - id: vyklad
        type: explain
        prompt: "Klientka slyšela o „ultrazpracovaných potravinách“. Vysvětli jí klasifikaci NOVA."
        keyPoints:
          - "4 skupiny podle stupně zpracování"
          - "1 nezpracované/minimálně zpracované, 2 kulinářské ingredience, 3 zpracované, 4 vysoce zpracované"
          - "Příklady UZPP: chipsy, slazené nápoje, instantní výrobky, cukrovinky"
          - "UZPP: hodně cukru, škrobu, tuku, soli a aditiv zvýrazňujících chuť"
        modelAnswer: >-
          NOVA dělí potraviny podle stupně zpracování do čtyř skupin: nezpracované a minimálně
          zpracované (vejce, maso, jogurt), kulinářské ingredience (olej, sůl), zpracované potraviny
          (sýr, sterilovaná zelenina) a vysoce zpracované. Ultrazpracované výrobky jako chipsy, slazené
          nápoje nebo instantní jídla obvykle obsahují hodně cukru, škrobu, tuku a soli a aditiva,
          která zvýrazňují chuť.

  - id: pot.akrylamid
    title: Akrylamid a furan
    kind: fact
    tier: A
    criteria: [4a, 9b]
    source: { pages: [100, 106], anchor: "Vzniká již při teplotě 120 °C a za nízké vlhkosti" }
    explanation: >-
      Akrylamid vzniká při pečení a smažení potravin s obsahem sacharidů (škrobu), a to už od 120 °C
      a za nízké vlhkosti, při Maillardově reakci (neenzymové hnědnutí – potravina zhnědne). Furan
      vzniká i při šetrném vaření a jeho množství roste s délkou tepelné úpravy. Je těkavý, takže
      když hotové jídlo po otevření chvíli odstojí, jeho obsah klesne (o 15–30 %).
    exercises:
      - id: reakce
        type: choice
        prompt: "Při jaké reakci vzniká akrylamid?"
        options:
          - text: "Maillardova reakce"
            correct: true
          - text: "Karamelizace"
            why: "Karamelizací vznikají heterocyklické sloučeniny jako furfural a furany."
          - text: "Mazovatění škrobu"
            why: "To je změna škrobu s vodou, skripta ji řadí mezi pozitivní změny."
          - text: "Oxidace tuků"
            why: "Z tuků vznikají peroxidy, epoxidy, akrolein."
      - id: teplota
        type: choice
        prompt: "Od jaké teploty vzniká podle skript akrylamid?"
        options:
          - text: "Od 120 °C"
            correct: true
          - text: "Od 71,7 °C"
            why: "To je teplota pasterace."
          - text: "Od 200 °C"
            why: "Nad 200 °C vznikají rizikové látky z bílkovin (např. PAU)."
          - text: "Od 250 °C"
            why: "Akrylamid vzniká už při mnohem nižší teplotě."
      - id: vyklad
        type: explain
        prompt: "Jak bys klientce vysvětlila, proč nepřipalovat pečivo, brambory a hranolky?"
        keyPoints:
          - "Vzniká akrylamid – zdraví nebezpečná látka"
          - "Z potravin se škrobem při pečení a smažení"
          - "Už od 120 °C a za nízké vlhkosti"
          - "Maillardova reakce – hnědnutí"
        modelAnswer: >-
          Při pečení a smažení potravin se škrobem vzniká Maillardovou reakcí akrylamid, a to už od
          120 °C a za nízké vlhkosti. Navenek se to projevuje hnědnutím. Čím víc potravinu
          připálíme, tím víc těchto zdraví nebezpečných látek může vzniknout.

  - id: pot.hydrogenace
    title: Hydrogenace (ztužování) tuků
    kind: comparison
    tier: B
    status: course-disputed
    note: >-
      Kap. 12 (s. 98) uvádí, že plně ztužené tuky mají minimum trans MK „od roku 2014“, kap. 3
      (s. 28) klade změnu výroby na přelom tisíciletí a dodává, že trans MK vznikají i při
      deodoraci (součást rafinace). S. 250 řadí ztužené tuky obecně mezi nevhodné potraviny u
      diabetu. Na zkoušku: částečně ztužené = vysoký obsah trans MK, plně ztužené = minimum.
    criteria: [4a, 1b]
    source: { pages: [98, 111], anchor: "Částečně hydrogenované tuky obsahují vysoký obsah transmastných kyselin" }
    explanation: >-
      Hydrogenace je ztužování tuku – tak se vyrábějí pevné rostlinné tuky a margaríny. Částečně
      hydrogenované (ztužené) tuky obsahují hodně transmastných kyselin, proto je nelze doporučit.
      Plně hydrogenované tuky se dnes vyrábějí tak, že obsahují trans MK minimálně – na etiketě jsou
      tedy lepší volbou. Trans MK ale mohou vzniknout i z kvalitního tuku při nevhodném skladování
      a kulinářské úpravě.
    exercises:
      - id: nejvic-trans
        type: choice
        prompt: "Který tuk obsahuje podle skript nejvíce transmastných kyselin?"
        options:
          - text: "Částečně ztužený tuk"
            correct: true
          - text: "Plně ztužený tuk"
            why: "Plně ztužené tuky dnes obsahují trans MK minimálně."
          - text: "Za studena lisovaný olej"
            why: "Neprochází hydrogenací."
          - text: "Máslo"
            why: "Mléčný tuk obsahuje jen malé množství přirozených trans MK."
      - id: proc
        type: reveal
        prompt: "Proč je plně ztužený tuk ve složení paradoxně lepší než částečně ztužený?"
        answer: >-
          Částečně ztužené tuky obsahují hodně transmastných kyselin, plně ztužené se dnes vyrábějí
          tak, že jich obsahují minimum.

  - id: pot.kulinarni-upravy
    title: Kulinární úpravy a ztráty živin
    kind: comparison
    tier: A
    criteria: [4a]
    source: { pages: [98, 99], anchor: "Části ztrát je možné zamezit například vynecháním loupání" }
    explanation: >-
      Při vaření ve větším množství vody přecházejí do vody vitaminy rozpustné ve vodě a termolabilní
      látky; ztráty sníží vkládání do vroucí vody a neloupání. Dušení (málo tekutiny, zavřená nádoba)
      má ztráty nižší. Blanšírování (krátce pára či vroucí voda) inaktivuje enzymy včetně oxidáz
      kyseliny askorbové. Tuk je nejlepší rychle zahřát na cca 180 °C a teplotu udržovat – pomalé
      zahřívání zvyšuje ztráty vitaminů. Nad 200 °C vznikají z bílkovin karcinogeny.
    exercises:
      - id: zelenina
        type: choice
        prompt: "Jak podle skript snížit ztráty vitaminů při vaření zeleniny?"
        options:
          - text: "Vložit ji do už vroucí vody a nejlépe neloupat"
            correct: true
          - text: "Vložit ji do studené vody a pomalu přivést k varu"
            why: "Delší pobyt ve vodě znamená větší vyluhování."
          - text: "Vařit déle při nižší teplotě ve větším objemu vody"
            why: "Více vody a delší čas zvyšují ztráty."
          - text: "Předem ji oloupat a nakrájet nadrobno"
            why: "Neloupání naopak ztráty snižuje."
      - id: tuk
        type: choice
        prompt: "Jak podle skript správně zahřívat tuk na smažení?"
        options:
          - text: "Rychle na cca 180 °C a teplotu udržovat"
            correct: true
          - text: "Pomalu a postupně zvyšovat teplotu"
            why: "Pomalé zvedání teploty znamená vyšší ztráty vitaminů."
          - text: "Zahřát co nejvíce, aby se potravina rychle zatáhla"
            why: "Přehřátím vzniká akrolein, PAU a další škodliviny."
          - text: "Zahřívat, dokud se z tuku nezačne kouřit"
            why: "Kouř znamená přepalování tuku a vznik škodlivin."
      - id: blansirovani
        type: reveal
        prompt: "Co je blanšírování a co při něm v potravině nastane?"
        answer: >-
          Rychlé ošetření párou nebo krátké ponoření do vroucí vody; inaktivují se enzymy (i oxidázy
          kyseliny askorbové).

  - id: pot.vitaminy-stabilita
    title: Stabilní a labilní vitaminy při zpracování
    kind: comparison
    tier: B
    status: course-disputed
    note: >-
      Kap. 4 (s. 49) uvádí, že vitaminy rozpustné v tucích (A, D, E, K) jsou poměrně stabilní vůči
      vzduchu i teplu, kap. 12 však řadí vitamin K mezi labilní. S. 99 zároveň popisuje výrazné
      ztráty vitaminu E při zahřívání olejů a s. 98 jeho ztráty při deodoraci. Na otázku ke
      zpracování potravin odpovídej podle seznamu z kap. 12.
    criteria: [4a, 1e]
    source: { pages: [100], anchor: "Mezi stabilní vitaminy patří vitaminy D, E, biotin" }
    explanation: >-
      Ztráty vitaminů závisí na zpracování a skladování a mohou dosáhnout 80 % i více. Podle kap. 12
      jsou stabilní vitaminy D, E, biotin (B7), pyridoxin (B6), niacin (B3) a riboflavin (B2);
      labilní jsou B12, kyselina listová (B9), kyselina pantotenová (B5), thiamin (B1), vitamin C
      a vitamin K. Sušení ničí hlavně vitamin C (asi 80 %) a betakaroten (asi 50 %). V mraženém mase
      jsou vitaminy stabilní, ztráty vznikají nevhodným rozmrazováním.
    exercises:
      - id: labilni
        type: choice
        prompt: "Který z těchto vitaminů řadí skripta (kap. 12) mezi labilní?"
        options:
          - text: "Thiamin (B1)"
            correct: true
          - text: "Niacin (B3)"
            why: "Skripta ho řadí mezi stabilní."
          - text: "Vitamin D"
            why: "Skripta ho řadí mezi stabilní."
          - text: "Riboflavin (B2)"
            why: "Skripta ho řadí mezi stabilní."
      - id: suseni
        type: choice
        prompt: "Které látky se podle skript nejvíce ztrácejí při sušení?"
        options:
          - text: "Vitamin C a betakaroten"
            correct: true
          - text: "Vitamin D a E"
            why: "Skripta je řadí mezi stabilní."
          - text: "Bílkoviny a tuky"
            why: "Sušením se makroživiny neztrácejí, jen se koncentrují."
          - text: "Biotin a niacin"
            why: "Skripta je řadí mezi stabilní vitaminy."

  - id: pot.pridana-voda
    title: Přidaná voda – křehčení a glazování
    kind: fact
    tier: B
    status: course-disputed
    note: >-
      Skripta si odporují: s. 100 uvádí, že přidanou vodu do 10 % výrobce nemusí uvádět, s. 109
      že přidaná voda se uvádí nad 5 %. Hranice 5 % odpovídá i nařízení (EU) č. 1169/2011 – tu
      považuj za správnou odpověď. Glazování popisuje s. 100 jako fosforečnou glazuru zadržující
      vodu, s. 112 jako nástřik pitné vody, který chrání filety před vymrzáním. U glazovaných ryb
      se čistá hmotnost podle EU uvádí bez glazury.
    criteria: [4c, 4a]
    source: { pages: [100, 109], anchor: "Příkladem je křehčení masa, kdy se do masa přidává voda" }
    explanation: >-
      Některé postupy „chrání“ potravinu před ztrátou vody, pro spotřebitele ale znamenají nižší
      nutriční hodnotu. Křehčení masa = do masa se přidává voda, takže spotřebitel platí i za ni.
      Glazování (hlavně u ryb, typicky Double Frozen) = povrchová vrstva vody či fosforečné
      glazury, která chrání filety před vymrzáním a drží vodu v mase. Přidaná voda se ve složení
      uvádí, pokud tvoří více než 5 %.
    exercises:
      - id: hranice
        type: choice
        prompt: "Nad jaký podíl musí být přidaná voda uvedena ve složení (podle platné legislativy)?"
        options:
          - text: "Nad 5 %"
            correct: true
          - text: "Nad 2 %"
            why: "2 % je hranice, pod kterou nezáleží na pořadí složek."
          - text: "Nad 0,9 %"
            why: "To je hranice pro označení GMO."
          - text: "Nad 10 %"
            why: "Tak to uvádí s. 100, ale v rozporu s kapitolou o složení i s legislativou."
      - id: glazovani
        type: reveal
        version: 2
        prompt: "Co je glazování ryb a co pro spotřebitele znamená?"
        answer: >-
          Na povrch mražené ryby se nanáší voda či fosforečná glazura – chrání filety před
          vymrzáním a drží vodu v mase. Podle skript tím klesá nutriční hodnota (čistá hmotnost se
          ale uvádí bez glazury).

  - id: pot.sterilovane
    title: Sterilované potraviny
    kind: fact
    tier: B
    status: course-disputed
    note: >-
      S. 97 definuje sterilizaci jako ohřev „nad 100 °C“, s. 117 uvádí pro kyselé potraviny
      sterilační teploty do 100 °C. Obecná definice ze s. 97 platí pro nekyselé potraviny, u kyselých
      stačí teplota do 100 °C.
    criteria: [4a]
    prereqs: [pot.tepelne-osetreni]
    source: { pages: [117], anchor: "Tyto potraviny již nepotřebují konzervanty" }
    explanation: >-
      Sterilace probíhá nepřímým ohřevem v hermeticky uzavřených obalech (zavařování), nebo
      v průtokových výměnících s aseptickým plněním. Kyselé potraviny (ovoce, zelenina v kyselém
      nálevu) se sterilují do 100 °C, nekyselé (zelenina, maso, mléko) nad 100 °C. Bílkoviny,
      sacharidy, tuky, většina minerálů a vitaminů rozpustných v tucích zůstávají; ztrácejí se
      vitaminy citlivé na teplo a vzduch (skupina B, C). Konzervanty nejsou potřeba, ale bývá v nich
      víc cukru a soli.
    exercises:
      - id: konzervanty
        type: choice
        prompt: "Proč sterilované konzervy podle skript nepotřebují konzervanty?"
        options:
          - text: "Sterilací byly usmrceny všechny mikroorganismy"
            correct: true
          - text: "Obsahují vždy velké množství soli"
            why: "Více soli v nich bývá, ale není to důvod."
          - text: "Byly krátce zahřáty na 71,7 °C"
            why: "To je pasterace, která všechny mikroorganismy nezničí."
          - text: "Obal obsahuje bisfenol A, který brání růstu bakterií"
            why: "BPA je složka některých plastů, ne konzervant potraviny."
      - id: ztraty
        type: choice
        prompt: "Které živiny se při sterilaci ztrácejí nejvíce?"
        options:
          - text: "Vitaminy skupiny B a vitamin C"
            correct: true
          - text: "Bílkoviny"
            why: "Množství bílkovin sterilace neovlivní."
          - text: "Vitaminy rozpustné v tucích"
            why: "Ty se podle skript většinou zachovají."
          - text: "Minerální látky"
            why: "Většina minerálních látek se zachová."

  - id: pot.fortifikace
    title: Fortifikace – přímá a nepřímá
    kind: comparison
    tier: B
    criteria: [4a, 9d]
    source: { pages: [93, 97, 98], anchor: "Fortifikace může být přímá a nepřímá" }
    explanation: >-
      Fortifikace = obohacení potraviny o živiny, které v ní chybějí, je jich málo nebo se ztratily
      zpracováním. Cílem je prevence deficitu (vitaminy B do mouky, jodidovaná sůl, vápník,
      vitamin D a B12 do rostlinných nápojů). Přímá fortifikace obohatí přímo konzumovanou potravinu
      (margaríny, snídaňové cereálie, nápoje). Nepřímá dodá živiny krmením zvířete – omega vejce
      od slepic krmených lněným semínkem či rybím olejem, omega kapr.
    exercises:
      - id: omega-vejce
        type: choice
        prompt: "Omega vejce od slepic krmených lněným semínkem jsou příkladem…"
        options:
          - text: "nepřímé fortifikace"
            correct: true
          - text: "přímé fortifikace"
            why: "Přímá fortifikace obohacuje přímo konzumovanou potravinu (např. cereálie)."
          - text: "genetické modifikace"
            why: "Žádná genetická úprava neprobíhá, mění se jen krmivo."
          - text: "potraviny nového typu"
            why: "Vejce mají dlouhou historii spotřeby."
      - id: priklady
        type: reveal
        prompt: "Uveď dva příklady fortifikovaných potravin a k čemu fortifikace slouží."
        answer: >-
          Např. mouka obohacená o vitaminy B, jodidovaná sůl, rostlinné nápoje s vápníkem, vitaminy D
          a B12. Slouží k prevenci deficitu u některých skupin populace.

  - id: pot.rafinace
    title: Rafinace olejů
    kind: procedure
    tier: C
    criteria: [4a, 1b]
    source: { pages: [98], anchor: "Rafinace navíc zvyšuje tepelnou odolnost tuku" }
    explanation: >-
      Rafinace = lisování za vysokých tlaků a teplot a chemická úprava. Odstraní zbytky, které by se
      přepalovaly, neutralizuje chuť a vůni a zvýší tepelnou odolnost tuku. Kroky: hydratace
      (odsliznění, fosfolipidy), alkalická rafinace (neutralizace, volné MK), bělení (barviva),
      deodorace (vodní pára 180–260 °C; odstraní i část tokoferolů a sterolů). Rafinované oleje
      obsahují kontaminant 3-MCPD – nejméně řepkový, nejvíce palmový.
    exercises:
      - id: mcpd
        type: choice
        prompt: "Ve kterém oleji je podle skript nejvíce 3-MCPD?"
        options:
          - text: "V palmovém"
            correct: true
          - text: "V řepkovém"
            why: "Řepkový olej ho má podle skript nejméně."
          - text: "V extra panenském olivovém"
            why: "MCPD se týká rafinovaných olejů."
      - id: deodorace
        type: reveal
        prompt: "Co se kromě pachových látek ztrácí při deodoraci oleje?"
        answer: "Volné mastné kyseliny a část tokoferolů (vitaminu E) a sterolů."

  # ---------- 4b Aditiva ----------

  - id: pot.aditiva-podminky
    title: Kdy se smějí použít aditiva
    kind: concept
    tier: A
    criteria: [4b]
    source: { pages: [107], anchor: "pokud je to potřebné z technologického hlediska a nelze toho dosáhnout jinak" }
    explanation: >-
      Přídatné látky (aditiva, „éčka“) nejsou samostatné potraviny – přidávají se, aby zlepšily
      vlastnosti potraviny. Smějí se použít jen tehdy, když jsou technologicky potřebné a účelu nelze
      dosáhnout jinak; nesmějí být nadměrným rizikem pro spotřebitele a nesmějí ho uvádět v omyl.
      Zákon určuje, do kterých potravin a v jakém množství se dané „E“ smí přidat, a existují
      základní potraviny, do kterých se nesmí přidat žádné.
    exercises:
      - id: podminky
        type: choice
        multiple: true
        prompt: "Které podmínky musí podle skript splnit použití přídatné látky?"
        options:
          - text: "Je potřebné z technologického hlediska"
            correct: true
          - text: "Účelu nelze dosáhnout jinak"
            correct: true
          - text: "Neuvádí spotřebitele v omyl"
            correct: true
          - text: "Je přírodního původu"
            why: "Aditiva mohou být přírodní, přírodně identická i syntetická."
          - text: "Zvyšuje výživovou hodnotu potraviny"
            why: "Látky přidané kvůli výživové hodnotě (fortifikace) mezi „E“ naopak nepatří."
      - id: zakladni
        type: reveal
        prompt: "Smí se „éčka“ přidávat do jakékoli potraviny v libovolném množství?"
        answer: >-
          Ne. Zákon stanoví, do kterých potravin a v jakém množství (případně v jakých kombinacích)
          lze dané aditivum použít; do některých základních potravin nesmí žádné.

  - id: pot.aditiva-legislativa
    title: Kdo o aditivech rozhoduje a potraviny pro děti
    kind: fact
    tier: A
    status: course-disputed
    note: >-
      S. 107 píše, že o povolení aditiv v Evropě „rozhoduje EFSA“, s. 105 ale EFSA popisuje jen
      jako úřad, který dává podklady pro změny legislativy (formálně o povolení rozhoduje Evropská
      komise na základě hodnocení EFSA). Na zkoušku jmenuj EFSA jako evropskou instituci.
    criteria: [4b]
    confusableWith: [pot.dozor-mezinarodni]
    source: { pages: [107], anchor: "Pro Evropu o tomto rozhoduje EFSA a pro USA FDA" }
    explanation: >-
      O povolení přídatných látek rozhoduje podle skript pro Evropu EFSA (formálně je schvaluje
      Evropská komise na základě posudku EFSA), pro USA FDA; ČR se řídí pravidly EU.
      Pravidla se průběžně přehodnocují. Přísnější omezení druhů i množství „E“ platí pro potraviny
      označené pro děti (např. „od X měsíců“, do 3 let) a pro potraviny k léčebným účelům. Pozor:
      samotné slovo „dětský“ legislativně nic neznamená – může jít o běžnou konvenční potravinu.
    exercises:
      - id: detsky
        type: choice
        prompt: "Jogurt nese nápis „dětský“, ale žádný údaj o věku. Co to podle skript znamená?"
        options:
          - text: "Legislativně nic – může jít o běžný výrobek"
            correct: true
          - text: "Smí obsahovat jen přírodní aditiva"
            why: "Slovo „dětský“ žádná zvláštní pravidla nepřináší."
          - text: "Platí pro něj přísné limity jako pro výživu dětí do 3 let"
            why: "Přísnější limity platí jen pro potraviny označené pro děti od určitého věku / do 3 let."
          - text: "Nesmí obsahovat žádná „éčka“"
            why: "Takové pravidlo pro slovo „dětský“ neexistuje."
      - id: efsa
        type: choice
        prompt: "Která instituce podle skript rozhoduje o přídatných látkách pro Evropu?"
        options:
          - text: "EFSA"
            correct: true
          - text: "FDA"
            why: "FDA rozhoduje pro USA."
          - text: "SZPI"
            why: "SZPI kontroluje potraviny v obchodní síti, o povolení aditiv nerozhoduje."
          - text: "RASFF"
            why: "RASFF je systém rychlého varování."

  - id: pot.aditiva-kategorie
    title: Funkční skupiny aditiv
    kind: concept
    tier: A
    criteria: [4b]
    source: { pages: [107], anchor: "konzervanty, antioxidanty, látky určené k tvoření textury, konzistence a zajištění stability" }
    explanation: >-
      Podle funkce se aditiva dělí na: konzervanty, antioxidanty, látky upravující texturu
      a konzistenci a zajišťující stabilitu (želírující, zahušťovací, stabilizační), emulgátory,
      ochucovadla a zvýrazňovače chuti, potravinářská barviva a náhrady cukru (sladidla). Funkci musí
      etiketa vždy uvést, např. „regulátor kyselosti: E330“, „sladidlo: aspartam“.
    exercises:
      - id: kategorie
        type: choice
        multiple: true
        prompt: "Které z následujících jsou podle skript skupiny přídatných látek?"
        options:
          - text: "Konzervanty"
            correct: true
          - text: "Emulgátory"
            correct: true
          - text: "Zvýrazňovače chuti"
            correct: true
          - text: "Barviva"
            correct: true
          - text: "Aromata"
            why: "Aromata mají vlastní legislativu a mezi „E“ nepatří."
          - text: "Vitaminy přidané k fortifikaci"
            why: "Látky k úpravě výživové hodnoty nejsou „E“."
      - id: vyjmenuj
        type: reveal
        prompt: "Vyjmenuj alespoň pět funkčních skupin přídatných látek."
        answer: >-
          Konzervanty, antioxidanty, zahušťovadla/želírující látky/stabilizátory, emulgátory,
          ochucovadla a zvýrazňovače chuti, barviva, sladidla.

  - id: pot.aditiva-puvod
    title: Přírodní, přírodně identická a syntetická aditiva
    kind: comparison
    tier: A
    criteria: [4b]
    confusableWith: [pot.aromata]
    source: { pages: [107], anchor: "přírodně identická (mají stejnou strukturu jako přírodní ale jsou vyrobeny synteticky" }
    explanation: >-
      Podle původu jsou „éčka“ přírodní (např. pektin, karamel), přírodně identická – mají stejnou
      strukturu jako přírodní látka, ale vyrábějí se synteticky (např. kyselina askorbová) –
      a syntetická (např. cyklamáty). V každé funkční skupině jsou látky různého původu, takže „E“
      samo o sobě neznamená „umělá chemie“.
    exercises:
      - id: askorbova
        type: choice
        prompt: "Synteticky vyrobená kyselina askorbová se stejnou strukturou jako v přírodě je aditivum…"
        options:
          - text: "přírodně identické"
            correct: true
          - text: "přírodní"
            why: "Přírodní aditivum se získává z přírody (např. pektin), nevyrábí se synteticky."
          - text: "syntetické"
            why: "Syntetické látky (např. cyklamáty) nemají přírodní vzor se stejnou strukturou."
          - text: "nepatří mezi aditiva"
            why: "Kyselina askorbová se jako aditivum používá."
      - id: synteticke
        type: choice
        prompt: "Které z těchto aditiv uvádějí skripta jako příklad syntetického?"
        options:
          - text: "Cyklamáty"
            correct: true
          - text: "Pektin"
            why: "Pektin je přírodní aditivum."
          - text: "Karamel"
            why: "Karamel je přírodní aditivum."
          - text: "Kyselina askorbová"
            why: "Kyselina askorbová je přírodně identická."

  - id: pot.aditiva-co-neni-e
    title: Co mezi „éčka“ nepatří
    kind: concept
    tier: A
    status: course-disputed
    note: >-
      Skripta řadí modifikované škroby mezi technologicky upravené látky, které nejsou „E“. Podle
      platné legislativy EU ale modifikované škroby E-kódy mají (řada E 14xx); želatina mezi aditiva
      skutečně nepatří. U zkoušky drž výklad skript, ale nenech se zaskočit, objeví-li se
      modifikovaný škrob jako „éčko“.
    criteria: [4b]
    prereqs: [pot.aditiva-kategorie]
    source: { pages: [107], anchor: "látky, které jsou samy potravinami (ocet, sůl)" }
    explanation: >-
      Mezi „éčka“ nepatří: látky, které jsou samy potravinou (ocet, sůl), látky v potravinách
      přirozeně obsažené (sacharidy), podle skript ani technologicky upravené látky (škroby,
      želatina), aromatické látky (např. chinin, kofein) a látky přidané kvůli výživové hodnotě
      (fortifikace). Aromata mají vlastní legislativu.
    exercises:
      - id: nepatri
        type: choice
        multiple: true
        prompt: "Které z těchto látek podle skript NEPATŘÍ mezi aditiva („E“)?"
        options:
          - text: "Kuchyňská sůl"
            correct: true
          - text: "Kofein použitý jako aromatická látka"
            correct: true
          - text: "Vitamin přidaný k fortifikaci"
            correct: true
          - text: "Pektin"
            why: "Pektin je přírodní aditivum (zahušťovadlo)."
          - text: "Aspartam"
            why: "Aspartam je sladidlo – aditivum."
      - id: proc
        type: reveal
        prompt: "Uveď čtyři skupiny látek, které podle skript nejsou „éčky“."
        answer: >-
          Látky, které jsou samy potravinou (ocet, sůl); přirozeně obsažené látky (sacharidy);
          aromatické látky (chinin, kofein); látky přidané k fortifikaci. Skripta sem řadí i
          technologicky upravené škroby a želatinu.

  - id: pot.aditiva-zdravi
    title: Aditiva a zdraví – mýty a fakta
    kind: concept
    tier: A
    criteria: [4b, 9c]
    prereqs: [pot.aditiva-puvod]
    source: { pages: [95, 107], anchor: "Za růžovou barvu mohou právě dusitany" }
    explanation: >-
      Aditiva nejsou automaticky škodlivá – jejich použití je legislativně omezené a v každé skupině
      jsou látky přírodní i syntetické. Skripta přesto doporučují, aby se syntetickým „éčkům“ spíše
      vyhýbaly děti, senioři a lidé s některými nemocemi. Typický rozpor: lidé nechtějí dusitany
      v uzeninách, ale chtějí růžovou, ne šedou šunku – růžovou barvu způsobují právě dusitany
      (obr. 12.7 je přesto řadí mezi éčka, kterým je lepší se vyhnout). Pozor i na mýtus, že BIO je
      bez „éček“.
    exercises:
      - id: dusitany
        type: choice
        prompt: "Čím je podle skript způsobena růžová barva uzenin?"
        options:
          - text: "Dusitany"
            correct: true
          - text: "Azobarvivy"
            why: "Azobarviva by musela být uvedena i s upozorněním na hyperaktivitu dětí."
          - text: "Karamelem"
            why: "Karamel je hnědé barvivo."
          - text: "Červenou řepou"
            why: "Barvu uzenin dávají dusitany."
      - id: kdo
        type: choice
        prompt: "Komu skripta doporučují se syntetickým „E“ spíše vyhýbat?"
        options:
          - text: "Dětem, seniorům a některým nemocným"
            correct: true
          - text: "Pouze lidem s celiakií"
            why: "Doporučení je širší a s lepkem nesouvisí."
          - text: "Všem bez výjimky – jsou vždy škodlivá"
            why: "Aditiva jsou povolena jen tehdy, když nepředstavují nadměrné riziko."
          - text: "Nikomu – syntetická E jsou bezpečnější než přírodní"
            why: "Skripta naopak doporučují citlivým skupinám se jim vyhýbat."
      - id: vyklad
        type: explain
        version: 2
        prompt: "Klientka říká, že „éčka“ jsou jed a chce je úplně vyřadit. Jak jí odpovíš?"
        keyPoints:
          - "Aditiva se smějí použít jen když jsou technologicky nutná a nepředstavují nadměrné riziko"
          - "Existují přírodní, přírodně identická i syntetická (E ≠ automaticky chemie)"
          - "Syntetickým E se spíše vyhnout u dětí, seniorů a nemocných"
          - "Dusitany: chceme růžovou uzeninu, barvu dávají právě ony (skripta je přesto řadí k éčkům „raději se vyhněte“)"
          - "I BIO potraviny mohou E obsahovat"
        modelAnswer: >-
          Aditiva smějí být použita jen tehdy, když jsou technologicky potřebná a nepředstavují
          nadměrné riziko, a jejich množství určuje zákon. Mnohá jsou přírodní nebo přírodně
          identická, takže „E“ neznamená automaticky chemii. Dětem, seniorům a nemocným je ale
          vhodné syntetická éčka omezovat. Často jde o rozpor očekávání – lidé nechtějí dusitany,
          ale chtějí růžovou šunku, kterou dělají právě dusitany; i tak je skripta řadí mezi éčka,
          kterým je lepší se spíše vyhnout.

  - id: pot.e-ciselne-rady
    title: Číselné řady E-kódů
    kind: fact
    tier: B
    status: supplementary
    note: >-
      Skripta číselné řady neuvádějí; obr. 12.7 na s. 108 je jen seznam éček „raději se vyhněte /
      nemusíte se bát“ (viz pot.aditiva-pomucka). Řady doplněny podle běžného číslování přídatných
      látek v EU, protože pomáhají číst etikety.
    criteria: [4b, 9c]
    prereqs: [pot.aditiva-kategorie]
    source: { pages: [108], anchor: "Pomůcka pro snadnou orientaci v" }
    explanation: >-
      Podle čísla E-kódu se dá odhadnout skupina: E100–199 barviva, E200–299 konzervanty,
      E300–399 antioxidanty a regulátory kyselosti, E400–499 zahušťovadla, želírující látky,
      stabilizátory a emulgátory, E500–599 regulátory kyselosti a protispékavé látky, E600–699
      zvýrazňovače chuti (např. glutamát E621), E900–999 mimo jiné sladidla a lešticí látky. Řady
      jsou orientační – funkci musí uvádět etiketa.
    exercises:
      - id: e200
        type: choice
        prompt: "Do které skupiny orientačně patří aditiva s čísly E200–E299?"
        options:
          - text: "Konzervanty"
            correct: true
          - text: "Barviva"
            why: "Barviva jsou E100–E199."
          - text: "Antioxidanty"
            why: "Antioxidanty jsou E300–E399."
          - text: "Zahušťovadla a emulgátory"
            why: "Ty jsou E400–E499."
      - id: e621
        type: choice
        prompt: "Do které skupiny patří glutamát (E621)?"
        options:
          - text: "Zvýrazňovače chuti"
            correct: true
          - text: "Konzervanty"
            why: "Konzervanty jsou E200–E299."
          - text: "Sladidla"
            why: "Sladidla jsou hlavně v řadě E900–E999."
          - text: "Barviva"
            why: "Barviva jsou E100–E199."

  - id: pot.aditiva-pomucka
    title: Pomůcka – kterým éčkům se spíše vyhnout
    kind: fact
    tier: B
    criteria: [4b, 9c]
    prereqs: [pot.aditiva-kategorie]
    source: { pages: [108], anchor: "Pomůcka pro snadnou orientaci v" }
    explanation: >-
      Skripta přebírají orientační pomůcku (obr. 12.7, zdroj ferpotravina.cz). Raději se vyhnout:
      některým barvivům (např. E102, E110, E129), konzervantům – sorbanům (E200–E203), benzoanům
      (E210–E213), siřičitanům (E220–E228) a dusitanům/dusičnanům (E250–E252) –, sladidlům (E420–E421,
      E950–E952, E954) a glutamátům (E620–E625). Bát se nemusíš např. kyseliny octové (E260),
      mléčné (E270), askorbové (E300) či pektinu (E440); plyny ochranné atmosféry po otevření
      vyprchají. Mléčné a masné výrobky se škroby, želatinou či gumami jsou méně kvalitní.
    exercises:
      - id: vyhnout
        type: choice
        multiple: true
        prompt: "Která éčka řadí pomůcka ve skriptech (obr. 12.7) mezi ta, kterým je lepší se vyhnout?"
        options:
          - text: "Dusitany a dusičnany (E250–E252)"
            correct: true
          - text: "Glutamáty (E620–E625)"
            correct: true
          - text: "Aspartam (E951)"
            correct: true
          - text: "Kyselina askorbová (E300)"
            why: "Pomůcka ji řadí mezi éčka, kterých se nemusíš bát."
          - text: "Pektin (E440)"
            why: "Pomůcka ho řadí mezi éčka, kterých se nemusíš bát."
          - text: "Dusík jako ochranná atmosféra (E941)"
            why: "Plyny ochranné atmosféry po otevření obalu vyprchají."
      - id: kvalita
        type: reveal
        prompt: "Čemu se podle pomůcky ve skriptech vyhnout u mléčných a masných výrobků z pohledu kvality?"
        answer: "Výrobkům s přídavkem škrobů, želatiny, agaru či jiných gum."

  # ---------- 9c Aditiva na etiketách ----------

  - id: pot.aditiva-oznaceni
    title: Jak se aditiva uvádějí ve složení
    kind: procedure
    tier: A
    criteria: [9c, 4c]
    source: { pages: [107, 109], anchor: "Aditiva (slovně nebo Ekód) je třeba uvádět vždy" }
    explanation: >-
      Aditiva se ve složení uvádějí vždy – buď E-kódem, nebo názvem, a vždy spolu s funkcí, kterou
      v potravině plní, např. „regulátor kyselosti: E330“ nebo „sladidlo: aspartam“. U aromat se
      uvádí jejich původ (přírodní, nebo syntetické). U některých aditiv je navíc povinné
      upozornění (alergeny, azobarviva, sladidla, aspartam).
    exercises:
      - id: jak
        type: choice
        prompt: "Jak musí být podle skript aditivum uvedeno ve složení?"
        options:
          - text: "E-kódem nebo názvem, vždy s uvedením funkce"
            correct: true
          - text: "Pouze E-kódem"
            why: "Stejně dobře lze použít název."
          - text: "Pouze názvem, E-kódy se už nepoužívají"
            why: "Obě formy jsou přípustné."
          - text: "Stačí souhrnně „přídatné látky“"
            why: "Každé aditivum se musí uvést jednotlivě i s funkcí."
      - id: spravne
        type: choice
        prompt: "Který zápis ve složení odpovídá pravidlům?"
        options:
          - text: "regulátor kyselosti: E330"
            correct: true
          - text: "E330"
            why: "Chybí funkce aditiva."
          - text: "přídatné látky (E)"
            why: "Aditivum musí být uvedeno kódem nebo názvem a funkcí."
          - text: "kyselina"
            why: "Chybí konkrétní látka i její funkce."
      - id: vyklad
        type: explain
        prompt: "Klientka nerozumí „éčkům“ ve složení. Vysvětli jí, jak se aditiva na etiketě uvádějí."
        keyPoints:
          - "Aditiva musí být ve složení uvedena vždy"
          - "E-kódem nebo názvem – obojí je rovnocenné"
          - "Vždy s funkcí (např. regulátor kyselosti: E330)"
          - "U některých povinné upozornění (azobarviva, sladidla, aspartam, siřičitany)"
          - "Aromata nejsou E – uvádí se jejich původ"
        modelAnswer: >-
          Každé aditivum musí být ve složení uvedeno, buď E-kódem, nebo názvem, a vždy s funkcí,
          kterou plní – třeba „regulátor kyselosti: E330“. Některá aditiva mají navíc povinné
          upozornění, například azobarviva nebo aspartam. Aromata mezi éčka nepatří, u nich se
          uvádí, zda jsou přírodní.

  - id: pot.aditiva-upozorneni
    title: Povinná upozornění u některých aditiv
    kind: fact
    tier: A
    status: course-disputed
    note: >-
      Skripta píší o projímavém účinku „umělých sladidel“ obecně. Podle legislativy se toto
      upozornění týká potravin s více než 10 % polyolů (sorbitol, xylitol, maltitol…) – srov. kap. 2
      (s. 21), kde se projímavý účinek uvádí právě u polyolů. Upozornění na hyperaktivitu se váže na
      šest konkrétních barviv (většinou azobarviva). Fenylalanin je problém pro lidi
      s fenylketonurií. U sladidel je navíc povinný údaj „se sladidlem/sladidly“. U zkoušky uveď
      výklad skript, případně upřesni, že projímavý účinek se týká polyolů.
    criteria: [9c, 4b]
    prereqs: [pot.aditiva-oznaceni]
    source: { pages: [107], anchor: "U azobarviv musí být upozornění, že mohou způsobovat hyperaktivitu dětí" }
    explanation: >-
      U některých aditiv musí být na obalu doplňující upozornění: oxid siřičitý a siřičitany a sójový
      lecitin se značí jako alergeny; u azobarviv, že mohou způsobovat hyperaktivitu dětí;
      u sladidel, že mají projímavé účinky; u aspartamu, že je zdrojem fenylalaninu.
    exercises:
      - id: aspartam
        type: choice
        prompt: "U kterého aditiva musí být upozornění, že je zdrojem fenylalaninu?"
        options:
          - text: "Aspartam"
            correct: true
          - text: "Sacharin"
            why: "Fenylalanin obsahuje aspartam."
          - text: "Glutamát"
            why: "Glutamát je zvýrazňovač chuti, toto upozornění se ho netýká."
          - text: "Kyselina askorbová"
            why: "Toto upozornění se jí netýká."
      - id: azobarviva
        type: choice
        prompt: "Jaké upozornění musí být u azobarviv?"
        options:
          - text: "Mohou způsobovat hyperaktivitu dětí"
            correct: true
          - text: "Mají projímavé účinky"
            why: "To se uvádí u sladidel."
          - text: "Jsou zdrojem fenylalaninu"
            why: "To se uvádí u aspartamu."
          - text: "Obsahují lepek"
            why: "Takové upozornění se u barviv nevyžaduje."
      - id: vyklad
        type: explain
        prompt: "Která aditiva musí mít na obalu zvláštní upozornění a jaké?"
        keyPoints:
          - "Oxid siřičitý a siřičitany – jako alergen"
          - "Sójový lecitin – jako alergen"
          - "Azobarviva – mohou způsobovat hyperaktivitu dětí"
          - "Sladidla – projímavé účinky"
          - "Aspartam – zdroj fenylalaninu"
        modelAnswer: >-
          Oxid siřičitý, siřičitany a sójový lecitin se musí označit jako alergeny. U azobarviv musí
          být upozornění, že mohou způsobovat hyperaktivitu dětí, u sladidel, že mohou působit
          projímavě, a u aspartamu, že je zdrojem fenylalaninu.

  - id: pot.aromata
    title: Aromata na etiketě
    kind: fact
    tier: A
    status: course-disputed
    note: >-
      Skripta dělí aromata jen na přírodní a syntetická, takže samotné „aroma“ bez přívlastku
      vychází jako syntetické. Nařízení EU o aromatech (č. 1334/2008) ale rozlišuje jen, zda aroma
      smí nést slovo „přírodní“ (za přísných podmínek); „aroma“ bez přívlastku tedy nemusí být
      nutně syntetické. Biopotraviny smějí obsahovat jen přírodní aromata. U zkoušky drž výklad
      skript.
    criteria: [9c, 4b]
    confusableWith: [pot.aditiva-puvod]
    source: { pages: [107, 109], anchor: "Aromata mají vlastní legislativu" }
    explanation: >-
      Aromata nejsou přídatné látky „E“ – mají vlastní legislativu. Na rozdíl od „éček“ u nich chybí
      mezistupeň „přírodně identické“: jsou buď přírodní, nebo syntetická. Je-li použito přírodní
      aroma, musí být označeno slovem „přírodní“; samotné „aroma“ tedy podle skript znamená
      syntetické. Aromata smějí obsahovat i biopotraviny (podle EU jen přírodní).
    exercises:
      - id: aroma
        type: choice
        version: 2
        prompt: "Ve složení čteš jen „aroma“. Co to podle skript znamená?"
        options:
          - text: "Není označeno jako přírodní – podle skript jde o syntetické"
            correct: true
          - text: "Jde o přírodní aroma, syntetické by mělo E-kód"
            why: "Aromata E-kódy nemají; přírodní musí být označeno slovem „přírodní“."
          - text: "Jde o přírodně identické aroma"
            why: "U aromat tento mezistupeň neexistuje."
          - text: "Jde o „éčko“ ze skupiny ochucovadel"
            why: "Aromata mezi „E“ nepatří."
      - id: vyklad
        type: explain
        version: 2
        prompt: "Jak bys klientce vysvětlila rozdíl mezi „aroma“ a „přírodní aroma“ ve složení?"
        keyPoints:
          - "Aromata nejsou „E“, mají vlastní legislativu"
          - "Jen dvě kategorie: přírodní a syntetická (bez mezistupně)"
          - "Přírodní aroma musí být výslovně označeno slovem „přírodní“"
          - "Aromata smějí obsahovat i biopotraviny (podle EU jen přírodní)"
        modelAnswer: >-
          Aromata nepatří mezi éčka, mají vlastní legislativu a podle skript jsou buď přírodní,
          nebo syntetická. Přírodní aroma musí být označeno slovem „přírodní“, takže samotné „aroma“
          podle skript znamená syntetické. Aromata mohou obsahovat i biopotraviny, a to jen přírodní.

  - id: pot.aditiva-e-cislovani
    title: Co znamená „E“ a proč se aditiva číslují
    kind: fact
    tier: A
    status: course-disputed
    note: >-
      Skripta tvrdí, že značení E platí pro celý svět. Mezinárodně se používají stejná čísla
      (systém INS Codexu Alimentarius), předpona E je ale evropská. U zkoušky stačí: E = Evropa.
    criteria: [9c, 4b]
    source: { pages: [107], anchor: "Zvolení písmene E symbolizuje Evropu a nikoliv emulgátory" }
    explanation: >-
      Číselné kódy vznikly, protože při převozu potravin do jiných zemí nebylo kvůli jazyku jasné,
      jaké látky byly použity. Písmeno E znamená Evropa (ne „emulgátory“); stejná čísla se
      používají i mezinárodně. Na etiketě smí být aditivum uvedeno E-kódem, nebo názvem – E-kód o původu látky
      (přírodní/syntetická) nic neříká.
    exercises:
      - id: pismeno
        type: choice
        prompt: "Co znamená písmeno E u přídatných látek?"
        options:
          - text: "Evropa"
            correct: true
          - text: "Emulgátor"
            why: "Častý omyl – emulgátory jsou jen jednou ze skupin."
          - text: "Esenciální"
            why: "Aditiva nejsou esenciální živiny."
          - text: "Extrakt"
            why: "E znamená Evropa."
      - id: proc
        type: choice
        prompt: "Proč vznikl systém číselného označování aditiv?"
        options:
          - text: "Aby bylo i v cizím jazyce jasné, jaká látka byla použita"
            correct: true
          - text: "Aby šlo odlišit přírodní a syntetické látky"
            why: "E-kód o původu látky nic neříká."
          - text: "Aby se aditiva na obalu dala méně nápadně uvést"
            why: "Důvodem byla srozumitelnost při mezinárodním obchodu."
          - text: "Kvůli výpočtu energetické hodnoty"
            why: "S energetickou hodnotou kódy nesouvisejí."
      - id: vyklad
        type: explain
        prompt: "Klientka tvrdí, že „E“ znamená emulgátor a že každé éčko je umělá chemie. Uveď to na pravou míru."
        keyPoints:
          - "E = Evropa, ne emulgátor"
          - "Číslování kvůli srozumitelnosti v mezinárodním obchodě"
          - "Aditivum může být uvedeno kódem nebo názvem (vždy s funkcí)"
          - "E mohou být přírodní (pektin), přírodně identická (kys. askorbová) i syntetická"
        modelAnswer: >-
          Písmeno E znamená Evropa. Číselné kódy vznikly, aby bylo při mezinárodním obchodu jasné,
          jaká látka byla použita, bez ohledu na jazyk. Na obalu může být kód i název, vždy s funkcí.
          Éčko nemusí být „chemie“ – existují přírodní látky jako pektin, přírodně identické jako
          kyselina askorbová i syntetické jako cyklamáty.

  # ---------- 4c Značení a etikety ----------

  - id: pot.vyzivove-udaje
    title: Povinné výživové údaje
    kind: fact
    tier: A
    criteria: [4c, 9a]
