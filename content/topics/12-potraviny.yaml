  - id: pot.slozeni-poradi
    title: Pořadí složek ve složení
    kind: procedure
    tier: A
    status: course-disputed
    note: >-
      Hranici pro uvádění alkoholu uvádí s. 109 jako 1,2 %, s. 108 jako 2 %. Správně je 1,2 % obj.
      (nařízení EU č. 1169/2011) – u nápojů se uvádí skutečný obsah alkoholu, ne ve výčtu složek.
    criteria: [4c, 9a]
    source: { pages: [109], anchor: "řazeny sestupně podle jejich použitého množství" }
    explanation: >-
      Ve složení jsou suroviny seřazeny sestupně podle použitého množství – první je té nejvíce.
      Složky pod 2 % mohou být v libovolném pořadí a u směsí (např. koření) se pod 2 % nemusejí
      rozepisovat. Ve složení se dále uvádějí aditiva s funkcí, původ aromat, zvýrazněné alergeny,
      a GMO nad 0,9 %; u nápojů nad 1,2 % alkoholu se uvádí jeho obsah.
    exercises:
      - id: musli
        type: choice
        prompt: "Složení müsli: ovesné vločky, cukr, rozinky (8 %), lískové ořechy (3 %)… Co z toho plyne?"
        options:
          - text: "Cukru je ve výrobku víc než rozinek"
            correct: true
          - text: "Ovesných vloček je méně než cukru"
            why: "Vločky jsou první, je jich nejvíce."
          - text: "Cukru je méně než 8 %"
            why: "Cukr je před rozinkami (8 %), takže ho je víc."
          - text: "Pořadí o množství nic neříká"
            why: "Složky se řadí sestupně podle množství."
      - id: hranice
        type: choice
        prompt: "U složek pod jakým podílem nezáleží na pořadí?"
        options:
          - text: "Pod 2 %"
            correct: true
          - text: "Pod 5 %"
            why: "5 % je hranice pro uvádění přidané vody."
          - text: "Pod 0,9 %"
            why: "0,9 % je hranice pro označení GMO."
          - text: "Pod 10 %"
            why: "Taková hranice pro pořadí neplatí."
      - id: vyklad
        type: explain
        prompt: "Jak bys klientce vysvětlila, co jí řekne pořadí složek na obalu?"
        keyPoints:
          - "Složky jsou seřazené sestupně podle množství"
          - "Co je na prvním místě, toho je nejvíc"
          - "Pod 2 % na pořadí nezáleží"
          - "Podle pořadí odhadne např. podíl cukru"
        modelAnswer: >-
          Složky jsou seřazené od té, které je ve výrobku nejvíc, po tu, které je nejméně. Když je
          cukr na druhém místě, je ho ve výrobku hodně. Jen u složek pod 2 % na pořadí nezáleží.

  - id: pot.alergeny
    title: Značení alergenů
    kind: procedure
    tier: A
    status: course-disputed
    note: >-
      Skripta připouštějí i výpis alergenů pod složením a „může obsahovat…“ popisují jako povinné.
      Podle nařízení (EU) č. 1169/2011 musí být alergeny zvýrazněny přímo v seznamu složek
      (samostatný výpis pod složením nestačí) a „může obsahovat…“ je dobrovolné preventivní
      upozornění. U zkoušky uveď hlavně zvýraznění ve složení.
    criteria: [4c, 9a]
    source: { pages: [109], anchor: "Informace o alergenech musí být uvedena buď vytučněně v textu složení" }
    explanation: >-
      Alergeny musí být ve složení zvýrazněny – typicky tučně přímo v textu složení (např.
      „kroupy“); skripta připouštějí i výpis pod složením jako skupinu alergenů (např. „obiloviny
      obsahující lepek“). Riziko stopového množství se uvádí upozorněním „může obsahovat…“. Jako alergeny se
      značí i některá aditiva: oxid siřičitý a siřičitany a sójový lecitin.
    exercises:
      - id: jak
        type: choice
        version: 2
        prompt: "Jak musí být alergeny uvedeny na balené potravině?"
        options:
          - text: "Zvýrazněně přímo v seznamu složek (např. tučně)"
            correct: true
          - text: "Jen symbolem na přední straně obalu"
            why: "Alergeny se zvýrazňují přímo ve složení."
          - text: "Stačí je uvést na webu výrobce"
            why: "Musí být přímo na obalu."
          - text: "Uvádějí se jen u potravin určených alergikům"
            why: "Povinnost platí pro všechny balené potraviny."
      - id: stopy
        type: reveal
        prompt: "Co znamená na obalu „může obsahovat…“?"
        answer: >-
          Upozornění na riziko alergenu ve stopovém množství (např. kontaminace ve výrobě), i když
          ho složení přímo neobsahuje.
      - id: vyklad
        type: explain
        version: 2
        prompt: "Klientka s celiakií se ptá, jak na etiketě pozná lepek. Co jí poradíš?"
        keyPoints:
          - "Alergeny jsou ve složení zvýrazněné (tučně), skripta uvádějí i výpis pod složením"
          - "„Může obsahovat…“ = riziko stopového množství"
          - "Lepek: pšenice (i špalda), žito, ječmen, oves"
          - "Logo „bez lepku“ je regulované"
        modelAnswer: >-
          Alergeny musí být ve složení zvýrazněné, nejčastěji tučně; skripta zmiňují i výpis pod
          složením jako „obiloviny obsahující lepek“. Pozor i na upozornění „může obsahovat“, které
          znamená riziko stop. Lepek obsahuje pšenice včetně špaldy, žito, ječmen a oves. Spolehlivé je také
          regulované logo „bez lepku“.

  - id: pot.alergeny-14
    title: Seznam 14 povinně značených alergenů
    kind: fact
    tier: B
    status: supplementary
    note: >-
      Skripta seznam alergenů neuvádějí (zmiňují jen princip zvýraznění a příklady: obiloviny
      s lepkem, siřičitany, sója). Doplněno podle nařízení (EU) č. 1169/2011, příloha II.
    criteria: [4c, 9a]
    prereqs: [pot.alergeny]
    source: { pages: [109], anchor: "V případě alergenů ve stopovém množství musí být toto riziko rovněž uvedeno" }
    explanation: >-
      Legislativa EU určuje 14 skupin alergenů, které se na obalu musí zvýraznit: obiloviny
      obsahující lepek, korýši, vejce, ryby, arašídy (podzemnice olejná), sója, mléko (včetně
      laktózy), skořápkové plody (ořechy), celer, hořčice, sezam, oxid siřičitý a siřičitany, vlčí
      bob (lupina) a měkkýši.
    exercises:
      - id: ktere
        type: choice
        multiple: true
        prompt: "Které z těchto patří mezi 14 povinně značených alergenů?"
        options:
          - text: "Celer"
            correct: true
          - text: "Hořčice"
            correct: true
          - text: "Vlčí bob"
            correct: true
          - text: "Rajčata"
            why: "Rajčata mezi 14 alergenů nepatří."
          - text: "Kakao"
            why: "Kakao mezi 14 alergenů nepatří."
          - text: "Jahody"
            why: "Jahody mezi 14 alergenů nepatří."
      - id: vyjmenuj
        type: reveal
        prompt: "Vyjmenuj alespoň 10 ze 14 povinně značených alergenů."
        answer: >-
          Obiloviny s lepkem, korýši, vejce, ryby, arašídy, sója, mléko, skořápkové plody, celer,
          hořčice, sezam, oxid siřičitý a siřičitany, vlčí bob, měkkýši.

  - id: pot.tvrzeni-cukry
    title: „Bez cukrů“ vs. „bez přídavku cukrů“
    kind: comparison
    tier: A
    status: course-disputed
    note: >-
      Skripta popisují „bez cukrů“ jako potravinu zcela bez mono- a disacharidů. Podle nařízení
      (ES) č. 1924/2006 smí taková potravina obsahovat nejvýše 0,5 g cukrů na 100 g (100 ml). Pro
      zkoušku je podstatné: bez cukrů ≠ bez přídavku cukrů.
    criteria: [4c]
    confusableWith: [pot.tvrzeni-limity]
    source: { pages: [110], anchor: "Potravina BEZ PŘÍDAVKU CUKRŮ může obsahovat přirozeně se vyskytující cukry" }
    explanation: >-
      Výživová tvrzení jsou dobrovolná, ale mají legislativně přesné znění i podmínky. „Neslazeno“
      není výživové tvrzení. „Bez cukrů“ = potravina bez monosacharidů a disacharidů; sladkost mohou
      dodat sladidla. „Bez přídavku cukrů“ = cukry nebyly přidány, ale potravina může obsahovat cukry
      přirozeně přítomné (např. z ovoce). Totéž platí pro sůl.
    exercises:
      - id: dzus
        type: choice
        version: 2
        prompt: "Ovocná přesnídávka nese tvrzení „bez přídavku cukrů“. Co z toho plyne?"
        options:
          - text: "Může obsahovat cukry přirozeně přítomné v ovoci"
            correct: true
          - text: "Neobsahuje žádné mono- ani disacharidy"
            why: "To by odpovídalo tvrzení „bez cukrů“."
          - text: "Je určitě slazený sladidly"
            why: "Tvrzení o sladidlech nic neříká."
          - text: "Nejde o výživové tvrzení"
            why: "Výživovým tvrzením není „neslazeno“, „bez přídavku cukrů“ ano."
      - id: neni-tvrzeni
        type: choice
        prompt: "Které z těchto označení podle skript NENÍ výživovým tvrzením?"
        options:
          - text: "Neslazeno"
            correct: true
          - text: "Bez cukrů"
            why: "Je to výživové tvrzení."
          - text: "Bez přídavku cukrů"
            why: "Je to výživové tvrzení."
          - text: "Se sníženým obsahem cukrů"
            why: "Je to výživové tvrzení."

  - id: pot.tvrzeni-limity
    title: Podmínky výživových tvrzení
    kind: fact
    tier: A
    criteria: [4c]
    confusableWith: [pot.tvrzeni-cukry]
    source: { pages: [110], anchor: "Vysoký zdroj vlákniny nebo bohatý na vlákninu jsou označení" }
    explanation: >-
      Zdroj vlákniny – alespoň 3 g na 100 g; vysoký obsah vlákniny – alespoň 6 g na 100 g. Zdroj
      bílkovin – alespoň 12 % energie z bílkovin; vysoký obsah bílkovin – alespoň 20 % energie.
      Zdroj vitaminu či minerální látky – alespoň 15 % referenční dávky. Snížený/zvýšený obsah –
      rozdíl alespoň 30 % oproti obdobnému výrobku; o absolutním množství to nic neříká.
    exercises:
      - id: vlaknina
        type: choice
        prompt: "Kolik vlákniny musí potravina obsahovat pro tvrzení „vysoký obsah vlákniny“?"
        options:
          - text: "Alespoň 6 g na 100 g"
            correct: true
          - text: "Alespoň 3 g na 100 g"
            why: "To stačí pro tvrzení „zdroj vlákniny“."
          - text: "Alespoň 12 g na 100 g"
            why: "Taková hranice se nepoužívá."
          - text: "O 30 % více než obdobný výrobek"
            why: "To je podmínka pro „zvýšený obsah“."
      - id: bilkoviny
        type: choice
        prompt: "Co podle skript znamená tvrzení „zdroj bílkovin“?"
        options:
          - text: "Bílkoviny dodávají alespoň 12 % energie"
            correct: true
          - text: "Bílkoviny dodávají alespoň 20 % energie"
            why: "To je podmínka pro „vysoký obsah bílkovin“."
          - text: "Alespoň 12 g bílkovin na 100 g"
            why: "Podmínka se vztahuje k podílu energie, ne ke gramům."
          - text: "Alespoň 15 % referenční dávky bílkovin"
            why: "15 % referenční dávky platí pro vitaminy a minerální látky."
      - id: snizeny
        type: choice
        prompt: "Sušenky nesou tvrzení „se sníženým obsahem tuku“. Co platí?"
        options:
          - text: "Mají aspoň o 30 % méně tuku než obdobný výrobek"
            correct: true
          - text: "Obsahují méně než 3 g tuku na 100 g"
            why: "Tvrzení je relativní, absolutní množství neurčuje."
          - text: "Jsou nízkoenergetické"
            why: "O energii tvrzení nic neříká."
          - text: "Mají aspoň o 10 % méně tuku než obdobný výrobek"
            why: "Rozdíl musí být alespoň 30 %."

  - id: pot.zdravotni-tvrzeni
    title: Podmínky zdravotních tvrzení
    kind: concept
    tier: B
    criteria: [4c, 8c]
    prereqs: [pot.tvrzeni-limity]
    source: { pages: [110], anchor: "Tvrzení, že EPA a DHA přispívají k normální činnosti srdce" }
    explanation: >-
      Zdravotní tvrzení jsou přesně daná legislativou. Smí se použít jen tehdy, když potravina
      obsahuje danou živinu v množství potřebném pro příslušné výživové tvrzení, a množství musí být
      uvedeno v tabulce výživových údajů (u živin s referenční hodnotou i jako % referenční dávky). Příklad: tvrzení o EPA a DHA
      a činnosti srdce smí nést jen „zdroj omega-3 MK“ a obal musí uvádět, že účinku se dosáhne
      při 250 mg EPA a DHA denně.
    exercises:
      - id: podminka
        type: choice
        prompt: "Za jaké podmínky smí potravina nést zdravotní tvrzení o určité živině?"
        options:
          - text: "Obsahuje jí aspoň tolik, kolik vyžaduje výživové tvrzení, a uvádí množství v tabulce"
            correct: true
          - text: "Stačí, když výrobce živinu přidá v jakémkoli množství"
            why: "Množství musí splnit podmínky výživového tvrzení."
          - text: "Zdravotní tvrzení si výrobce formuluje volně"
            why: "Znění i podmínky jsou dané legislativou."
          - text: "Stačí, když je výrobek v BIO kvalitě"
            why: "BIO s tvrzeními nesouvisí."
      - id: epa-dha
        type: reveal
        prompt: "Jaký denní příjem EPA a DHA musí obal uvádět u tvrzení o normální činnosti srdce?"
        answer: "250 mg EPA a DHA denně."

  - id: pot.logo-ceska-potravina
    title: Regulovaná loga a logo Česká potravina
    kind: fact
    tier: A
    criteria: [4c, 9d]
    confusableWith: [pot.farmarske-neregulovane]
    source: { pages: [110], anchor: "U vícesložkových potravin musí z ČR pocházet minimálně 75 % hmotnosti" }
    explanation: >-
      Některá loga reguluje stát a mají přesný význam (Česká potravina, regionální potraviny, bez
      lepku, bez laktózy, BIO). Logo Česká potravina: u jednosložkových potravin (nezpracované
      potraviny, mléko, vinařské produkty) musí vše pocházet z ČR; u vícesložkových musí z ČR
      pocházet alespoň 75 % hmotnosti všech složek (bez vody) a výroba musí proběhnout v ČR.
      Profesní loga (Klasa, České cechovní normy) garantují určitý stupeň kvality.
    exercises:
      - id: procenta
        type: choice
        prompt: "Kolik složek musí u vícesložkové potraviny s logem Česká potravina pocházet z ČR?"
        options:
          - text: "Alespoň 75 % hmotnosti složek (bez vody)"
            correct: true
          - text: "100 % složek"
            why: "To platí pro jednosložkové potraviny."
          - text: "Alespoň 50 % hmotnosti složek"
            why: "Hranice je vyšší – 75 %."
          - text: "Stačí, když je výrobek v ČR vyroben"
            why: "Výroba v ČR je nutná, ale nestačí – rozhoduje i původ složek."
      - id: regulovana
        type: choice
        multiple: true
        prompt: "Která označení jsou podle skript regulovaná státem a mají přesný význam?"
        options:
          - text: "Česká potravina"
            correct: true
          - text: "BIO (evropské logo)"
            correct: true
          - text: "Bez lepku"
            correct: true
          - text: "Farmářský"
            why: "Tento pojem legislativa nezná."
          - text: "Natural / organic bez certifikačního loga"
            why: "Taková označení nezaručují biopotravinu."
      - id: vyklad
        type: explain
        prompt: "Klientka chce nakupovat české potraviny. Vysvětli jí, co znamená logo Česká potravina."
        keyPoints:
          - "Logo je regulované státem"
          - "Jednosložkové: vše z ČR"
          - "Vícesložkové: alespoň 75 % hmotnosti složek (bez vody) z ČR"
          - "Výroba musí proběhnout v ČR"
          - "Jiná loga (Klasa, ČCN) jsou profesní – garantují kvalitu, ne původ"
        modelAnswer: >-
          Logo Česká potravina je regulované státem. U jednosložkových potravin musí vše pocházet
          z ČR, u vícesložkových alespoň 75 % hmotnosti složek bez vody, a výroba musí probíhat
          v ČR. Profesní loga jako Klasa nebo České cechovní normy garantují spíše určitou kvalitu.

  - id: pot.nutriscore
    title: Nutri-Score
    kind: concept
    tier: C
    criteria: [4c]
    source: { pages: [94, 95], anchor: "Základním principem je udělování kladných a záporných bodů" }
    explanation: >-
      Nutri-Score je zatím nepovinné hodnocení potravin. Záporné body dává za vysokou energii,
      nasycené MK, sůl a jednoduché cukry, kladné za vlákninu, ovoce, zeleninu, ořechy a luštěniny
      (vše na 100 g). Je nedokonalé: olej má kvůli tuku vždy horší skóre než třeba zmrzlina. Smysl má
      hlavně pro srovnání výrobků v rámci jedné kategorie.
    exercises:
      - id: k-cemu
        type: choice
        prompt: "K čemu je Nutri-Score podle skript vhodné?"
        options:
          - text: "Ke srovnání výrobků ve stejné kategorii"
            correct: true
          - text: "Ke srovnání olejů se sladkostmi"
            why: "Olej by vždy vyšel hůř kvůli tuku, což je zavádějící."
          - text: "Je to povinný údaj na všech potravinách"
            why: "Nutri-Score zatím povinné není."
          - text: "Jednoznačně určí, zda je potravina zdravá"
            why: "Skripta upozorňují na jeho nedokonalost."

  # ---------- 9a Značení včetně technologie zpracování ----------

  - id: pot.datum-spotreby-dmt
    title: „Spotřebujte do“ vs. „minimální trvanlivost“
    kind: comparison
    tier: A
    criteria: [9a, 4c, 9b]
    source: { pages: [96], anchor: "Po uplynutí tohoto data nesmí být výrobky nadále prodávány" }
    explanation: >-
      „Spotřebujte do“ (datum spotřeby) se uvádí u potravin mikrobiologicky snadno podléhajících
      zkáze; po jeho uplynutí se potravina nesmí prodávat ani nabízet zdarma. Datum minimální
      trvanlivosti je doba, po kterou si potravina při správném skladování drží své vlastnosti; po
      jejím uplynutí se smí prodávat dál, ale odděleně, se zřetelným upozorněním a za kvalitu ručí
      prodejce. DMT se nemusí uvádět např. u čerstvého ovoce, zeleniny, brambor, čerstvého pečiva,
      vín a lihovin.
    exercises:
      - id: spotrebujte
        type: choice
        prompt: "Jogurtu včera uplynulo datum „spotřebujte do“. Co platí pro obchod?"
        options:
          - text: "Nesmí ho prodávat ani nabízet zdarma"
            correct: true
          - text: "Smí ho prodávat odděleně a se zřetelným upozorněním"
            why: "To platí po uplynutí data minimální trvanlivosti."
          - text: "Smí ho prodávat, pokud za kvalitu ručí prodejce"
            why: "To platí jen po datu minimální trvanlivosti."
          - text: "Smí ho prodávat se slevou ještě tři dny"
            why: "Po datu spotřeby je prodej zakázán."
      - id: po-dmt
        type: choice
        multiple: true
        prompt: "Co platí pro prodej potraviny po datu minimální trvanlivosti?"
        options:
          - text: "Musí být nabízena odděleně"
            correct: true
          - text: "Tato skutečnost musí být zřetelně uvedena"
            correct: true
          - text: "Za kvalitu ručí prodejce"
            correct: true
          - text: "Za kvalitu dál ručí výrobce"
            why: "Po datu minimální trvanlivosti ručí prodejce."
          - text: "Prodej je zakázán"
            why: "Zakázán je prodej po datu „spotřebujte do“."
      - id: vyklad
        type: explain
        prompt: "Vysvětli klientce rozdíl mezi „spotřebujte do“ a „minimální trvanlivost do“."
        keyPoints:
          - "„Spotřebujte do“ – potraviny mikrobiologicky rychle podléhající zkáze"
          - "Po datu spotřeby se nesmí prodávat ani darovat"
          - "DMT – doba, po kterou potravina drží své vlastnosti při správném skladování"
          - "Po DMT lze prodávat odděleně, s upozorněním, za kvalitu ručí prodejce"
          - "Obojí platí jen při dodržení skladovacích podmínek"
        modelAnswer: >-
          „Spotřebujte do“ najdeš u potravin, které se rychle kazí; po tomto datu se nesmějí prodávat
          ani darovat a je lepší je nejíst. Minimální trvanlivost říká, do kdy si potravina při
          správném skladování zachová své vlastnosti; po ní se smí prodávat odděleně a s upozorněním
          a za kvalitu ručí prodejce. Obě data platí jen při dodržení skladovacích podmínek.

  - id: pot.etiketa-povinne
    title: Povinné údaje na obalu
    kind: concept
    tier: A
    note: >-
      Čisté množství a podmínky skladování skripta výslovně neuvádějí; povinné jsou podle nařízení
      (EU) č. 1169/2011. Zemi původu je třeba uvádět jen u některých potravin (např. maso, med,
      ovoce a zelenina) nebo tam, kde by její absence klamala.
    criteria: [9a, 4c]
    source: { pages: [95, 108], anchor: "Ten, kdo je uveden na obale potraviny jako PPP, ručí za potravinu" }
    explanation: >-
      Na balené potravině najdeš: zákonný název, složení se zvýrazněnými alergeny, množství hlavní
      složky v %, čisté množství, provozovatele potravinářského podniku (PPP – výrobce, dovozce či
      balírna; ručí za potravinu), datum spotřeby nebo minimální trvanlivosti, podmínky skladování,
      energetickou a výživovou hodnotu a u některých potravin zemi původu. Potraviny živočišného původu mají identifikační razítko. U některých se uvádí třída
      jakosti (vejce, ovoce, zelenina, brambory) nebo čerstvost (pečivo, mléko, vejce), u složitější
      přípravy návod.
    exercises:
      - id: rucitel
        type: choice
        prompt: "Kdo podle skript ručí za balenou potravinu?"
        options:
          - text: "PPP uvedený na obalu"
            correct: true
          - text: "Obchod, kde jsi ji koupila"
            why: "Prodejce ručí za kvalitu až po uplynutí data minimální trvanlivosti."
          - text: "SZPI, která ji kontroluje"
            why: "SZPI je dozorový orgán, za potravinu neručí."
          - text: "Vždy pěstitel nebo chovatel suroviny"
            why: "Ručí ten, kdo je uveden na obalu jako PPP."
      - id: jakost
        type: choice
        multiple: true
        prompt: "U kterých potravin se podle skript uvádí třída jakosti?"
        options:
          - text: "Vejce"
            correct: true
          - text: "Ovoce a zelenina"
            correct: true
          - text: "Brambory"
            correct: true
          - text: "Pečivo"
            why: "U pečiva se uvádí čerstvost (čerstvé, dopékané, rozmrazené)."
          - text: "Mléko"
            why: "U mléka se uvádí údaj o čerstvosti."
      - id: vyklad
        type: explain
        version: 2
        prompt: "Popiš, jaké povinné informace najdeš na obalu balené potraviny."
        keyPoints:
          - "Název, složení se zvýrazněnými alergeny, množství hlavní složky, čisté množství"
          - "PPP (výrobce/dovozce/balírna) – ručí za potravinu"
          - "Datum spotřeby / minimální trvanlivosti, podmínky skladování, u některých země původu"
          - "Energetická a výživová hodnota na 100 g / 100 ml"
          - "Živočišné potraviny: razítko; u některých třída jakosti, čerstvost, návod"
        modelAnswer: >-
          Na obalu musí být název potraviny a složení se zvýrazněnými alergeny, množství hlavní
          složky a čisté množství, údaje o provozovateli potravinářského podniku, který za potravinu
          ručí, datum spotřeby nebo minimální trvanlivosti, podmínky skladování a u některých
          potravin země původu. Dále energetická a výživová hodnota na 100 g.
          Potraviny živočišného původu mají razítko, u vajec, ovoce, zeleniny a brambor se uvádí
          třída jakosti a u složitější přípravy návod.

  - id: pot.vejce-kod
    title: Kód na vejcích
    kind: fact
    tier: A
    criteria: [9a, 4c]
    source: { pages: [114], anchor: "Číslo 0 označuje chov v podmínkách odpovídající BIO kvalitě" }
    explanation: >-
      Kód na vejci začíná číslicí způsobu chovu: 0 – BIO (ekologický chov), 1 – volný výběh,
      2 – halový chov (na podestýlce), 3 – klecový chov. Následuje kód státu (např. CZ)
      a čtyřmístné registrační číslo hospodářství. Velikost se značí písmeny: S do 53 g,
      M 53–63 g, L 63–73 g, XL nad 73 g. Vejce se dělí do dvou tříd: první pro spotřebitele, druhá pro
      průmysl.
    exercises:
      - id: kod-3
        type: choice
        prompt: "Vejce má kód 3CZ1234. Z jakého chovu pochází?"
        options:
          - text: "Z klecového chovu"
            correct: true
          - text: "Z volného výběhu"
            why: "Volný výběh má číslici 1."
          - text: "Z halového chovu"
            why: "Halový chov (na podestýlce) má číslici 2."
          - text: "Z ekologického (BIO) chovu"
            why: "BIO chov má číslici 0."
      - id: velikost
        type: choice
        prompt: "Jakou hmotnost má podle skript vejce velikosti M?"
        options:
          - text: "53–63 g"
            correct: true
          - text: "Do 53 g"
            why: "To je velikost S."
          - text: "63–73 g"
            why: "To je velikost L."
          - text: "Nad 73 g"
            why: "To je velikost XL."
      - id: vyklad
        type: explain
        prompt: "Klientka se ptá, jak z kódu na vejci pozná, odkud je a jak byla slepice chovaná."
        keyPoints:
          - "První číslice = způsob chovu: 0 BIO, 1 volný výběh, 2 hala, 3 klec"
          - "Pak kód země (CZ)"
          - "Pak registrační číslo hospodářství (dohledatelné)"
          - "Velikost S, M, L, XL podle hmotnosti"
        modelAnswer: >-
          První číslice říká způsob chovu: nula je BIO chov, jednička volný výběh, dvojka halový
          chov na podestýlce a trojka klecový chov. Za ní je kód země, třeba CZ, a registrační číslo
          hospodářství, které se dá dohledat. Velikost se značí S, M, L a XL podle hmotnosti.

  - id: pot.mleko-osetreni
    title: Čerstvé, trvanlivé a „automatové“ mléko
    kind: comparison
    tier: A
    criteria: [9a, 4a, 9b]
    prereqs: [pot.tepelne-osetreni]
    confusableWith: [pot.tepelne-osetreni]
    status: course-disputed
    note: >-
      Skripta píší, že čerstvé (pasterované) mléko může obsahovat prospěšné bakterie mléčného
      kvašení. Pasterace ale většinu těchto bakterií zničí, takže pasterované mléko jejich
      významným zdrojem není. Výdrž „asi 3 dny“ je údaj skript; skutečnou trvanlivost určuje
      datum na obalu.
    source: { pages: [113], anchor: "Mléko čerstvé je takové, které bylo ošetřeno pasterací" }
    explanation: >-
      Mléko prodávané v obchodě musí být tepelně ošetřené. Čerstvé mléko je pasterované a podle
      skript vydrží asi 3 dny. Mléko s prodlouženou trvanlivostí je
      ošetřené vyšší teplotou než při pasteraci, ale nižší než UHT. Trvanlivé UHT mléko vydrží
      3–6 měsíců a je zcela bez mikroorganismů, i prospěšných. Mléko z mléčného automatu tepelně
      ošetřené není – doma se musí převařit.
    exercises:
      - id: prevarit
        type: choice
        prompt: "Které mléko je podle skript nutné doma převařit?"
        options:
          - text: "Mléko z mléčného automatu"
            correct: true
          - text: "Čerstvé pasterované mléko"
            why: "Je už tepelně ošetřené pasterací."
          - text: "Trvanlivé UHT mléko"
            why: "Je ošetřené vysokou teplotou a bez mikroorganismů."
          - text: "Mléko s prodlouženou trvanlivostí"
            why: "Je ošetřené teplotou vyšší než při pasteraci."
      - id: uht-vs-cerstve
        type: choice
        prompt: "Čím se liší trvanlivé UHT mléko od čerstvého pasterovaného?"
        options:
          - text: "Vydrží 3–6 měsíců a neobsahuje žádné mikroorganismy"
            correct: true
          - text: "Je ošetřené nižší teplotou než čerstvé"
            why: "UHT je naopak intenzivnější tepelné ošetření."
          - text: "Trvanlivost mu zajišťují konzervanty"
            why: "Trvanlivost zajišťuje tepelné ošetření."
          - text: "Obsahuje víc prospěšných bakterií"
            why: "UHT mléko je zcela bez mikroorganismů, tedy i bez prospěšných."
      - id: vyklad
        type: explain
        version: 2
        prompt: "Vysvětli klientce rozdíl mezi čerstvým, trvanlivým a „automatovým“ mlékem."
        keyPoints:
          - "Čerstvé: pasterované, vydrží asi 3 dny"
          - "Prodloužená trvanlivost: teplota mezi pasterací a UHT"
          - "UHT: 3–6 měsíců, bez mikroorganismů včetně prospěšných"
          - "Automat: tepelně neošetřené – převařit"
        modelAnswer: >-
          Čerstvé mléko je pasterované a vydrží asi tři dny. Mléko s prodlouženou trvanlivostí prošlo vyšší teplotou než pasterace,
          ale nižší než UHT. Trvanlivé UHT mléko vydrží 3–6 měsíců a nejsou v něm žádné
          mikroorganismy. Mléko z automatu tepelně ošetřené není, proto je nutné ho doma převařit.

  - id: pot.ryby-oznaceni
    title: Značení ryb – Seafrozen, Double Frozen, Land Frozen
    kind: comparison
    tier: B
    criteria: [9a, 4a]
    source: { pages: [112], anchor: "Double Frozen znamená, že ryby nebyly opracované" }
    explanation: >-
      U ryb se uvádí, zda jsou z chovu, nebo volně žijící (ovlivňuje složení), a u mořských ryb
      oblast lovu (FAO + číslo). Seafrozen = zpracovány a zmrazeny hned na lodi. Double Frozen = na
      lodi zmrazeny neopracované, na pevnině rozmraženy, opracovány a znovu zmrazeny; bývají
      glazované a pro spotřebitele jsou nejméně výhodné. Land Frozen = na lodi jen na ledu,
      opracovány a zmrazeny až na pevnině.
    exercises:
      - id: double
        type: choice
        prompt: "Co znamená označení Double Frozen?"
        options:
          - text: "Zmrazeny na lodi, na pevnině rozmraženy, opracovány a znovu zmrazeny"
            correct: true
          - text: "Opracovány a zmrazeny hned na lodi"
            why: "To je Seafrozen."
          - text: "Na lodi uloženy na led, zmrazeny až na pevnině"
            why: "To je Land Frozen."
          - text: "Zmrazeny dvakrát rychleji než běžně"
            why: "Jde o dvojí zmrazení s rozmrazením mezi tím."
      - id: udaje
        type: reveal
        prompt: "Které údaje o původu se uvádějí u ryb?"
        answer: >-
          Země výroby/původu (razítko), způsob produkce (chov, nebo volně žijící) a u mořských ryb
          oblast lovu (FAO + číslo).

  - id: pot.razitko-puvod-masa
    title: Razítko a původ masa
    kind: fact
    tier: B
    status: course-disputed
    note: >-
      Razítko u potravin živočišného původu je na s. 108 popsáno jako „kulaté“, na s. 112 jako
      „oválné“. Správně jde o oválnou identifikační značku. S. 108 navíc píše, že razítko uvádí
      zemi původu vstupní suroviny – ve skutečnosti obsahuje kód země, schvalovací číslo podniku
      a zkratku ES, původ suroviny z něj nevyčteš. Lhůta 24 hodin pro chlazené mleté maso je údaj
      skript; u baleného mletého masa platí datum spotřeby, které stanoví výrobce.
    criteria: [9a, 4c]
    source: { pages: [108, 111, 112], anchor: "musí být vepřové, skopové, kozí a drůbeží maso označeno zemí" }
    explanation: >-
      Potraviny živočišného původu (maso, ryby, mléčné výrobky…) nesou oválné razítko se zemí, kde
      byly zpracovány, a číslem podniku. Vepřové, skopové, kozí a drůbeží maso musí mít navíc „chov v“ (země chovu)
      a „porážka v“ (země porážky); jsou-li obě stejné, stačí „původ“. U mletého masa najdeš druhy
      masa, maximální obsah tuku a datum mletí; podle skript se chlazené mleté maso má spotřebovat
      do 24 hodin.
    exercises:
      - id: chov-porazka
        type: choice
        prompt: "Na vepřovém mase je „chov v: DE, porážka v: CZ“. Co to znamená?"
        options:
          - text: "Prase bylo chováno v Německu a poraženo v Česku"
            correct: true
          - text: "Maso bylo vyrobeno v Německu a zabaleno v Česku"
            why: "Údaje se týkají chovu a porážky."
          - text: "Prase bylo chováno v Česku a poraženo v Německu"
            why: "Pořadí je obráceně."
          - text: "Maso je české, protože bylo poraženo v ČR"
            why: "Údaj „původ“ lze použít jen tehdy, když jsou obě země stejné."
      - id: mlete
        type: choice
        prompt: "Do kdy se podle skript má spotřebovat chlazené mleté maso?"
        options:
          - text: "Do 24 hodin"
            correct: true
          - text: "Do 12 hodin"
            why: "Skripta uvádějí 24 hodin."
          - text: "Do 3 dnů"
            why: "Skripta uvádějí 24 hodin."
          - text: "Do 7 dnů"
            why: "Skripta uvádějí 24 hodin."

  - id: pot.nebalene
    title: Nebalené a v prodejně zabalené potraviny
    kind: fact
    tier: C
    criteria: [9a]
    source: { pages: [108, 116], anchor: "V těsné blízkosti takových potravin se musí nacházet štítek" }
    explanation: >-
      U nebalených potravin (ovoce, zelenina, pečivo) nedostaneš etiketu, ale v jejich těsné blízkosti
      musí být štítek s názvem potraviny, údaji o PPP, množstvím hlavní složky, třídou jakosti
      a zemí původu; k dispozici mají být i údaje o alergenech, trvanlivosti a složkách. U potravin
      zabalených přímo v prodejně máš nárok na stejné informace. U pečiva musí být uvedeno, zda je
      čerstvé, dopékané, nebo rozmrazené.
    exercises:
      - id: kde
        type: choice
        prompt: "Kde najdeš povinné informace u nebaleného pečiva?"
        options:
          - text: "Na štítku v těsné blízkosti potraviny"
            correct: true
          - text: "Nikde, u nebalených potravin nejsou povinné"
            why: "Informace musí být na štítku u potraviny."
          - text: "Jen na vyžádání u výrobce"
            why: "Štítek musí být přímo u potraviny."
          - text: "Na účtence"
            why: "Údaje musí být u potraviny ještě před nákupem."

  - id: pot.sunka-jakost
    title: Jakostní třídy šunky
    kind: fact
    tier: C
    criteria: [9a]
    source: { pages: [111], anchor: "s obsahem ČSB pod 10 % už nesmí být označovány jako šunka" }
    explanation: >-
      Šunka se třídí podle čistých svalových bílkovin (ČSB) a podílu masa: nejvyšší jakosti – min.
      16 % ČSB a 90 % masa; výběrová – 13 % ČSB a 80 % masa; standardní – 10 % ČSB a 60 % masa.
      Pod 10 % ČSB se výrobek nesmí jmenovat šunka a šunka nesmí obsahovat strojně oddělené maso.
    exercises:
      - id: nejvyssi
        type: choice
        prompt: "Kolik ČSB musí podle skript obsahovat šunka nejvyšší jakosti?"
        options:
          - text: "Alespoň 16 %"
            correct: true
          - text: "Alespoň 13 %"
            why: "To je výběrová šunka."
          - text: "Alespoň 10 %"
            why: "To je standardní šunka."
          - text: "Alespoň 20 %"
            why: "Skripta uvádějí 16 %."

  - id: pot.chranene-nazvy
    title: Chráněné názvy – mléko, jogurt, máslo, chléb
    kind: fact
    tier: C
    criteria: [9a, 9d]
    source: { pages: [113, 115, 116], anchor: "Tedy ani žádné rostlinné nápoje nemohou nést název mléko" }
    explanation: >-
      Název „mléko“ smí nést jen produkt mléčné žlázy savců – rostlinné nápoje ne (výjimkou je
      kokosové mléko). Bílý jogurt smí obsahovat jen mléko a prospěšné bakterie. Máslo musí mít
      80–90 % mléčného tuku a nesmí obsahovat žádná „E“. Celozrnný chléb musí obsahovat alespoň 80 %
      celozrnných mouk; „vícezrnný“ či „cereální“ takové požadavky nemá.
    exercises:
      - id: celozrnny
        type: choice
        prompt: "Co musí podle skript splňovat celozrnný chléb?"
        options:
          - text: "Alespoň 80 % celozrnných mouk"
            correct: true
          - text: "Alespoň 50 % celozrnných mouk"
            why: "Skripta uvádějí 80 %."
          - text: "Alespoň 5 % jiných obilovin než pšenice a ječmene"
            why: "To je požadavek na vícezrnný chléb."
          - text: "Alespoň 90 % jedné obiloviny"
            why: "To je požadavek na jednodruhový chléb."
      - id: mleko
        type: choice
        prompt: "Proč se ovesný nápoj nesmí prodávat jako „ovesné mléko“?"
        options:
          - text: "Název mléko patří jen produktu mléčné žlázy savců"
            correct: true
          - text: "Protože obsahuje málo vápníku"
            why: "To je nutriční problém, ne důvod zákazu názvu."
          - text: "Protože obsahuje lepek"
            why: "Důvodem je ochrana názvu mléko."
          - text: "Protože není tepelně ošetřený"
            why: "Důvodem je ochrana názvu mléko."

