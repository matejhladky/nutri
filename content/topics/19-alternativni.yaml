topic:
  id: alternativni
  title: Alternativní směry ve výživě
  chapter: 19
  pages: [190, 203]
  order: 190
  summary: >-
    Vegetariánství, flexitariánství, veganství, makrobiotika, nízkosacharidová a ketogenní strava, paleo,
    carnivore, RAW, další diety, přerušovaný půst, intuitivní stravování, IIFYM a Modré zóny – principy,
    výhody, rizika a kompenzace rizikových živin.

points:
  - id: alt.vegetarianstvi
    title: Vegetariánství – typy, rizika a výhody
    kind: concept
    tier: A
    criteria: [6a]
    confusableWith: [alt.flexitarianstvi, alt.veganstvi-rizika]
    source: { pages: [190, 132], anchor: "Nejrozšířenější vegetariánskou skupinu nazýváme ovo-laktovegetariánství" }
    explanation: >-
      Vegetariáni nejedí potraviny z mrtvých zvířat, ale jedí vejce, mléko a med. Nejrozšířenější jsou ovo-laktovegetariáni (mléko i vejce), méně laktovegetariáni (jen
      mléčné výrobky); někteří jedí ryby či drůbež, ale ne maso savců. Rizikové živiny: omega-3,
      železo, zinek, vitamin D, B12 – při konzumaci vajec a mléka je riziko nízké (kromě těhotných),
      doplněk B12 bývá i tak vhodný. Výhody: dost vlákniny; bez UZPP a při vhodném energetickém
      nastavení může (jako jiné směry) snížit riziko srdečně-cévních nemocí a pomoci s hmotností.
    exercises:
      - id: hodnoceni
        type: explain
        prompt: "Popiš vegetariánství – jaké má typy, výhody a na které živiny si dát pozor."
        keyPoints:
          - "Nejí maso zabitých zvířat, ale jí vejce, mléko, med"
          - "Ovo-lakto (nejčastější), lakto; někteří i ryby/drůbež"
          - "Rizikové živiny: omega-3, Fe, Zn, vitamin D, B12"
          - "S vejci a mlékem nízké riziko, výjimka těhotné"
          - "Výhody: vláknina; bez UZPP a při vhodné energii může snížit riziko KVO a pomoci s hmotností"
        modelAnswer: >-
          Vegetariáni nejedí maso zabitých zvířat, ale mohou jíst vejce, mléko a med. Nejčastější je
          ovo-laktovegetariánství, méně časté laktovegetariánství, někteří jedí i ryby nebo drůbež.
          Rizikem je nedostatek omega-3 mastných kyselin, železa, zinku, vitaminu D a B12; pokud ale
          jedí vejce a mléčné výrobky, je riziko nízké, s výjimkou těhotných. Strava bývá bohatá na
          vlákninu, a pokud není postavená na ultrazpracovaných potravinách a má přiměřenou energii,
          může snížit riziko srdečně-cévních onemocnění a pomoci s hmotností.
      - id: lakto
        type: choice
        prompt: "Klientka jí mléčné výrobky, ale ne maso, ryby ani vejce. Jak se tento směr nazývá?"
        options:
          - { text: "Laktovegetariánství", correct: true }
          - { text: "Ovo-laktovegetariánství", why: "Ovo-laktovegetariáni jedí i vejce." }
          - { text: "Veganství", why: "Vegani nejedí žádné živočišné produkty, ani mléko." }
          - { text: "Flexitariánství", why: "Flexitariáni občas jedí i maso." }
      - id: rizikove
        type: choice
        multiple: true
        prompt: "Které živiny skripta uvádějí jako rizikové u vegetariánů?"
        options:
          - { text: "Vitamin B12", correct: true }
          - { text: "Železo", correct: true }
          - { text: "Omega-3 mastné kyseliny", correct: true }
          - { text: "Vláknina", why: "Vlákniny mívají vegetariáni naopak dostatek." }
          - { text: "Vitamin C", why: "Vitamin C je v rostlinné stravě hojně." }

  - id: alt.flexitarianstvi
    title: Flexitariánství
    kind: concept
    tier: B
    criteria: [6a]
    confusableWith: [alt.vegetarianstvi]
    source: { pages: [190, 191], anchor: "převážně rostlinný způsob stravování, který povoluje občasnou konzumaci masa" }
    explanation: >-
      Flexitariánství („flexibilní vegetariánství“) je převážně rostlinná strava, která občas povoluje
      maso a ryby – kompromis mezi vegetariánstvím a běžnou stravou. Živočišné produkty jí méně a
      kvalitně (bio, lokální, ne z velkochovů), důraz na udržitelnost a etiku. Výhody: víc vlákniny a
      větší nutriční flexibilita, tedy nižší riziko nedostatku B12, železa a zinku než u vegetariánů
      a veganů.
    exercises:
      - id: definice
        type: choice
        prompt: "Co je flexitariánství?"
        options:
          - { text: "Převážně rostlinná strava, občas maso a ryby", correct: true }
          - { text: "Strava bez masa savců, ale s rybami a drůbeží", why: "To je jedna z forem vegetariánství, maso savců vylučuje." }
          - { text: "Pravidelné střídání dnů s masem a dnů půstu", why: "To je spíš forma půstu, ne flexitariánství." }
          - { text: "Strava založená jen na syrových rostlinných potravinách", why: "To je RAW strava." }
      - id: vyhoda
        type: reveal
        prompt: "Jakou výhodu má flexitariánství oproti vegetariánství a veganství?"
        answer: "Větší nutriční flexibilitu – nižší riziko nedostatku B12, železa, zinku apod.; zároveň víc vlákniny než běžná strava."

  - id: alt.veganstvi-rizika
    title: Veganství – rizika a rizikové skupiny
    kind: concept
    tier: A
    status: course-disputed
    note: >-
      **Skripta:** veganství se nedoporučuje v těhotenství a je nevhodné pro děti (s. 191); tabulka na
      s. 192 ukazuje rozdílné postoje (ČPS 2016 a SpV 2023 ne pro děti a těhotné; AND 2025 „dobře
      naplánovaná je adekvátní“; DGE 2024 zmírnila) a kap. o dětech cituje ESPGHAN 2025 – jen za
      přísných podmínek (s. 222). **Současné poznatky / předpisy:** ESPGHAN (Verduci et al., JPGN 2025)
      – důkazy o dostatečném růstu veganských dětí jsou nejednoznačné; nutné pravidelné sledování
      růstu a stavu výživy, vedení dětským nutričním terapeutem a suplementace mikroživin (B12,
      vitamin D aj.). DGE (2024) u dětí, těhotných a kojících nedává doporučení pro ani proti, zdůrazňuje
      odborné vedení a B12. Postoj AND z roku 2025 se týká jen dospělých mimo těhotenství a kojení
      (pro všechna životní období mluvil starší postoj AND z roku 2016). **Ke zkoušce:** platí podle
      obou – u dětí, kojenců a těhotných se veganství paušálně nedoporučuje; pokud ho rodina dodržuje,
      jen pod lékařským a nutričním dohledem s povinnou B12; poradce dětského vegana sám nevede.
      Rostlinné nápoje nikdy nenahrazují mateřské mléko ani kojeneckou výživu.
    criteria: [6a]
    confusableWith: [alt.vegetarianstvi, obd.veganstvi-deti]
    source: { pages: [191, 192], anchor: "Veganství se nedoporučuje v těhotenství" }
    explanation: >-
      Veganství je nejpřísnější forma vegetariánství – žádné živočišné produkty. Rizikové živiny:
      omega-3, železo, vápník, zinek, vitamin D, B12. Výhody: úprava hmotnosti (díky deficitu),
      šetrnost ke zvířatům. Skripta ho nedoporučují v těhotenství (málo železa) a u dětí (málo vápníku
      a vitaminu D → rachitida); nejrizikovější jsou kojenci na rostlinném (mandlovém) mléce. Novější
      stanoviska (ESPGHAN, DGE) ho u dětí a těhotných připouštějí jen pod odborným dohledem s povinnou
      B12. Dospělý musí jídelníček pečlivě sestavit a suplementovat.
    exercises:
      - id: hodnoceni
        type: explain
        version: 2
        prompt: "Klientka se chce stát vegankou. Jaké výhody a rizika jí vysvětlíš a pro koho veganství není vhodné?"
        keyPoints:
          - "Žádné živočišné produkty – nejpřísnější forma vegetariánství"
          - "Rizikové živiny: B12, Fe, Ca, Zn, vitamin D, omega-3"
          - "Výhody: úprava hmotnosti, šetrnost ke zvířatům"
          - "Děti, kojenci, těhotné: paušálně se nedoporučuje; jen pod lékařským a nutričním dohledem s B12"
          - "Dospělí: pečlivý jídelníček + suplementace, ideálně s odborným vedením"
        modelAnswer: >-
          Veganství vylučuje všechny živočišné produkty. Může pomoci s úpravou hmotnosti a je šetrné ke
          zvířatům, ale hrozí nedostatek B12, železa, vápníku, zinku, vitaminu D a omega-3. Podle skript
          se nedoporučuje v těhotenství a není vhodné pro děti – hrozí třeba rachitida, u kojenců na
          rostlinném mléce i nedostatek esenciálních aminokyselin. Novější stanoviska (ESPGHAN, DGE) ho
          u dětí a těhotných připouštějí jen pod odborným dohledem a s povinnou B12, takže takovou
          klientku pošlu k lékaři a nutričnímu terapeutovi. Dospělá veganka musí jídelníček sestavit
          velmi pečlivě a suplementovat.
      - id: deti
        type: choice
        prompt: "Proč skripta považují veganství za nevhodné pro děti?"
        options:
          - { text: "Je chudá na vápník a vitamin D – hrozí rachitida.", correct: true }
          - { text: "Obsahuje příliš mnoho bílkovin, které zatěžují ledviny.", why: "Problémem je spíš nedostatek, ne nadbytek." }
          - { text: "Obsahuje málo vlákniny, takže děti trpí zácpou.", why: "Vlákniny je ve veganské stravě naopak hodně." }
          - { text: "Vede k hromadění nadbytku vitaminu C v těle.", why: "Vitamin C se nehromadí a riziko ve skriptech je opačné – nedostatek vápníku a vitaminu D." }
      - id: kojenci
        type: choice
        prompt: "U koho skripta uvádějí obzvlášť velká rizika veganské výživy?"
        options:
          - { text: "U kojenců živených rostlinným (např. mandlovým) mlékem", correct: true }
          - { text: "U zdravých dospělých mužů se sedavým zaměstnáním", why: "Dospělý může veganství zvládnout při pečlivém plánování a suplementaci." }
          - { text: "U vrcholových sportovců v přípravném období", why: "Skripta zvlášť zdůrazňují kojence na rostlinném mléce." }
          - { text: "U dospělých s nadváhou, kteří chtějí zhubnout", why: "U nich skripta uvádějí spíš výhodu – úpravu hmotnosti." }

  - id: alt.veganstvi-kompenzace
    title: Veganství – kompenzace rizikových živin
    kind: procedure
    tier: A
    criteria: [6a]
    prereqs: [alt.veganstvi-rizika, vit.b12, min.zelezo-formy, min.jod]
    source: { pages: [191, 192, 135], anchor: "U rostlinných produktů je absolutní absence vitaminu B12" }
    explanation: >-
      B12: v rostlinách chybí úplně → suplementace je nutná. Železo: hlavní zdroje jsou maso a játra;
      rostlinné zdroje (ovesné vločky, celozrnný chléb, ořechy) ho mají, ale vstřebává se mnohem hůř.
      Zinek: hlavně z masa; v celozrnných výrobcích je ho dost, ale fytin snižuje využitelnost.
      Omega-3: chybí EPA i DHA, přeměna z ALA je velmi malá → doplněk z mořských řas. Jód: vegani
      jsou rizikoví (bez ryb a mléka) → jodizovaná sůl. Hlídat i vápník a vitamin D.
    exercises:
      - id: kompenzace
        type: explain
        prompt: "Jak by měla veganka kompenzovat rizikové živiny?"
        keyPoints:
          - "B12 v rostlinách chybí → povinná suplementace"
          - "Železo z rostlin se vstřebává mnohem hůř"
          - "Zinek: fytin v celozrnných výrobcích snižuje využitelnost"
          - "Omega-3: chybí EPA/DHA, přeměna z ALA malá → doplněk z mořských řas"
          - "Jód (jodizovaná sůl), vápník a vitamin D hlídat"
        modelAnswer: >-
          Vitamin B12 se v rostlinných potravinách vůbec nevyskytuje, takže ho musí suplementovat.
          Železo sice obsahují třeba ovesné vločky nebo ořechy, ale vstřebává se z nich mnohem hůř než
          z masa. Zinek je v celozrnných výrobcích, ale fytin jeho využitelnost výrazně snižuje.
          Omega-3 EPA a DHA ve veganské stravě chybí a přeměna z kyseliny alfa-linolenové je malá,
          proto doporučím doplněk z mořských řas. Pohlídat musí i jód (jodizovaná sůl), vápník a
          vitamin D.
      - id: omega3
        type: choice
        prompt: "Jaký doplněk omega-3 mastných kyselin skripta doporučují veganům?"
        options:
          - { text: "Doplněk z mořských řas", correct: true }
          - { text: "Rybí olej", why: "Rybí olej není veganský." }
          - { text: "Lněný olej jako jediný zdroj – přemění se na EPA a DHA dostatečně", why: "Přeměna ALA na EPA a DHA je velmi malá." }
          - { text: "Veganům omega-3 nehrozí", why: "Omega-3 patří mezi rizikové živiny veganů." }
      - id: zinek
        type: choice
        prompt: "Proč celozrnné výrobky nejsou pro vegany spolehlivým zdrojem zinku?"
        options:
          - { text: "Fytin v nich snižuje využitelnost zinku.", correct: true }
          - { text: "Zinek v nich prakticky vůbec není, je jen v mase.", why: "Zinku obsahují poměrně dost, problém je využitelnost." }
          - { text: "Zinek se z nich ztrácí při pečení a vaření.", why: "Skripta jako důvod uvádějí fytin, ne tepelnou úpravu." }
          - { text: "Vláknina v nich zinek váže a vylučuje močí.", why: "Problémem je fytin, ne vylučování močí." }
      - id: b12
        type: reveal
        prompt: "Proč je u veganství nutná suplementace vitaminu B12?"
        answer: "Rostlinné potraviny vitamin B12 vůbec neobsahují – přirozeně je jen v živočišných zdrojích (játra, ryby, maso)."

  - id: alt.rostlinne-bilkoviny
    title: Kvalita bílkovin v rostlinné stravě
    kind: concept
    tier: B
    criteria: [6a, 1d]
    prereqs: [alt.veganstvi-kompenzace, bil.limitujici-ak, bil.vyuzitelnost]
    source: { pages: [39, 41, 192], anchor: "u luštěnin methionin nebo cystein" }
    explanation: >-
      Rostlinné bílkoviny mají obvykle limitující aminokyselinu (obiloviny lysin, luštěniny methionin
      či cystein), proto jsou „neplnohodnotné“ a tělo je využije jen z 55–60 %. Kombinací obilovin
      a luštěnin se využitelnost zvýší až na 80 %. Vegan by měl preferovat nezpracované zdroje –
      luštěniny, tofu, tempeh – před masovými analogy.
    exercises:
      - id: kombinace
        type: choice
        prompt: "Jak může vegan zlepšit kvalitu přijímaných bílkovin?"
        options:
          - { text: "Kombinovat obiloviny s luštěninami", correct: true }
          - { text: "Jíst jen obiloviny, ty mají všechny aminokyseliny", why: "Obilovinám chybí hlavně lysin." }
          - { text: "Nahradit luštěniny veganskými salámy", why: "Masové analogy jsou ultrazpracované; preferují se luštěniny, tofu, tempeh." }
          - { text: "Kvalitu rostlinných bílkovin nelze ovlivnit", why: "Vhodnou kombinací se využitelnost zvýší až na 80 %." }

  - id: alt.vegan-uzpp
    title: Veganské ≠ automaticky zdravé
    kind: concept
    tier: B
    criteria: [6a]
    source: { pages: [191, 192], anchor: "upřednostňují nezpracované rostlinné zdroje bílkovin" }
    explanation: >-
      Veganský je i cukr a řada ultrazpracovaných potravin – typicky masové analogy („salámy“,
      „burgery“, „nugetky“) s dlouhým složením (izoláty bílkovin, oleje, škroby, stabilizátory,
      aromata), navíc drahé. Poradce má vést klienta k nezpracovaným zdrojům (luštěniny, tofu,
      tempeh) a ke čtení složení. Mýty (bez masa nelze být silný, maso v střevě hnije, živočišné
      produkty vůbec nepotřebujeme) nemají jednoznačnou oporu – probrat je věcně.
    exercises:
      - id: analog
        type: choice
        prompt: "Klient přešel na veganskou stravu a jí hlavně veganské burgery a salámy. Co mu doporučíš?"
        options:
          - { text: "Upřednostnit luštěniny, tofu a tempeh a číst složení výrobků.", correct: true }
          - { text: "Nic, veganské výrobky jsou automaticky zdravé.", why: "Masové analogy bývají ultrazpracované potraviny." }
          - { text: "Přidat k nim ještě sójové nugety pro víc bílkovin.", why: "Nugety jsou také ultrazpracovaný masový analog." }
          - { text: "Vrátit se okamžitě k masu.", why: "Úkolem poradce není směr odsuzovat, ale věcně pomoci." }

  - id: alt.makrobiotika
    title: Makrobiotika
    kind: concept
    tier: B
    criteria: [6a]
    source: { pages: [193], anchor: "Makrobiotika je stravovací směr bez vědeckého zdůvodnění" }
    explanation: >-
      Makrobiotika je směr bez vědeckého zdůvodnění, převážně vegetariánský, založený filozofem Ohsawou.
      Základem jsou obiloviny a zelenina. Vychází z rovnováhy jin a jang – ideální poměr 5 : 1 má
      hnědá rýže; argumentuje i chrupem (z 32 zubů jen 4 na maso). Odmítá pesticidy a umělá hnojiva.
      Rizika jako u veganství: omega-3, železo, vápník, zinek, vitamin D, B12. U dětí prokázáno
      zpomalení růstu a rachitida.
    exercises:
      - id: hodnoceni
        type: explain
        prompt: "Co je makrobiotika a jaká jsou její rizika?"
        keyPoints:
          - "Bez vědeckého zdůvodnění, zakladatel Ohsawa"
          - "Převážně vegetariánská – obiloviny a zelenina"
          - "Filozofie jin a jang, ideál 5 : 1 (hnědá rýže)"
          - "Rizika jako u veganství: B12, D, Fe, Ca, Zn, omega-3"
          - "Děti: zpomalení růstu, rachitida"
        modelAnswer: >-
          Makrobiotika je převážně vegetariánský směr bez vědeckého podkladu, který založil japonský
          filozof Ohsawa. Základem jsou obiloviny a zelenina a jídla se volí podle rovnováhy jin a
          jang – za ideální se považuje poměr 5 : 1, jaký má hnědá rýže. Rizika jsou podobná jako
          u veganství: nedostatek B12, vitaminu D, železa, vápníku, zinku a omega-3. Nejvíc ohrožuje
          děti – studie u nich prokázala zpomalení růstu a rachitidu.
      - id: jin-jang
        type: choice
        prompt: "Která potravina podle makrobiotiky splňuje ideální poměr jin a jang 5 : 1?"
        options:
          - { text: "Hnědá rýže", correct: true }
          - { text: "Tofu", why: "Za ideál 5 : 1 skripta uvádějí hnědou rýži." }
          - { text: "Ovoce", why: "Za ideál 5 : 1 skripta uvádějí hnědou rýži." }
          - { text: "Rybí maso", why: "Makrobiotika je převážně vegetariánská; ideálem je hnědá rýže." }
      - id: deti
        type: choice
        prompt: "Jaké důsledky makrobiotické stravy u dětí skripta uvádějí?"
        options:
          - { text: "Zpomalení růstu a známky rachitidy", correct: true }
          - { text: "Dětskou obezitu a diabetes 2. typu", why: "Problémem je nedostatek energie a živin, ne nadbytek." }
          - { text: "Žádné – pro rostoucí děti je vhodná", why: "Studie u dětí prokázala zpomalení růstu a rachitidu." }
          - { text: "Předávkování vitaminem D a vápníkem", why: "Naopak – hrozí nedostatek vitaminu D a rachitida." }

  - id: alt.lchf
    title: Nízkosacharidová strava (LCHF) – princip a hodnocení
    kind: concept
    tier: A
    criteria: [7b, 6a]
    confusableWith: [alt.keto]
    source: { pages: [194, 195, 196], anchor: "Typicky neobsahuje více než 130 g sacharidů denně" }
    explanation: >-
      LCHF má obvykle nejvýš 130 g sacharidů denně (15–25 % energie). Místo pečiva a příloh listová
      zelenina; základ zelenina, maso, ryby, vejce, mléčné výrobky, ořechy, semínka, méně ovoce;
      mizí rafinované sacharidy, cukr a netučné produkty. Možné výhody: hubnutí (hlavně zpočátku),
      stabilnější glykémie, nižší chuť na sladké, nižší tlak. Rizika: víc nasycených tuků, málo
      vlákniny (zácpa), nedostatek mikroživin, „keto chřipka“, udržitelnost. SZÚ: krátkodobě může
      pomoci s redukcí, dlouhodobé vyřazení obilovin a ovoce vede k deficitům.
    exercises:
      - id: hodnoceni
        type: explain
        prompt: "Klient se ptá na nízkosacharidovou stravu (LCHF). Jak ji popíšeš a zhodnotíš?"
        keyPoints:
          - "Max. cca 130 g sacharidů/den (15–25 % energie)"
          - "Místo příloh a pečiva zelenina; maso, ryby, vejce, mléčné výrobky, ořechy"
          - "Výhody: hubnutí, glykémie (DM2), menší chuť na sladké"
          - "Rizika: nasycené tuky, málo vlákniny, mikroživiny, keto chřipka, udržitelnost"
          - "SZÚ/SpV: krátkodobě může pomoci, dlouhodobé vyloučení skupin → deficity"
        modelAnswer: >-
          Nízkosacharidová strava obvykle nepřesahuje 130 g sacharidů denně. Pečivo a přílohy nahradí
          zelenina a základem je maso, ryby, vejce, mléčné výrobky a ořechy. Může pomoci s hubnutím,
          hlavně na začátku, může stabilizovat glykémii a snížit chuť na sladké, což se hodí třeba
          při diabetu 2. typu. Rizikem je vyšší příjem nasycených tuků, málo vlákniny a některých
          mikroživin, keto chřipka a obtížná udržitelnost. Podle SZÚ a Společnosti pro výživu může
          krátkodobě pomoci s redukcí, ale dlouhodobé vyřazení obilovin a ovoce vede k deficitům.
      - id: hranice
        type: choice
        prompt: "Kolik sacharidů denně typicky nepřesahuje nízkosacharidová strava?"
        options:
          - { text: "130 g", correct: true }
          - { text: "20 g", why: "Do 20 g je velmi nízkosacharidová strava." }
          - { text: "250 g", why: "To je víc, než připouští i volnější nízkosacharidová strava (do 130 g)." }
          - { text: "50 % energie", why: "LCHF tvoří obvykle 15–25 % energie." }
      - id: riziko
        type: choice
        prompt: "Které riziko nízkosacharidové stravy skripta uvádějí?"
        options:
          - { text: "Zácpa kvůli nízkému příjmu vlákniny", correct: true }
          - { text: "Nadbytek vlákniny a nadýmání", why: "Vlákniny je naopak málo." }
          - { text: "Nadměrný příjem vlákniny", why: "Vlákniny je naopak málo." }
          - { text: "Nedostatek bílkovin", why: "Bílkovin bývá dost – základem je maso, ryby, vejce, mléčné výrobky." }

  - id: alt.lchf-deleni
    title: Dělení stravy podle příjmu sacharidů
    kind: fact
