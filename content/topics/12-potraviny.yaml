          - "SZPI – obchodní síť a stravovací zařízení"
          - "SVS – od původu (chovy, pole) až po konzumaci"
          - "Dále ČOI a krajské hygienické stanice"
          - "Web potravinynapranyri.cz – zveřejněné problémové potraviny"
