topic:
  id: energeticka-bilance
  title: Energetická bilance
  chapter: 15
  pages: [167, 173]
  order: 150
  summary: >-
    Příjem a výdej energie, jednotky, složky výdeje (BMR, NEAT, EAT, TEF), predikční rovnice,
    výpočet celkového denního výdeje (TDEE), adaptivní termogeneze, jojo efekt a energetická dostupnost.

points:
  - id: en.bilance
    title: Typy energetické bilance
    kind: concept
    tier: A
    criteria: [5a, 6b, 7a]
    source: { pages: [167, 173], anchor: "energetická bilance kladná, záporná nebo vyrovnaná" }
    explanation: >-
      Energetická bilance = vztah přijaté a vydané energie. Kladná (příjem > výdej) vede k nárůstu
      hmotnosti, záporná (příjem < výdej) k poklesu, vyrovnaná k udržení. Princip CICO
      („calories in, calories out“) vychází ze zákona zachování energie. Dlouhodobě záporná bilance
      kromě hubnutí často sníží NEAT a může vést k adaptivní termogenezi (nižší výdej); dlouhodobě
      kladná znamená postupné ukládání přebytku a nárůst hmotnosti.
    exercises:
      - id: typy
        type: explain
        version: 2
        prompt: "Vysvětli tři typy energetické bilance a jejich dopad na hmotnost."
        keyPoints:
          - "Kladná: příjem > výdej → hmotnost roste"
          - "Záporná: příjem < výdej → hmotnost klesá"
          - "Vyrovnaná: příjem ≈ výdej → hmotnost stabilní"
          - "Příjem = jídlo a nápoje; výdej = činnost orgánů, běžné činnosti, sport"
          - "Dlouhodobě záporná: kromě hubnutí často pokles NEAT a adaptivní termogeneze (nižší výdej)"
          - "Dlouhodobě kladná: přebytek se postupně ukládá, hmotnost roste"
        modelAnswer: >-
          Energetická bilance porovnává energii přijatou z jídla a nápojů s energií vydanou na činnost
          orgánů, běžné aktivity a sport. Je-li příjem vyšší než výdej, je bilance kladná a hmotnost
          roste; je-li nižší, je záporná a hmotnost klesá; při rovnosti je vyrovnaná a hmotnost se udržuje.
          Dlouhodobě záporná bilance navíc často sníží výdej (méně NEAT, adaptivní termogeneze);
          dlouhodobě kladná vede k postupnému ukládání přebytku a růstu hmotnosti.
      - id: stoji-hmotnost
        type: choice
        prompt: "Klient chce zhubnout, ale měsíc jí pořád stejně a hmotnost mu stojí. Co to říká o jeho energetické bilanci?"
        options:
          - { text: "Je zhruba vyrovnaná – příjem odpovídá výdeji.", correct: true, why: "Stabilní hmotnost znamená, že příjem zhruba odpovídá výdeji; k hubnutí je potřeba záporná bilance." }
          - { text: "Je záporná, jen se to na váze zatím neprojevilo.", why: "Při záporné bilanci hmotnost klesá; měsíc beze změny ukazuje na bilanci vyrovnanou." }
          - { text: "Je kladná, protože hmotnost neklesá.", why: "Kladná bilance by vedla k nárůstu hmotnosti; stabilní hmotnost = vyrovnaná bilance." }
          - { text: "O bilanci to nevypovídá, rozhoduje složení stravy.", why: "Vývoj hmotnosti určuje poměr příjmu a výdeje (princip CICO)." }

  - id: en.energie-zivin
    title: Energetická hodnota živin
    kind: fact
    tier: B
    criteria: [5c, 1a]
    source: { pages: [167], anchor: "Alkohol - obsah 29 kJ/7 kcal v 1 g" }
    explanation: >-
      Sacharidy 17 kJ / 4 kcal na 1 g, bílkoviny 17 kJ / 4 kcal, tuky 38 kJ / 9 kcal, alkohol
      29 kJ / 7 kcal. Vláknina se podle EFSA počítá 8 kJ/g.
    exercises:
      - id: hodnoty
        type: reveal
        prompt: "Kolik kJ a kcal obsahuje 1 g sacharidů, bílkovin, tuků a alkoholu?"
        answer: "Sacharidy a bílkoviny 17 kJ / 4 kcal, tuky 38 kJ / 9 kcal, alkohol 29 kJ / 7 kcal."
      - id: alkohol
        type: choice
        prompt: "Kolik energie obsahuje 1 g alkoholu?"
        options:
          - { text: "29 kJ / 7 kcal", correct: true }
          - { text: "17 kJ / 4 kcal", why: "To je hodnota sacharidů a bílkovin." }
          - { text: "38 kJ / 9 kcal", why: "To je hodnota tuků." }
          - { text: "Alkohol energii neobsahuje", why: "Alkohol je energeticky vydatný – 7 kcal v 1 g." }
      - id: vypocet
        type: numeric
        formula: energy-from-macros
        prompt: "Jídlo obsahuje {carbs} g sacharidů, {protein} g bílkovin a {fat} g tuků. Kolik má kcal?"
        params:
          carbs: { min: 10, max: 120, step: 5 }
          protein: { min: 5, max: 60, step: 5 }
          fat: { min: 2, max: 40, step: 1 }
        unit: kcal
        tolerance: { abs: 2 }
        hint: "Sacharidy a bílkoviny × 4, tuky × 9."
      - id: vysvetli
        type: explain
        prompt: "Vysvětli klientovi, kolik energie dodávají jednotlivé živiny a alkohol."
        keyPoints:
          - "Sacharidy: 17 kJ / 4 kcal v 1 g"
          - "Bílkoviny: také 17 kJ / 4 kcal v 1 g"
          - "Tuky: 38 kJ / 9 kcal v 1 g – víc než dvojnásobek"
          - "Alkohol: 29 kJ / 7 kcal v 1 g"
        modelAnswer: >-
          Gram sacharidů i bílkovin dodá asi 17 kJ, tedy 4 kcal. Gram tuku má 38 kJ neboli 9 kcal, tedy
          víc než dvojnásobek. Alkohol je také vydatný zdroj energie – 29 kJ, tedy 7 kcal v jednom gramu.

  - id: en.jednotky
    title: Převod kJ a kcal
    kind: procedure
    tier: B
    criteria: [5c, 6b]
    source: { pages: [167], anchor: "1 kcal odpovídá přibližně 4,2 kJ" }
    explanation: >-
      1 kcal ≈ 4,2 kJ a 1 kJ ≈ 0,24 kcal. Z kcal na kJ tedy násobíme 4,2, z kJ na kcal dělíme 4,2
      (nebo násobíme 0,24).
    exercises:
      - id: kcal-kj
        type: numeric
        formula: kcal-to-kj
        prompt: "Převeď {kcal} kcal na kJ (podle skript)."
        params:
          kcal: { min: 100, max: 3000, step: 50 }
        unit: kJ
        tolerance: { rel: 0.01 }
        hint: "1 kcal ≈ 4,2 kJ"
      - id: kj-kcal
        type: numeric
        formula: kj-to-kcal
        prompt: "Na etiketě je {kj} kJ. Kolik je to přibližně kcal?"
        params:
          kj: { min: 200, max: 4000, step: 50 }
        unit: kcal
        tolerance: { rel: 0.02 }
        hint: "1 kJ ≈ 0,24 kcal (dělíme 4,2)"
      - id: vysvetli
        type: explain
        prompt: "Klientka má na etiketě energii jen v kJ, ale aplikace počítá v kcal. Jak jí poradíš s převodem?"
        keyPoints:
          - "1 kcal ≈ 4,2 kJ (1 kJ ≈ 0,24 kcal)"
          - "Z kJ na kcal: vydělit 4,2 (nebo vynásobit 0,24)"
          - "Z kcal na kJ: vynásobit 4,2"
        modelAnswer: >-
          Jedna kilokalorie odpovídá přibližně 4,2 kJ. Hodnotu z etikety v kJ tedy vydělí 4,2 (nebo
          vynásobí 0,24) a dostane kcal – třeba 1000 kJ je asi 240 kcal. Opačně, z kcal na kJ, násobí 4,2.

  - id: en.podhodnoceni
    title: Podhodnocování příjmu
    kind: fact
    tier: B
    criteria: [5a, 3b]
    source: { pages: [168], anchor: "podceňovat svůj denní energetický příjem o 30–55 %" }
    explanation: >-
      Lidé mají tendenci podceňovat svůj denní energetický příjem o 30–55 %. Proto je záznam
      stravy jen odhad a je potřeba ho porovnávat s vývojem hmotnosti.
    exercises:
      - id: kolik
        type: choice
        prompt: "O kolik lidé podle skript obvykle podceňují svůj denní energetický příjem?"
        options:
          - { text: "O 30–55 %", correct: true }
          - { text: "O 5–10 %", why: "Podle skript je podhodnocení mnohem větší – 30–55 %." }
          - { text: "Nepodceňují, spíše přeceňují", why: "Lidé mají tendenci příjem podceňovat." }
          - { text: "O 80–90 %", why: "Tolik ne – skripta uvádějí 30–55 %." }

  - id: en.tdee-slozky
    title: Složky celkového výdeje (TDEE)
    kind: concept
    tier: A
    criteria: [5e, 6b]
    source: { pages: [168], anchor: "TDEE (Total Daily Energy Expenditure)" }
    explanation: >-
      TDEE = BMR + NEAT + EAT + TEF. BMR (bazální metabolismus) asi 60 % výdeje; NEAT (běžná
      nesportovní aktivita) 10–25 %; EAT (cílený sport) 0–30 %; TEF (termický efekt potravy)
      kolem 10 %. Výdej zvyšuje i stres, nemoc, regenerace, těhotenství a kojení.
    exercises:
      - id: zkratky
        type: reveal
        prompt: "Co znamenají zkratky BMR, NEAT, EAT a TEF?"
        answer: >-
          BMR = bazální metabolismus; NEAT = energie na běžnou nesportovní aktivitu; EAT = energie
          na cílenou sportovní aktivitu; TEF = termický efekt potravy.
      - id: vysvetli
        type: explain
        prompt: "Vysvětli, z jakých složek se skládá celkový denní energetický výdej a jaký mají podíl."
        keyPoints:
          - "TDEE = BMR + NEAT + EAT + TEF"
          - "BMR asi 60 %, NEAT 10–25 %"
          - "EAT 0–30 %, TEF kolem 10 %"
          - "Výdej zvyšuje i stres, nemoc, regenerace, těhotenství a kojení"
        modelAnswer: >-
          Celkový výdej (TDEE) je součtem bazálního metabolismu, běžné nesportovní aktivity (NEAT),
          cíleného sportu (EAT) a termického efektu potravy (TEF). Největší díl, asi 60 %, tvoří BMR;
          NEAT 10–25 %, EAT 0–30 % a TEF kolem 10 %. Výdej dál zvyšuje stres, nemoc, regenerace,
          těhotenství nebo kojení.
      - id: nejvetsi
        type: choice
        version: 2
        prompt: "Která složka tvoří obvykle největší podíl celkového denního výdeje?"
        options:
          - { text: "BMR – bazální metabolismus", correct: true, why: "BMR tvoří obvykle asi 60 % výdeje." }
          - { text: "NEAT – běžná aktivita", why: "NEAT tvoří asi 10–25 %." }
          - { text: "EAT – cílený sport", why: "EAT tvoří asi 0–30 %." }
          - { text: "TEF – termický efekt stravy", why: "TEF tvoří kolem 10 %." }
      - id: neat-vs-eat
        type: choice
        version: 2
        prompt: "Kterou složku výdeje lze podle skript u nesportovců každý den nejvýrazněji ovlivnit?"
        options:
          - { text: "NEAT – běžná denní aktivita", correct: true }
          - { text: "BMR – bazální metabolismus", why: "BMR kryje životně důležité funkce v klidu – každodenním chováním ho výrazně nezměníš." }
          - { text: "TEF – termický efekt stravy", why: "TEF tvoří jen kolem 10 % výdeje a odvíjí se od jídla." }
          - { text: "EAT – cílený sport", why: "U nesportovců je EAT malý; NEAT může za den znamenat víc než hodina cíleného sportu (s. 170)." }

  - id: en.bmr-definice
    title: Bazální metabolismus – definice
    kind: concept
    tier: A
    criteria: [5e]
    prereqs: [en.tdee-slozky]
    source: { pages: [169], anchor: "při neutrální teplotě (21–27 °C), po dobu 12 hodin" }
    explanation: >-
      BMR je energie ležícího člověka v naprostém klidu, při neutrální teplotě (21–27 °C) a nalačno
      (12 h bez trávení). Kryje jen životně důležité funkce orgánů. Tvoří asi 60 % výdeje; podle
      skript se výrazněji nemění až do 60 let, pak mírně klesá.
    exercises:
      - id: podminky
        type: reveal
        prompt: "Za jakých podmínek se definuje bazální metabolismus?"
        answer: "Vleže, v naprostém klidu, při neutrální teplotě 21–27 °C a nalačno (12 hodin bez trávení)."
      - id: vysvetli
        type: explain
        prompt: "Co je bazální metabolismus, za jakých podmínek se určuje a jakou část výdeje tvoří?"
        keyPoints:
          - "Energie na životně důležité funkce orgánů"
          - "Vleže, v naprostém klidu, při neutrální teplotě 21–27 °C"
          - "Nalačno – 12 hodin bez trávení"
          - "Asi 60 % výdeje; do 60 let se výrazně nemění, pak mírně klesá"
        modelAnswer: >-
          Bazální metabolismus je energie, kterou tělo spotřebuje jen na životně důležité funkce orgánů.
          Určuje se vleže, v naprostém klidu, při neutrální teplotě 21–27 °C a nalačno, tedy 12 hodin
          bez trávení. Tvoří asi 60 % celkového výdeje; do zhruba 60 let se výrazně nemění, pak mírně klesá.
      - id: vek
        type: choice
        prompt: "Jak se podle skript mění BMR s věkem?"
        options:
          - { text: "Do zhruba 60 let se výrazně nemění, pak mírně klesá.", correct: true }
          - { text: "Klesá rychle a plynule už od 25 let věku.", why: "Podle skript je BMR do zhruba 60 let stabilní." }
          - { text: "S věkem postupně stoupá, nejvyšší je ve stáří.", why: "Po 60. roce BMR naopak mírně klesá." }
          - { text: "Mění se hlavně podle ročního období a počasí.", why: "Skripta uvádějí jako faktor věk (pokles po 60 letech), ne roční období." }

  - id: en.bmr-metody
    title: Metody stanovení BMR
    kind: comparison
    tier: B
    criteria: [5e, 3b]
    prereqs: [en.bmr-definice]
    source: { pages: [169], anchor: "metoda přímé kalorimetrie, která je považovaná za nejpřesnější" }
    explanation: >-
      Přímá kalorimetrie = nejpřesnější, v praxi nereálná. DLW (dvojitě značená voda) = nepřímá,
      přesná, drahá, měří celkový výdej. DEXA = nejpřesnější měření složení těla, BMR dopočítá.
      Bioimpedance = nejběžnější; ovlivní ji pot, postoj, plocha chodidel, čistota přístroje —
      hodí se ke sledování trendu.
    exercises:
      - id: nejpresnejsi
        type: choice
        prompt: "Která metoda stanovení BMR je považována za nejpřesnější?"
        options:
          - { text: "Přímá kalorimetrie", correct: true }
          - { text: "Bioimpedance", why: "Bioimpedance je nejběžnější, ale ne nejpřesnější." }
          - { text: "Rovnice Harris-Benedict", why: "Predikční rovnice je jen odhad, ne měření." }
          - { text: "Chytré hodinky", why: "Odhady chytrých hodinek se podle skript liší o desítky procent." }
      - id: bioimpedance
        type: explain
        prompt: "Klientka se ptá, jak přesné je měření na bioimpedanční váze. Co jí vysvětlíš?"
        keyPoints:
          - "Je to nejběžnější metoda, BMR se dopočítává ze složení těla"
          - "Přesnost není dokonalá"
          - "Ovlivní ji pot, postoj a jeho klid, plocha chodidel, čistota přístroje"
          - "Výhoda: lze opakovat a sledovat trend v čase"
        modelAnswer: >-
          Bioimpedance je v praxi nejběžnější — přístroj změří složení těla a z něj BMR dopočítá.
          Přesnost není dokonalá: ovlivňuje ji pot, postoj, plocha chodidel i čistota přístroje.
          Hodnota je ale v tom, že měření můžeme opakovat za stejných podmínek a sledovat trend.

  - id: en.bmr-rovnice-volba
    title: Volba predikční rovnice pro BMR
    kind: comparison
    tier: A
    criteria: [5e]
    prereqs: [en.bmr-definice]
    source: { pages: [169, 170], anchor: "U sportovců bývá výpočet bazálního metabolizmu bez zahrnutí složení těla" }
    explanation: >-
      Katch-McArdle použij, když znáš spolehlivě beztukovou hmotu (FFM). Mifflin-St Jeor, když
      složení těla neznáš. Harris-Benedict je nejstarší. Rovnice bez složení těla u obézních
      klientů BMR nadhodnocují, u sportovců podhodnocují. Každá rovnice je jen odhad.
    exercises:
      - id: kdy-katch
        type: choice
        version: 2
        prompt: "Kdy je vhodné použít rovnici Katch-McArdle?"
        options:
          - { text: "Když máme spolehlivý údaj o beztukové hmotě (FFM).", correct: true }
          - { text: "Když neznáme složení těla.", why: "Pak skripta doporučují Mifflin-St Jeor." }
          - { text: "U každého klienta, protože je nejpřesnější.", why: "Přesná je jen se spolehlivě změřenou beztukovou hmotou; bez ní ji nespočítáš." }
          - { text: "Když chceme co nejstarší a nejověřenější rovnici.", why: "Nejstarší je Harris-Benedict." }
      - id: obezni-sportovci
        type: choice
        prompt: "Jak se chová výpočet BMR bez složení těla u obézního klienta a u sportovce?"
        options:
          - { text: "U obézního nadhodnocuje, u sportovce podhodnocuje.", correct: true }
          - { text: "U obézního podhodnocuje, u sportovce nadhodnocuje.", why: "Obráceně – obézní mají méně aktivní hmoty, sportovci víc svalů." }
          - { text: "U obou je přesný.", why: "Bez složení těla je výpočet u obou zkreslený." }
          - { text: "U obou nadhodnocuje.", why: "U sportovce výpočet naopak podhodnocuje." }
      - id: rozdily
        type: explain
        version: 2
        prompt: "U zkoušky máš vysvětlit rozdíly mezi metodikami stanovení BMR. Co řekneš?"
        keyPoints:
          - "Měření: přímá kalorimetrie nejpřesnější, ale nereálná; DLW přesná, drahá; DEXA a bioimpedance (nejběžnější) BMR dopočítají"
          - "Katch-McArdle počítá s beztukovou hmotou (FFM) – vhodná, když složení těla známe"
          - "Mifflin-St Jeor – z hmotnosti, výšky, věku a pohlaví, když složení neznáme"
          - "Harris-Benedict – nejstarší rovnice"
          - "Bez složení těla: u obézních nadhodnocení, u sportovců podhodnocení"
          - "Všechny jsou jen odhad – ověřit podle vývoje klienta"
        modelAnswer: >-
          Nejpřesnější je přímá kalorimetrie, v praxi je ale nereálná; dvojitě značená voda je přesná,
          ale drahá. DEXA a bioimpedance změří složení těla a BMR z něj dopočítají – bioimpedance je
          nejběžnější. Bez měření použiji rovnici. Když mám spolehlivý údaj o beztukové hmotě, použiji
          Katch-McArdle, protože pracuje přímo s FFM. Bez znalosti složení těla použiji Mifflin-St Jeor z hmotnosti, výšky, věku a pohlaví;
          Harris-Benedict je nejstarší rovnice. Rovnice bez složení těla u obézních BMR nadhodnocují
          a u sportovců podhodnocují. Výsledek je vždy odhad, který ověřuji podle vývoje klienta.

  - id: en.bmr-mifflin
    title: Výpočet BMR – Mifflin-St Jeor
    kind: procedure
    tier: A
    criteria: [5e, 6b]
    prereqs: [en.bmr-rovnice-volba]
    confusableWith: [en.bmr-harris]
    source: { pages: [169], anchor: "10 * hmotnost + 6,25 * výška - 5 * věk" }
    explanation: >-
      Mifflin-St Jeor: 10 × hmotnost (kg) + 6,25 × výška (cm) − 5 × věk (roky) + 5 u mužů,
      u žen místo +5 odečítáme 161.
    exercises:
      - id: vypocet
        type: numeric
        formula: bmr-mifflin
        prompt: "Vypočítej BMR podle Mifflin-St Jeor. Klient: {sex}, {age} let, výška {height} cm, hmotnost {weight} kg."
        params:
          sex: { choices: [{ value: M, label: muž }, { value: F, label: žena }] }
          age: { min: 20, max: 65, step: 1 }
          height: { min: 155, max: 195, step: 1 }
          weight: { min: 50, max: 120, step: 1 }
        unit: kcal
        tolerance: { abs: 10 }
        hint: "10 × hmotnost + 6,25 × výška − 5 × věk; muži + 5, ženy − 161."
      - id: vzorec
        type: reveal
        prompt: "Napiš (aspoň v duchu) rovnici Mifflin-St Jeor pro muže a pro ženy."
        answer: "10 × kg + 6,25 × cm − 5 × věk; muži + 5, ženy − 161."
      - id: vysvetli
        type: explain
        prompt: "Vysvětli, jaké údaje od klienta potřebuješ a jak spočítáš BMR podle Mifflin-St Jeor."
        keyPoints:
          - "Potřebuji hmotnost (kg), výšku (cm), věk (roky) a pohlaví"
          - "10 × hmotnost + 6,25 × výška − 5 × věk"
          - "Muži + 5, ženy − 161"
        modelAnswer: >-
          Potřebuji hmotnost v kilogramech, výšku v centimetrech, věk a pohlaví. Spočítám 10 × hmotnost
          + 6,25 × výška − 5 × věk. U mužů k výsledku přičtu 5, u žen odečtu 161.

  - id: en.bmr-harris
    title: Výpočet BMR – Harris-Benedict
    kind: procedure
    tier: B
    status: course-disputed
    note: >-
      Skripta (s. 169) uvádějí u mužů koeficient věku 6,775. Současné poznatky: původní rovnice
      (Harris a Benedict, 1918/1919) má 6,755 (a konstantu 66,47); rozdíl ve výsledku je řádově 1 kcal.
      Ke zkoušce: výpočet v aplikaci jde podle skript; tolerance odchylku obou verzí pokrývá.
    criteria: [5e]
    prereqs: [en.bmr-rovnice-volba]
    confusableWith: [en.bmr-mifflin]
    source: { pages: [169], anchor: "13.75 * hmotnost + 5.003 * výška v cm" }
    explanation: >-
      Harris-Benedict (nejstarší rovnice). Muži: 13,75 × kg + 5,003 × cm − 6,775 × věk + 66,5.
      Ženy: 9,563 × kg + 1,85 × cm − 4,676 × věk + 655,1. Koeficienty jsou složité; podstatné je
      vědět, že jde o nejstarší rovnici a čím se liší od ostatních.
    exercises:
      - id: vypocet
        type: numeric
        formula: bmr-harris
        prompt: "Použij nejstarší predikční rovnici (Harris-Benedict) a spočítej BMR: {sex}, {age} let, {height} cm, {weight} kg."
        params:
          sex: { choices: [{ value: M, label: muž }, { value: F, label: žena }] }
          age: { min: 20, max: 65, step: 1 }
          height: { min: 155, max: 195, step: 1 }
          weight: { min: 50, max: 120, step: 1 }
        unit: kcal
        tolerance: { abs: 10 }
        hint: "Muži: 13,75 × kg + 5,003 × cm − 6,775 × věk + 66,5. Ženy: 9,563 × kg + 1,85 × cm − 4,676 × věk + 655,1."

  - id: en.bmr-katch
    title: Výpočet BMR – Katch-McArdle
    kind: procedure
    tier: B
    criteria: [5e]
    prereqs: [en.bmr-rovnice-volba]
    confusableWith: [en.bmr-mifflin]
    source: { pages: [169], anchor: "21.6 * FFM (Fat Free Mass) + 370" }
    explanation: >-
      Katch-McArdle: BMR = 21,6 × FFM + 370, kde FFM je beztuková hmota v kg. Když znáš hmotnost
      a procento tuku: FFM = hmotnost × (1 − % tuku / 100).
    exercises:
      - id: vypocet
        type: numeric
        formula: bmr-katch
        prompt: "Klientka váží {weight} kg a bioimpedance ukázala {bodyFat} % tuku. Vypočítej BMR podle Katch-McArdle."
        params:
          weight: { min: 50, max: 110, step: 1 }
          bodyFat: { min: 15, max: 45, step: 1 }
        unit: kcal
        tolerance: { abs: 10 }
        hint: "Nejdřív FFM = hmotnost × (1 − tuk/100), potom 21,6 × FFM + 370."
      - id: vysvetli
        type: explain
        prompt: "Klientka má změřené složení těla. Popiš, jak spočítáš její BMR podle Katch-McArdle."
        keyPoints:
          - "Potřebuji beztukovou hmotu (FFM) v kg"
          - "FFM = hmotnost × (1 − % tuku / 100)"
          - "BMR = 21,6 × FFM + 370"
        modelAnswer: >-
          Rovnice Katch-McArdle pracuje s beztukovou hmotou. Z hmotnosti a procenta tuku ji spočítám jako
          hmotnost × (1 − % tuku / 100) – např. 70 kg a 30 % tuku dá 49 kg FFM. Pak BMR = 21,6 × FFM + 370,
          tedy asi 1428 kcal.

  - id: en.pod-bmr
    title: Jíst pod hodnotu BMR?
    kind: concept
    tier: B
    criteria: [5e, 7b]
    prereqs: [en.bmr-rovnice-volba]
    source: { pages: [170], anchor: "S příjmem pod hodnotu BMR se lze setkat na obezitologických klinikách" }
    explanation: >-
      Jíst méně než BMR obecně nedává smysl — každý vydá víc než klidovou hodnotu. Vypočítané BMR
      je ale jen odhad; u obézních klientů bez pohybu se s příjmem pod vypočítané BMR lze dostat.
      Takový příjem patří pod lékařský dohled (obezitologie) a na omezenou dobu.
    exercises:
      - id: kdy
        type: choice
        prompt: "Kde se podle skript lze setkat s energetickým příjmem pod hodnotou BMR?"
        options:
          - { text: "Na obezitologických klinikách pod lékařským dohledem", correct: true }
          - { text: "Běžně u každého redukčního jídelníčku pro rychlejší výsledek", why: "Jíst pod BMR obecně nedává smysl – každý vydá víc než klidovou hodnotu." }
          - { text: "U sportovců před závody kvůli shození hmotnosti", why: "Sportovcům hrozí nízká energetická dostupnost (RED-S); skripta příjem pod BMR spojují jen s obezitologií." }
          - { text: "U dospívajících s nadváhou, i bez lékařského dohledu", why: "Příjem pod BMR patří jen pod lékařský dohled a na omezenou dobu." }

  - id: en.neat
    title: NEAT a koeficienty aktivity
    kind: procedure
    tier: B
    criteria: [5e, 6b]
    prereqs: [en.tdee-slozky, en.bmr-mifflin]
    source: { pages: [170], anchor: "NEAT tvoří přibližně 10–25 % celkového energetického výdeje" }
    explanation: >-
      NEAT = energie na běžnou nesportovní aktivitu (chůze, úklid…), asi 10–25 % výdeje. Odhad:
      NEAT = BMR × koeficient — 0,1 nízká aktivita (sedavá práce), 0,2 střední (lehčí práce,
      domácí práce, snaha chodit), 0,35 vysoká (náročná práce, stále v pohybu).
    exercises:
      - id: vypocet
        type: numeric
        formula: neat
        prompt: "BMR klienta je {bmr} kcal, jeho běžná denní aktivita odpovídá koeficientu {coef}. Kolik kcal je NEAT?"
        params:
          bmr: { min: 1200, max: 2200, step: 5 }
          coef: { choices: [{ value: 0.1, label: "0,1" }, { value: 0.2, label: "0,2" }, { value: 0.35, label: "0,35" }] }
        unit: kcal
        tolerance: { abs: 5 }
        hint: "NEAT = BMR × koeficient"
      - id: koeficienty
        type: choice
        prompt: "Klientka má sedavé zaměstnání, jezdí autem a večer odpočívá. Jaký koeficient NEAT zvolíš?"
        options:
          - { text: "0,1", correct: true }
          - { text: "0,2", why: "0,2 odpovídá střední aktivitě (lehčí práce, domácí práce, snaha chodit); skripta ho v příkladu použijí pro sedavou práci s běžnými domácími pracemi." }
          - { text: "0,35", why: "0,35 odpovídá vysoké aktivitě." }
          - { text: "1,2", why: "1,2 je koeficient PAL pro sedavý způsob života, ne NEAT." }
      - id: vysvetli
        type: explain
        prompt: "Co je NEAT a jak ho u klienta odhadneš?"
        keyPoints:
          - "Energie na běžnou nesportovní aktivitu (chůze, úklid…)"
          - "Tvoří asi 10–25 % výdeje"
          - "NEAT = BMR × koeficient"
          - "Koeficient 0,1 nízká, 0,2 střední, 0,35 vysoká aktivita"
        modelAnswer: >-
          NEAT je energie vydaná na běžnou nesportovní aktivitu, jako je chůze nebo úklid, a tvoří asi
          10–25 % výdeje. Odhadnu ho jako BMR × koeficient podle převažující denní aktivity: 0,1 při
          sedavé práci, 0,2 při střední a 0,35 při vysoké aktivitě. Při BMR 1500 kcal a koeficientu 0,2
          je NEAT 300 kcal.

  - id: en.eat
    title: EAT a MET jednotky
    kind: procedure
    tier: B
    status: course-disputed
    note: >-
      Skripta (s. 171): EAT = hmotnost × MET × čas a TDEE = BMR + NEAT + EAT + TEF. Současné poznatky:
      hodnota MET (Compendium of Physical Activities, Ainsworth a kol.) zahrnuje i klidový výdej
      (1 MET), takže součet BMR + EAT započítá klidový výdej během sportu dvakrát; přesnější je
      (MET − 1). Rozdíl je u běžného tréninku malý (desítky kcal). Ke zkoušce: výpočty v aplikaci
      jdou podle skript; pokud se otázka výslovně ptá na skripta, odpověď je hmotnost × MET × čas.
    criteria: [5e, 6b, 7d]
    prereqs: [en.tdee-slozky]
    source: { pages: [171], anchor: "EAT = hmotnost (kg) x MET x čas (h)" }
    explanation: >-
      EAT = energie na cílenou sportovní aktivitu, orientačně 0–30 % výdeje. Počítá se pomocí MET:
      1 MET = 1 kcal na 1 kg za 1 hodinu. EAT = hmotnost (kg) × MET × čas (h). Příklady MET:
      tenis 5, posilování 6, běh 10 km/h 10.
    exercises:
      - id: vypocet
        type: numeric
        formula: eat
        prompt: "Klient vážící {weight} kg se {minutes} minut věnoval aktivitě s hodnotou {met} MET. Kolik kcal vydal (EAT)?"
        params:
          weight: { min: 50, max: 110, step: 1 }
          minutes: { choices: [{ value: 30, label: "30" }, { value: 45, label: "45" }, { value: 60, label: "60" }, { value: 90, label: "90" }] }
          met: { choices: [{ value: 3, label: "3" }, { value: 5, label: "5" }, { value: 6, label: "6" }, { value: 8, label: "8" }, { value: 10, label: "10" }] }
        unit: kcal
        tolerance: { abs: 3 }
        hint: "EAT = kg × MET × hodiny (minuty převeď na hodiny)."
      - id: met-definice
        type: reveal
        prompt: "Co znamená 1 MET?"
        answer: "Zátěž, při které se spálí 1 kcal na 1 kg tělesné hmotnosti za 1 hodinu."
      - id: vysvetli
        type: explain
        prompt: "Jak spočítáš, kolik energie klient vydá sportem (EAT)?"
        keyPoints:
          - "EAT = energie na cílenou sportovní aktivitu, orientačně 0–30 % výdeje"
          - "1 MET = 1 kcal na 1 kg za 1 hodinu"
          - "EAT = hmotnost (kg) × MET × čas (h)"
        modelAnswer: >-
          EAT je energie vydaná na cílený sport a tvoří orientačně 0–30 % výdeje. Počítám ji pomocí MET,
          kde 1 MET znamená 1 kcal na kilogram za hodinu: EAT = hmotnost × MET × čas v hodinách. Klient
          s 85 kg, který hraje 30 minut tenis (5 MET), vydá 85 × 5 × 0,5 = 212,5 kcal.

  - id: en.tef
    title: Termický efekt potravy (TEF)
    kind: fact
    tier: B
    criteria: [5e, 6b]
    prereqs: [en.tdee-slozky]
    source: { pages: [171], anchor: "TEF bílkovin je nejvyšší a to 25–30 %" }
    explanation: >-
      TEF = energie na trávení a zpracování potravy. Nejvyšší u bílkovin (25–30 %), u sacharidů
      3–10 %, u tuků 3 %. Průměrně 10–15 %; pro praktický výpočet se bere 10 % ze součtu
      BMR + NEAT + EAT.
    exercises:
      - id: zivina
        type: choice
        prompt: "Která živina má nejvyšší termický efekt?"
        options:
          - { text: "Bílkoviny (25–30 %)", correct: true }
          - { text: "Sacharidy", why: "Sacharidy mají TEF 3–10 %." }
          - { text: "Tuky", why: "Tuky mají nejnižší TEF, asi 3 %." }
          - { text: "Všechny mají stejný TEF", why: "Liší se: bílkoviny 25–30 %, sacharidy 3–10 %, tuky 3 %." }
      - id: prakticky
        type: reveal
        prompt: "Jak se TEF zjednodušeně počítá v praxi?"
        answer: "Jako 10 % ze součtu BMR + NEAT + EAT."
      - id: vysvetli
        type: explain
        prompt: "Co je termický efekt potravy, čím se liší mezi živinami a jak s ním počítáš v praxi?"
        keyPoints:
          - "Energie na trávení a zpracování potravy"
          - "Bílkoviny 25–30 %, sacharidy 3–10 %, tuky 3 %"
          - "Průměrně 10–15 %"
          - "Prakticky 10 % ze součtu BMR + NEAT + EAT"
        modelAnswer: >-
          Termický efekt potravy je energie, kterou tělo spotřebuje na trávení a zpracování jídla.
          Nejvyšší je u bílkovin (25–30 %), u sacharidů 3–10 % a u tuků jen 3 %; průměrně jde o 10–15 %.
          V praktickém výpočtu ho beru jako 10 % ze součtu BMR, NEAT a EAT.

  - id: en.tdee-vypocet
    title: Výpočet TDEE po složkách
    kind: procedure
    tier: A
    criteria: [5e, 6b]
    prereqs: [en.bmr-mifflin, en.neat, en.eat, en.tef]
    source: { pages: [170, 171, 172], anchor: "TDEE = BMR + NEAT + EAT + TEF" }
    explanation: >-
      Postup: 1) BMR rovnicí (Katch-McArdle, bez FFM Mifflin-St Jeor), 2) NEAT = BMR × koeficient,
      3) EAT = kg × MET × h, 4) TEF = 10 % z (BMR + NEAT + EAT), 5) sečíst. Vhodné hlavně pro
      nesportující klienty nebo naopak profesionální sportovce.
    exercises:
      - id: vypocet
        type: numeric
        formula: tdee-components
        prompt: >-
          Klient: {sex}, {age} let, {height} cm, {weight} kg. Běžná aktivita odpovídá koeficientu NEAT {coef},
          denně se {minutes} min věnuje sportu s hodnotou {met} MET. Vypočítej TDEE po složkách (BMR podle Mifflin-St Jeor).
        params:
          sex: { choices: [{ value: M, label: muž }, { value: F, label: žena }] }
          age: { min: 20, max: 60, step: 1 }
          height: { min: 158, max: 192, step: 1 }
          weight: { min: 55, max: 105, step: 1 }
          coef: { choices: [{ value: 0.1, label: "0,1" }, { value: 0.2, label: "0,2" }, { value: 0.35, label: "0,35" }] }
          minutes: { choices: [{ value: 30, label: "30" }, { value: 45, label: "45" }, { value: 60, label: "60" }] }
          met: { choices: [{ value: 5, label: "5" }, { value: 6, label: "6" }, { value: 8, label: "8" }] }
        unit: kcal
        tolerance: { abs: 25 }
        hint: "BMR → NEAT (BMR × koef.) → EAT (kg × MET × h) → TEF (10 % součtu) → sečti."
      - id: postup
        type: explain
        prompt: "Popiš krok za krokem, jak spočítáš celkový denní energetický výdej klienta po složkách."
        keyPoints:
          - "BMR predikční rovnicí (Katch-McArdle, jinak Mifflin-St Jeor)"
          - "NEAT = BMR × koeficient (0,1 / 0,2 / 0,35)"
          - "EAT = hmotnost × MET × čas v hodinách"
          - "TEF = 10 % z BMR + NEAT + EAT"
          - "TDEE = součet; výsledek je odhad, ověřit vývojem hmotnosti"
        modelAnswer: >-
          Nejprve stanovím BMR — se známou beztukovou hmotou rovnicí Katch-McArdle, jinak Mifflin-St Jeor.
          NEAT odhadnu násobkem BMR podle běžné aktivity (0,1, 0,2 nebo 0,35). EAT spočítám jako
          hmotnost × MET × čas v hodinách. TEF vezmu jako 10 % součtu BMR, NEAT a EAT. Součtem dostanu
          TDEE, které je jen odhadem a ověřím ho podle vývoje hmotnosti klienta.

  - id: en.tdee-pal
    title: TDEE pomocí PAL
    kind: procedure
    tier: B
    criteria: [5e, 6b]
    prereqs: [en.tdee-vypocet]
    confusableWith: [en.neat]
    source: { pages: [172], anchor: "1,2 pro sedavý způsob života, 1,375 pro lehkou aktivitu" }
    explanation: >-
      Druhý způsob: TDEE = BMR × PAL. PAL: 1,2 sedavý, 1,375 lehká aktivita, 1,55 střední,
      1,725 vysoká, 1,9 extrémně vysoká. Vhodné hlavně pro klienty sportující asi 3–5× týdně.
      Pozor: PAL zahrnuje celý výdej, kdežto koeficient NEAT jen běžnou aktivitu.
    exercises:
      - id: vypocet
        type: numeric
        formula: tdee-pal
        prompt: "BMR klientky je {bmr} kcal a její PAL je {pal}. Jaký je její celkový denní výdej?"
        params:
          bmr: { min: 1200, max: 2000, step: 10 }
          pal: { choices: [{ value: 1.2, label: "1,2" }, { value: 1.375, label: "1,375" }, { value: 1.55, label: "1,55" }, { value: 1.725, label: "1,725" }] }
        unit: kcal
        tolerance: { abs: 10 }
        hint: "TDEE = BMR × PAL"
      - id: kdy
        type: choice
        prompt: "Pro koho je podle skript vhodný výpočet TDEE = BMR × PAL?"
        options:
          - { text: "Pro klienty, kteří pravidelně sportují asi 3–5× týdně", correct: true }
          - { text: "Pro profesionální sportovce s denním tréninkem", why: "U nich skripta doporučují výpočet po složkách." }
          - { text: "Výhradně pro nesportující klienty se sedavou prací", why: "U nesportujících skripta doporučují výpočet po složkách." }
          - { text: "Jen pro klienty se známou beztukovou hmotou (FFM)", why: "Znalost FFM rozhoduje o volbě rovnice pro BMR, ne o použití PAL." }
      - id: vysvetli
        type: explain
        prompt: "Kdy a jak spočítáš celkový výdej klienta pomocí PAL?"
        keyPoints:
          - "TDEE = BMR × PAL"
          - "PAL 1,2 sedavý, 1,375 lehká, 1,55 střední, 1,725 vysoká, 1,9 extrémně vysoká aktivita"
          - "Vhodné hlavně pro klienty sportující asi 3–5× týdně"
          - "PAL zahrnuje celý výdej – nesčítat s NEAT, EAT a TEF"
        modelAnswer: >-
          U klienta, který sportuje zhruba 3–5× týdně, vynásobím BMR koeficientem PAL podle celkové
          aktivity: 1,2 při sedavém způsobu života, 1,375 lehká, 1,55 střední, 1,725 vysoká a 1,9
          extrémně vysoká aktivita. PAL už zahrnuje celý výdej, takže k výsledku nepřičítám NEAT ani
          další složky – na rozdíl od koeficientu NEAT, který pokrývá jen běžnou aktivitu.

  - id: en.chyby
    title: Nejčastější chyby při odhadu výdeje
    kind: concept
    tier: B
    criteria: [5e, 3b]
    prereqs: [en.tdee-slozky]
    source: { pages: [172], anchor: "1 kg svalové hmoty spotřebuje 54,6 kJ / kg / den" }
    explanation: >-
      Časté chyby: neznalost vlastního složení těla, soustředění jen na sport (EAT) a přílišná důvěra
      v tabulky a chytré hodinky (rozdíly v desítkách procent). Sval spotřebuje víc energie než tuk
      (54,6 vs 18,9 kJ/kg/den). Proto je důležitý pravidelný monitoring a sledování trendu.
    exercises:
      - id: chyby
        type: reveal
        prompt: "Jaké jsou nejčastější chyby při stanovení energetického výdeje?"
        answer: "Neznalost složení vlastního těla, soustředění jen na EAT a přílišná důvěra v tabulky či chytré hodinky."

  - id: en.adaptivni-termogeneze
    title: „Zpomalený metabolismus“ a adaptivní termogeneze
    kind: concept
    tier: A
    criteria: [5a, 7a, 10b]
    prereqs: [en.bmr-definice]
    source: { pages: [173], anchor: "Adaptivní termogeneze představuje snížení energetického výdeje" }
    explanation: >-
      Rychlost metabolismu je u dospělých zhruba do 60 let stabilní. „Zpomalení“ po hubnutí má hlavně
      prozaické příčiny: nižší hmotnost znamená nižší potřebu a po dlouhé redukci často klesne NEAT.
      Navíc může působit adaptivní termogeneze — snížení výdeje nad rámec změny hmotnosti a složení
      těla, řádově nižší stovky kcal.
    exercises:
      - id: klientka
        type: explain
        prompt: "Klientka po půl roce hubnutí říká: „Zničila jsem si metabolismus.“ Co jí vysvětlíš?"
        keyPoints:
          - "Nižší hmotnost = nižší energetická potřeba"
          - "Po dlouhé redukci často klesá NEAT (méně spontánního pohybu)"
          - "Adaptivní termogeneze: výdej může klesnout víc, než odpovídá úbytku hmotnosti"
          - "Jde řádově o nižší stovky kcal, ne o „zničený“ metabolismus"
        modelAnswer: >-
          Metabolismus si nezničila. Při nižší hmotnosti tělo potřebuje méně energie a po dlouhé redukci
          se často nevědomky méně hýbe, takže klesne NEAT. Přidat se může adaptivní termogeneze, kdy výdej
          klesne o něco víc, než by odpovídalo úbytku hmotnosti — řádově o nižší stovky kcal.
      - id: definice
        type: choice
        prompt: "Co je adaptivní termogeneze?"
        options:
          - { text: "Pokles výdeje při deficitu, větší než odpovídá úbytku hmotnosti", correct: true }
          - { text: "Zvýšení výdeje na trávení po jídle bohatém na bílkoviny", why: "To popisuje termický efekt potravy (TEF)." }
          - { text: "Trvalé poškození metabolismu po dlouhé a přísné dietě", why: "Skripta mluví o snížení výdeje řádově o nižší stovky kcal, ne o trvalém poškození." }
          - { text: "Postupný pokles BMR s věkem, typicky už po 30. roce", why: "BMR je podle skript stabilní zhruba do 60 let; s deficitem to nesouvisí." }

  - id: en.jojo
    title: Jojo efekt a jak mu předcházet
    kind: concept
    tier: A
    criteria: [10b, 7a, 7b]
    prereqs: [en.adaptivni-termogeneze]
    source: { pages: [173], anchor: "Jojo efekt označuje opakované střídání redukce" }
    explanation: >-
      Jojo efekt = opakované střídání hubnutí a návratu hmotnosti. Přispívají biologické adaptace,
      zvýšený hlad a chuť k jídlu, nižší výdej, návrat ke starým návykům a příliš restriktivní režim.
      Prevence: realistický cíl, postupné udržitelné změny, žádné zbytečné zákazy, oblíbená jídla
      a aktivity, pravidelný pohyb.
    exercises:
      - id: prevence
        type: explain
        prompt: "Jak klientovi pomůžeš, aby po redukci nepřibral zpátky (jojo efekt)?"
        keyPoints:
          - "Realistický cíl a postupné, dlouhodobě udržitelné změny"
          - "Žádné zbytečné zákazy, zařadit oblíbená jídla"
          - "Pravidelný pohyb"
          - "Stravování, které zvládne udržet i po skončení redukce"
        modelAnswer: >-
          Nastavíme realistický cíl a měníme návyky postupně, aby byly udržitelné. Vyhneme se zbytečným
          zákazům, necháme v jídelníčku oblíbená jídla a zařadíme pravidelný pohyb. Cílem je způsob
          stravování, který zvládne držet i po skončení redukční fáze.
      - id: priciny
        type: reveal
        prompt: "Co podle skript přispívá k jojo efektu?"
        answer: >-
          Biologické adaptace po zhubnutí, vyšší hlad a chuť k jídlu, nižší výdej energie, návrat
          k původním návykům a příliš restriktivní, neudržitelný režim.

  - id: en.energeticka-dostupnost
    title: Energetická dostupnost a RED-S
    kind: procedure
    tier: B
    status: course-disputed
    criteria: [7d, 5e]
    prereqs: [en.eat]
    source: { pages: [173, 211], anchor: "Energetická dostupnost (ED) vyjadřuje množství energie" }
    note: >-
      Skripta (s. 173): optimum asi 45 kcal/kg FFM u žen a 40 u mužů. Současné poznatky: konsenzus IOC
      2023 (Mountjoy a kol., BJSM; nyní zkratka REDs) pevné prahy nedoporučuje – 45 kcal/kg FFM pochází
      ze starších studií u žen, hranice 30 jako „nízká ED“ u žen je sporná a u mužů žádná hodnota
      stanovena není (snesou obvykle nižší ED). ED v terénu nelze přesně změřit; RED-S se posuzuje podle
      příznaků. Ke zkoušce: pokud se otázka výslovně ptá na skripta, odpověď je 45 (ženy) / 40 (muži).
    explanation: >-
      Energetická dostupnost (ED) = (denní příjem − energie vydaná na pohyb) / FFM (kg). Optimum asi
      45 kcal/kg FFM u žen a 40 kcal/kg FFM u mužů. Dlouhodobě nízká dostupnost (NED) souvisí
      s RED-S — syndromem relativního nedostatku energie ve sportu.
    exercises:
      - id: vypocet
        type: numeric
        formula: energy-availability
        prompt: >-
          Sportovkyně přijímá {intake} kcal denně, tréninkem vydá {exercise} kcal a má {ffm} kg beztukové
          hmoty. Jaká je její energetická dostupnost (kcal/kg FFM)?
        params:
          intake: { min: 1600, max: 3000, step: 50 }
          exercise: { min: 200, max: 900, step: 50 }
          ffm: { min: 40, max: 60, step: 1 }
        unit: kcal/kg FFM
        tolerance: { abs: 0.6 }
        decimals: 1
        hint: "ED = (příjem − výdej na pohyb) / FFM"
      - id: optimum
        type: choice
        prompt: "Jaká je podle skript optimální energetická dostupnost u žen?"
        options:
          - { text: "Asi 45 kcal/kg FFM", correct: true }
          - { text: "Asi 40 kcal/kg FFM", why: "To je hodnota uváděná pro muže." }
          - { text: "Asi 25 kcal/kg tělesné hmotnosti", why: "ED se vztahuje k beztukové hmotě (FFM), optimum u žen je asi 45 kcal/kg FFM." }
          - { text: "Asi 30 kcal/kg FFM", why: "Kolem 30 kcal/kg FFM se ve starší literatuře kladla hranice nízké dostupnosti u žen, ne optimum; skripta uvádějí optimum asi 45." }
