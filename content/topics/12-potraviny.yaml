            correct: true
          - text: "Krajské hygienické stanice"
            correct: true
          - text: "ČOI"
            correct: true
          - text: "EFSA"
            why: "EFSA je mezinárodní (evropský) úřad."
          - text: "RASFF"
            why: "RASFF je mezinárodní systém rychlého varování."
      - id: vyklad
        type: explain
        prompt: "Vysvětli, kdo v ČR kontroluje potraviny a co který orgán dělá."
        keyPoints:
